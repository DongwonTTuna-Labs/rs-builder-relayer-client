name: Rust CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fmt:
    name: Check formatting and whitespace
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: rust
    steps:
      - name: Checkout
        env:
          FORGEJO_SERVER_URL: https://git.dongwontuna.net
          FORGEJO_REPOSITORY: ${{ github.repository }}
          GIT_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_url="${FORGEJO_SERVER_URL%/}/${FORGEJO_REPOSITORY}.git"
          git init .
          git remote add origin "$repo_url"
          git_fetch() {
            git \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=$GIT_AUTH_TOKEN"; }; f' \
              -c credential.useHttpPath=true \
              "$@"
          }
          git_fetch fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Show Rust toolchain
        run: rustc --version && cargo --version
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check whitespace errors
        run: git diff --check

  clippy:
    name: Run Clippy lints
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: rust
    steps:
      - name: Checkout
        env:
          FORGEJO_SERVER_URL: https://git.dongwontuna.net
          FORGEJO_REPOSITORY: ${{ github.repository }}
          GIT_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_url="${FORGEJO_SERVER_URL%/}/${FORGEJO_REPOSITORY}.git"
          git init .
          git remote add origin "$repo_url"
          git_fetch() {
            git \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=$GIT_AUTH_TOKEN"; }; f' \
              -c credential.useHttpPath=true \
              "$@"
          }
          git_fetch fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Show Rust toolchain
        run: rustc --version && cargo --version
      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Run test suite
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: rust
    steps:
      - name: Checkout
        env:
          FORGEJO_SERVER_URL: https://git.dongwontuna.net
          FORGEJO_REPOSITORY: ${{ github.repository }}
          GIT_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_url="${FORGEJO_SERVER_URL%/}/${FORGEJO_REPOSITORY}.git"
          git init .
          git remote add origin "$repo_url"
          git_fetch() {
            git \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=$GIT_AUTH_TOKEN"; }; f' \
              -c credential.useHttpPath=true \
              "$@"
          }
          git_fetch fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Show Rust toolchain
        run: rustc --version && cargo --version
      - name: Run workspace tests
        run: cargo test --workspace --all-features

  build:
    name: Build all targets
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: rust
    steps:
      - name: Checkout
        env:
          FORGEJO_SERVER_URL: https://git.dongwontuna.net
          FORGEJO_REPOSITORY: ${{ github.repository }}
          GIT_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_url="${FORGEJO_SERVER_URL%/}/${FORGEJO_REPOSITORY}.git"
          git init .
          git remote add origin "$repo_url"
          git_fetch() {
            git \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=$GIT_AUTH_TOKEN"; }; f' \
              -c credential.useHttpPath=true \
              "$@"
          }
          git_fetch fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Show Rust toolchain
        run: rustc --version && cargo --version
      - name: Build workspace targets
        run: cargo build --workspace --all-targets --all-features
