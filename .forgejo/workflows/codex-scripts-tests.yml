name: Codex scripts unit tests

on:
  pull_request:
    paths:
      - ".forgejo/scripts/**"
      - ".forgejo/workflows/codex-pr-review*.yml"
      - ".forgejo/workflows/codex-scripts-tests.yml"
  push:
    branches:
      - main
    paths:
      - ".forgejo/scripts/**"
      - ".forgejo/workflows/codex-pr-review*.yml"
      - ".forgejo/workflows/codex-scripts-tests.yml"
  workflow_dispatch:

jobs:
  unittest:
    name: Run Forgejo Codex script tests
    runs-on: codex
    timeout-minutes: 5
    steps:
      - name: Checkout
        env:
          FORGEJO_SERVER_URL: https://git.dongwontuna.net
          FORGEJO_REPOSITORY: ${{ github.repository }}
          GIT_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_url="${FORGEJO_SERVER_URL%/}/${FORGEJO_REPOSITORY}.git"
          git init .
          git remote add origin "$repo_url"
          git_fetch() {
            git \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=$GIT_AUTH_TOKEN"; }; f' \
              -c credential.useHttpPath=true \
              "$@"
          }
          git_fetch fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Print Python version
        run: python3 --version

      - name: Run unittest
        run: python3 -m unittest discover -s .forgejo/scripts/tests -t .forgejo/scripts -v
