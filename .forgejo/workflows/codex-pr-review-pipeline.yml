          set -euo pipefail
          rm -rf -- artifacts
          mkdir -p artifacts

      - name: Download all findings artifacts
        uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e
        with:
          pattern: codex-review-*-findings
          path: artifacts/
          merge-multiple: true

      - name: Combine findings
        id: combine
        run: |
          set -euo pipefail
          python3 pipeline/.forgejo/scripts/merge_and_gate.py --phase combine
          count=$(python3 -c "import json; print(len(json.load(open('artifacts/combined.json'))))")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          cp artifacts/combined.json "$RUNNER_TEMP/combined.json"

      - name: Build tech-lead prompt
        if: steps.combine.outputs.count != '0'
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}/pipeline
        run: python3 pipeline/.forgejo/scripts/build_prompt.py --axis tech-lead

      - name: Run Codex tech-lead gate
        if: steps.combine.outputs.count != '0'
        env:
          AI_RELAY_API_KEY: ${{ secrets.AI_RELAY_API_KEY }}
          PROMPT_FILE: ${{ runner.temp }}/prompt-tech-lead.md
          SCHEMA_FILE: ${{ github.workspace }}/pipeline/.forgejo/scripts/schemas/decisions.schema.json
          OUT_FILE: ${{ runner.temp }}/codex-output-tech-lead.json
          LOG_FILE: ${{ runner.temp }}/codex-tech-lead.log
          CODEX_WORKSPACE: ${{ runner.temp }}/codex-workspace
          CODEX_REQUIRE_CLEAN_WORKSPACE: "1"
        run: bash pipeline/.forgejo/scripts/codex_exec.sh

      - name: Normalize decisions
        if: steps.combine.outputs.count != '0'
        run: |
          set -euo pipefail
          python3 pipeline/.forgejo/scripts/normalize_codex_output.py --schema decisions
          cp "$RUNNER_TEMP/decisions.json" artifacts/

      - name: Emit empty decisions when no findings
        if: steps.combine.outputs.count == '0'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '%s\n' '{"decisions": [], "merge_notes": [], "judgment": null}' > artifacts/decisions.json

      - name: Upload decisions artifact
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: codex-tech-lead-decisions
          path: artifacts/decisions.json
          retention-days: 7

      - name: Upload combined findings artifact
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: codex-combined-findings
          path: artifacts/combined.json
          retention-days: 7

      - name: Upload axes status artifact
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: codex-axes-status
          path: artifacts/axes_status.json
          retention-days: 7

  post:
    name: post
    needs: tech-lead
    if: inputs.head_sha != '' && inputs.base_sha != '' && inputs.scripts_ref != ''
    runs-on: dongwontuna-labs-runner
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ inputs.head_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      TRIGGER: ${{ inputs.trigger }}
      FORGEJO_API_URL: https://git.dongwontuna.net/api/v1
      FORGEJO_REPOSITORY: ${{ github.repository }}
      FORGEJO_SERVER_URL: https://git.dongwontuna.net
      PYTHONPATH: ${{ github.workspace }}/pipeline/.forgejo/scripts
      ART_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Checkout base ref (trusted scripts)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          GIT_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_url="${FORGEJO_SERVER_URL%/}/${FORGEJO_REPOSITORY}.git"
          rm -rf -- pipeline
          mkdir -p pipeline
          cd pipeline
          git init .
          git remote add origin "$repo_url"
          git_fetch() {
            git \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=$GIT_AUTH_TOKEN"; }; f' \
              -c credential.useHttpPath=true \
              "$@"
          }
          git_fetch fetch --depth=1 origin "$SCRIPTS_REF"
          git checkout --detach FETCH_HEAD

      - name: Prepare clean review artifacts directory
        run: |
          set -euo pipefail
          rm -rf -- artifacts
          mkdir -p artifacts

      - name: Download findings artifacts
        uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e
        with:
          pattern: codex-review-*-findings
          path: artifacts/
          merge-multiple: true

      - name: Download combined findings
