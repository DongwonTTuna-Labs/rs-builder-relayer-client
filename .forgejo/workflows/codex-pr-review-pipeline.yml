        run: python3 pipeline/.forgejo/scripts/build_prompt.py --axis test-coverage

      - name: Run Codex review (test-coverage)
        env:
          AI_RELAY_API_KEY: ${{ secrets.AI_RELAY_API_KEY }}
          PROMPT_FILE: ${{ runner.temp }}/prompt-test-coverage.md
          SCHEMA_FILE: ${{ github.workspace }}/pipeline/.forgejo/scripts/schemas/findings.schema.json
