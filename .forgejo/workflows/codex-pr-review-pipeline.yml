          }
          git_fetch fetch --depth=1 origin "$SCRIPTS_REF"
          git checkout --detach FETCH_HEAD

      - name: Download PR context artifact
        uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e
        with:
          name: codex-review-context
          path: ${{ runner.temp }}

      - name: Prepare clean findings artifact directory
        run: |
          set -euo pipefail
