name: Codex PR Review Pipeline

on:
  workflow_call:
    # Forgejo Actions currently rejects workflow_call.secrets
    # declaration on this instance; callers still pass only the scoped bot token.
    inputs:
      pr_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      scripts_ref:
        required: true
        type: string
      trigger:
        required: false
        type: string
        default: pull_request_target
jobs:
  prepare-context:
    name: prepare-context
    runs-on: dongwontuna-labs-runner
    timeout-minutes: 5
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ inputs.head_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      GITHUB_BASE_REF: ${{ inputs.base_ref }}
      FORGEJO_API_URL: https://git.dongwontuna.net/api/v1
      FORGEJO_REPOSITORY: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/pipeline/.forgejo/scripts
    steps:
      - name: Checkout base ref (trusted scripts)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          FORGEJO_SERVER_URL: https://git.dongwontuna.net
          FORGEJO_REPOSITORY: ${{ github.repository }}
          GIT_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_url="${FORGEJO_SERVER_URL%/}/${FORGEJO_REPOSITORY}.git"
          rm -rf -- pipeline
          mkdir -p pipeline
          cd pipeline
          git init .
          git remote add origin "$repo_url"
          git_fetch() {
            git \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=$GIT_AUTH_TOKEN"; }; f' \
              -c credential.useHttpPath=true \
              "$@"
          }
          git_fetch fetch --depth=1 origin "$SCRIPTS_REF"
          git checkout --detach FETCH_HEAD

      - name: Prepare Forgejo PR review context
        env:
          FORGEJO_BOT_TOKEN: ${{ secrets.CODEX_REVIEW_BOT_TOKEN }}
          FORGEJO_BOT_LOGIN: codex-reviewer-for-dongwonttuna
        run: python3 pipeline/.forgejo/scripts/prepare_pr_context.py

      - name: Stage context for upload
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "$RUNNER_TEMP/pr-context.json" artifacts/pr-context.json

      - name: Upload PR context artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: codex-review-context
          path: artifacts/pr-context.json
          retention-days: 7

  prepare-codex-auth:
    name: prepare-codex-auth
    needs: prepare-context
    runs-on: dongwontuna-labs-runner
    container:
      volumes:
        - /codex-runner-home:/home/runner/.codex
        - /codex-runner-locks:/var/lib/codex-runner/auth-runs-root
    timeout-minutes: 5
    env:
      CODEX_AUTH_COPY_DIR: /var/lib/codex-runner/auth-runs-root/auth-runs/${{ github.repository }}/${{ github.run_id }}
    steps:
      - name: Prepare short-lived per-job Codex auth files
        run: |
          set -euo pipefail
          source_auth=/home/runner/.codex/auth.json
          auth_lock_dir=/var/lib/codex-runner/auth-runs-root/auth
          auth_lock_file="$auth_lock_dir/forgejo-shared.lock"
          install -d -m 700 "$auth_lock_dir"
          exec 9>"$auth_lock_file"
          flock 9
          test -s "$source_auth"
          source_mode="$(stat -c '%a' "$source_auth" 2>/dev/null || printf '600')"
          if [ "$source_mode" = "0" ] || [ "$source_mode" = "000" ]; then
            source_mode=600
          fi
          restore_source_mode() {
            chmod "$source_mode" "$source_auth" 2>/dev/null || true
          }
          trap restore_source_mode EXIT
          chmod u+rw "$source_auth"
          python3 - "$source_auth" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          tokens = data.get("tokens") or {}
          if data.get("auth_mode") != "chatgpt" or not tokens.get("refresh_token"):
              raise SystemExit(f"Codex auth at {path} is not valid ChatGPT-managed auth.")
          print(f"Codex auth source validated: auth_mode={data.get('auth_mode')}")
          PY
          env -u GITHUB_TOKEN -u GIT_AUTH_TOKEN -u FORGEJO_BOT_TOKEN \
            CODEX_HOME=/home/runner/.codex \
            codex login status
          install -d -m 700 "$CODEX_AUTH_COPY_DIR"
          for name in \
            review-correctness \
            review-security \
            review-performance \
            review-test-coverage \
            review-domain \
            tech-lead
          do
            install -d -m 700 "$CODEX_AUTH_COPY_DIR/$name"
            find "$CODEX_AUTH_COPY_DIR/$name" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            cp "$source_auth" "$CODEX_AUTH_COPY_DIR/$name/auth.json"
            chmod 400 "$CODEX_AUTH_COPY_DIR/$name/auth.json"
          done
          restore_source_mode
          trap - EXIT

  review-correctness:
    name: review (correctness)
    needs:
      - prepare-context
      - prepare-codex-auth
    runs-on: dongwontuna-labs-runner
    container:
      volumes:
        - /codex-runner-locks:/var/lib/codex-runner/auth-runs-root
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ inputs.head_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      GITHUB_BASE_REF: ${{ inputs.base_ref }}
      FORGEJO_SERVER_URL: https://git.dongwontuna.net
      FORGEJO_REPOSITORY: ${{ github.repository }}
      PYTHONPATH: ${{ github.workspace }}/pipeline/.forgejo/scripts
      CODEX_AUTH_FILE: /var/lib/codex-runner/auth-runs-root/auth-runs/${{ github.repository }}/${{ github.run_id }}/review-correctness/auth.json
    steps:
      - name: Checkout base ref (trusted scripts)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          GIT_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_url="${FORGEJO_SERVER_URL%/}/${FORGEJO_REPOSITORY}.git"
          rm -rf -- pipeline
          mkdir -p pipeline
          cd pipeline
          git init .
          git remote add origin "$repo_url"
          git_fetch() {
            git \
              -c credential.helper='!f() { echo username=x-access-token; echo "password=$GIT_AUTH_TOKEN"; }; f' \
              -c credential.useHttpPath=true \
              "$@"
          }
          git_fetch fetch --depth=1 origin "$SCRIPTS_REF"
          git checkout --detach FETCH_HEAD

      - name: Download PR context artifact
        uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e
        with:
          name: codex-review-context
          path: ${{ runner.temp }}

      - name: Prepare clean findings artifact directory
        run: |
          set -euo pipefail
          rm -rf -- artifacts
          mkdir -p artifacts

      - name: Build axis prompt
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}/pipeline
        run: python3 pipeline/.forgejo/scripts/build_prompt.py --axis correctness

      - name: Run Codex review (correctness)
        env:
          PROMPT_FILE: ${{ runner.temp }}/prompt-correctness.md
          SCHEMA_FILE: ${{ github.workspace }}/pipeline/.forgejo/scripts/schemas/findings.schema.json
          OUT_FILE: ${{ runner.temp }}/codex-output-correctness.json
          LOG_FILE: ${{ runner.temp }}/codex-correctness.log
          CODEX_WORKSPACE: ${{ runner.temp }}/codex-workspace
          CODEX_REQUIRE_CLEAN_WORKSPACE: "1"
          CODEX_AUTH_DELETE_SOURCE_AFTER_RUNTIME_COPY: "1"
        run: bash pipeline/.forgejo/scripts/codex_exec.sh

      - name: Normalize findings
        run: python3 pipeline/.forgejo/scripts/normalize_codex_output.py --schema findings --axis correctness

      - name: Stage findings into artifacts
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/findings-correctness.json" artifacts/

      - name: Upload findings artifact
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: codex-review-correctness-findings
          path: artifacts/findings-correctness.json
          retention-days: 7

