# Codex Review v3 runtime configuration.
# Repository-specific values may be adjusted before enabling trusted write/push stages.

base_branch: main

trusted:
  user: DongwonTTuna
  codex_review_authors:
    - codex-reviewer-for-dongwonttuna
    - codex-reviewer-for-dongwonttuna[bot]

review:
  axes:
    - correctness
    - security
    - performance
    - test-coverage
    - domain
  max_findings_per_axis: 13
  max_inline_comments: 12
  max_inline_comments_per_file: 3
  require_changed_right_line: true

lifecycle:
  max_threads_per_triage: 16
  max_root_cause_groups_per_run: 8
  char_budget: 24000
  terminal_states:
    - resolved_by_code
    - defer_to_issue
    - duplicate_of_issue
    - false_positive
    - stale_obsolete
  non_terminal_states:
    - fix_now
    - current_head_keep_open
    - needs_human
    - blocked_by_conflict

design:
  require_design_chief: true
  max_clusters: 12
  max_cluster_analysis_batch_size: 4

autofix:
  enabled: true
  max_tasks: 4
  max_commits: 0
  max_files: 8
  max_patch_bytes: 120000
  allowed_prefixes:
    - src/
    - tests/
    - docs/
    - .github/scripts/
  forbidden_prefixes:
    - .codex/
    - .github/actions/
    - .github/workflows/
    - setup/codex-review/prompts/
    - setup/codex-review/schemas/
  forbidden_files:
    - Cargo.toml
    - Cargo.lock
  dangerous_keywords:
    - api key
    - auth
    - calldata
    - eip-712
    - exported
    - live-capable
    - nonce
    - private key
    - public api
    - secret
    - serde
    - signature
    - signing
    - wallet
    - wallet-create
    - wire

tests:
  allowlist:
    cargo_fmt: cargo fmt --all --check
    cargo_test: cargo test --workspace --all-features
  default_ids:
    - cargo_fmt
    - cargo_test
