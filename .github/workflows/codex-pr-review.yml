          \`\`\`json
          EOF
            cat "$batch_file"
            cat <<'EOF'
          ```

          Review context:
          EOF
            cat "$context_file"
            cat <<'EOF'

          Changed files:
          EOF
            cat "$changed_files"
          } > "$prompt_file"

      - name: Setup Codex relay
        id: relay-token
        uses: DongwonTTuna-Labs/home-server-infra/.github/actions/setup-codex-relay@303c5cf108ee5c0cb56035023fc7342f76e1e8cb
        with:
          codex-home: ${{ runner.temp }}/codex-home-design-analyze-${{ matrix.batch }}
          trusted-actors: DongwonTTuna,codex-reviewer-for-dongwonttuna[bot]

      - name: Validate Codex relay args
        env:
          CODEX_ARGS: ${{ steps.relay-token.outputs.codex_args }}
        shell: bash
        run: |
          set -euo pipefail
          expected="85f8c7646018470593ddd2e6e2dddfe750ac8edbbe71a4122bd538fb60540898"
          actual="$(printf '%s' "$CODEX_ARGS" | sha256sum | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Run design cluster analyst
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
        with:
          prompt-file: ${{ runner.temp }}/prompt-design-analyze-${{ matrix.batch }}.md
          output-schema: |
            {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "type": "object",
              "additionalProperties": false,
              "required": ["batch", "cluster_analyses", "batch_notes"],
              "properties": {
                "batch": { "type": "integer", "minimum": 0 },
                "cluster_analyses": {
                  "type": "array",
                  "maxItems": 3,
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["cluster_id", "root_cause", "affected_surface", "invariants", "retired_approaches", "conflict_candidates", "test_needs"],
                    "properties": {
                      "cluster_id": { "type": "string", "pattern": "^cluster-[0-9]+$" },
                      "root_cause": { "type": "string", "minLength": 1, "maxLength": 900 },
                      "affected_surface": {
                        "type": "array",
                        "maxItems": 12,
                        "items": { "type": "string", "minLength": 1, "maxLength": 180 }
                      },
                      "invariants": {
                        "type": "array",
                        "maxItems": 10,
                        "items": { "type": "string", "minLength": 1, "maxLength": 300 }
                      },
                      "retired_approaches": {
                        "type": "array",
                        "maxItems": 8,
                        "items": { "type": "string", "minLength": 1, "maxLength": 300 }
                      },
                      "conflict_candidates": {
                        "type": "array",
                        "maxItems": 8,
                        "items": { "type": "string", "minLength": 1, "maxLength": 300 }
                      },
                      "test_needs": {
                        "type": "array",
                        "maxItems": 10,
                        "items": { "type": "string", "minLength": 1, "maxLength": 300 }
                      }
                    }
                  }
                },
                "batch_notes": {
                  "type": "array",
                  "maxItems": 8,
                  "items": { "type": "string", "minLength": 1, "maxLength": 300 }
                }
              }
            }
          output-file: ${{ runner.temp }}/cluster-analysis-${{ matrix.batch }}.json
          working-directory: ${{ github.workspace }}/workspace
          codex-home: ${{ runner.temp }}/codex-home-design-analyze-${{ matrix.batch }}
          sandbox: read-only
          safety-strategy: read-only
          codex-version: latest
          model: gpt-5.5
          effort: xhigh
          codex-args: ${{ steps.relay-token.outputs.codex_args }}

      - name: Validate cluster analysis
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          batch = int(os.environ["BATCH"])
          source = Path(os.environ["RUNNER_TEMP"]) / f"cluster-analysis-{batch}.json"
          data = json.loads(source.read_text(encoding="utf-8"))
          if data.get("batch") != batch:
              raise SystemExit(f"batch mismatch: {data.get('batch')} != {batch}")
          out = Path("artifacts") / f"cluster-analysis-{batch}.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload cluster analysis
        uses: actions/upload-artifact@v7
        with:
          name: codex-design-cluster-analysis-${{ matrix.batch }}
          path: artifacts/cluster-analysis-${{ matrix.batch }}.json
          retention-days: 7

  design-coordinate:
    name: design-coordinate
    needs: [resolve, tech-lead, design-normalize, design-cluster, design-analyze]
    if: needs.resolve.outputs.should_run == 'true' && needs.tech-lead.outputs.needs_design == 'true' && needs.design-analyze.result == 'success'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted PR scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Download tech-lead inputs
        uses: actions/download-artifact@v8
        with:
          name: codex-review-tech-lead-decisions
          path: artifacts

      - name: Download refreshed review context
        uses: actions/download-artifact@v8
        with:
          name: codex-design-review-context
          path: artifacts

      - name: Download normalized inventory
        uses: actions/download-artifact@v8
        with:
          name: codex-design-normalized
          path: artifacts

      - name: Download design clusters
        uses: actions/download-artifact@v8
        with:
          name: codex-design-clusters
          path: artifacts

      - name: Download cluster analyses
        uses: actions/download-artifact@v8
        with:
          pattern: codex-design-cluster-analysis-*
          path: artifacts/cluster-analyses
          merge-multiple: true

      - name: Build coordinator prompt
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          agent_file="trusted/.codex/agents/design-coordinator.md"
          skill_file="trusted/.codex/skills/review-design-coordinator/SKILL.md"
          docs_file="${RUNNER_TEMP}/design-docs.md"
          changed_files="${RUNNER_TEMP}/changed-files-design-coordinate.txt"
          analyses_file="${RUNNER_TEMP}/cluster-analyses.json"
          prompt_file="${RUNNER_TEMP}/prompt-design-coordinate.md"

          test -f "$agent_file" || { echo "missing design agent: $agent_file" >&2; exit 1; }
          test -f "$skill_file" || { echo "missing required design skill: $skill_file" >&2; exit 1; }
          git -C workspace diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"

          {
            for file in \
              AGENTS.md \
              docs/FORKED_RELAYER_CRATE.md \
              docs/DEPOSIT_WALLET_RELAYER_DESIGN.md \
              docs/TESTING.md \
              docs/REVIEW_CHECKLIST.md
            do
              if [ -f "workspace/$file" ]; then
                printf '## %s\n\n' "$file"
                sed -n '1,220p' "workspace/$file"
                printf '\n\n'
              fi
            done
          } > "$docs_file"
          if [ "$(wc -c < "$docs_file")" -gt 80000 ]; then
            head -c 80000 "$docs_file" > "${docs_file}.tmp"
            printf '\n...[truncated]\n' >> "${docs_file}.tmp"
            mv "${docs_file}.tmp" "$docs_file"
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          items = []
          for path in sorted(Path("artifacts/cluster-analyses").glob("cluster-analysis-*.json")):
              items.append(json.loads(path.read_text(encoding="utf-8")))
          Path(os.environ["RUNNER_TEMP"], "cluster-analyses.json").write_text(
              json.dumps(items, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          {
            cat "$skill_file"
            printf '\n---\n\n'
            cat "$agent_file"
            cat <<EOF

          ---

          Return only JSON matching the inline output schema supplied to openai/codex-action.
          Write human-readable fields in Korean.
          You are the only final design authority in this stage.
          Inspect the checked-out workspace directly. Use current files as the source of truth. When useful, compare against a review thread commit, original commit, or BASE_SHA=${BASE_SHA} / HEAD_SHA=${HEAD_SHA}.

          Review context:
          EOF
            cat artifacts/review-context.md
            cat <<'EOF'

          Combined findings:
          ```json
          EOF
            cat artifacts/combined-findings.json
            cat <<'EOF'
          ```

          Tech-lead decisions:
          ```json
          EOF
            cat artifacts/decisions-tech-lead.json
            cat <<'EOF'
          ```

          Normalized inventory:
          ```json
          EOF
            cat artifacts/normalized-inventory.json
            cat <<'EOF'
          ```

          Clusters:
          ```json
          EOF
            cat artifacts/clusters.json
            cat <<'EOF'
          ```

          Cluster analyses:
          ```json
          EOF
            cat "$analyses_file"
            cat <<'EOF'
          ```

          Relevant docs:
          EOF
            cat "$docs_file"
            cat <<'EOF'

          Changed files:
          EOF
            cat "$changed_files"
          } > "$prompt_file"

      - name: Setup Codex relay
        id: relay-token
        uses: DongwonTTuna-Labs/home-server-infra/.github/actions/setup-codex-relay@303c5cf108ee5c0cb56035023fc7342f76e1e8cb
        with:
          codex-home: ${{ runner.temp }}/codex-home-design-coordinate
          trusted-actors: DongwonTTuna,codex-reviewer-for-dongwonttuna[bot]

      - name: Validate Codex relay args
        env:
          CODEX_ARGS: ${{ steps.relay-token.outputs.codex_args }}
        shell: bash
        run: |
          set -euo pipefail
          expected="85f8c7646018470593ddd2e6e2dddfe750ac8edbbe71a4122bd538fb60540898"
          actual="$(printf '%s' "$CODEX_ARGS" | sha256sum | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Run design coordinator
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
        with:
          prompt-file: ${{ runner.temp }}/prompt-design-coordinate.md
          output-schema: |
            {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "type": "object",
              "additionalProperties": false,
              "required": ["version", "summary", "root_cause", "invariants", "retired_approaches", "intended_architecture", "edit_sequence", "tests", "acceptance_criteria", "open_questions"],
              "properties": {
                "version": { "type": "integer", "enum": [1] },
                "summary": { "type": "string", "minLength": 1, "maxLength": 1000 },
                "root_cause": { "type": "string", "minLength": 1, "maxLength": 1400 },
                "invariants": {
                  "type": "array",
                  "minItems": 1,
                  "maxItems": 12,
                  "items": { "type": "string", "minLength": 1, "maxLength": 400 }
                },
                "retired_approaches": {
                  "type": "array",
                  "maxItems": 12,
                  "items": { "type": "string", "minLength": 1, "maxLength": 400 }
                },
                "intended_architecture": {
                  "type": "array",
                  "minItems": 1,
                  "maxItems": 12,
                  "items": { "type": "string", "minLength": 1, "maxLength": 500 }
                },
                "edit_sequence": {
                  "type": "array",
                  "minItems": 1,
                  "maxItems": 14,
                  "items": { "type": "string", "minLength": 1, "maxLength": 500 }
                },
                "tests": {
                  "type": "array",
                  "minItems": 1,
                  "maxItems": 14,
                  "items": { "type": "string", "minLength": 1, "maxLength": 500 }
                },
                "acceptance_criteria": {
                  "type": "array",
                  "minItems": 1,
                  "maxItems": 14,
                  "items": { "type": "string", "minLength": 1, "maxLength": 500 }
                },
                "open_questions": {
                  "type": "array",
                  "maxItems": 8,
                  "items": { "type": "string", "minLength": 1, "maxLength": 500 }
                }
              }
            }
          output-file: ${{ runner.temp }}/design-plan.json
          working-directory: ${{ github.workspace }}/workspace
          codex-home: ${{ runner.temp }}/codex-home-design-coordinate
          sandbox: read-only
          safety-strategy: read-only
          codex-version: latest
          model: gpt-5.5
          effort: xhigh
          codex-args: ${{ steps.relay-token.outputs.codex_args }}

      - name: Render design plan
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "${RUNNER_TEMP}/design-plan.json" artifacts/design-plan.json
          python3 trusted/.github/scripts/post_review.py render-design-plan \
            --plan artifacts/design-plan.json \
            --output artifacts/design-plan.md

      - name: Upload design plan
        uses: actions/upload-artifact@v7
        with:
          name: codex-design-plan
          path: |
            artifacts/design-plan.json
            artifacts/design-plan.md
          retention-days: 7

  design-post:
    name: design-post
    needs: [resolve, tech-lead, design-coordinate]
    if: needs.resolve.outputs.should_run == 'true' && needs.tech-lead.outputs.needs_design == 'true' && needs.design-coordinate.result == 'success'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - name: Checkout trusted PR scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Download design plan
        uses: actions/download-artifact@v8
        with:
          name: codex-design-plan
          path: artifacts

      - name: Validate current PR state
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          BASE_REF: ${{ needs.resolve.outputs.base_ref }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          HEAD_REPO: ${{ needs.resolve.outputs.head_repo }}
          PR_AUTHOR: ${{ needs.resolve.outputs.pr_author }}
        run: python3 trusted/.github/scripts/post_review.py validate-current-pr-state

      - name: Generate App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Post sticky design plan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          BASE_REF: ${{ needs.resolve.outputs.base_ref }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          HEAD_REPO: ${{ needs.resolve.outputs.head_repo }}
          PR_AUTHOR: ${{ needs.resolve.outputs.pr_author }}
        run: python3 trusted/.github/scripts/post_review.py post-design-plan --body artifacts/design-plan.md

  post:
    name: post
    needs: [resolve, review, tech-lead]
    if: needs.resolve.outputs.should_run == 'true' && needs.tech-lead.result == 'success'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - name: Checkout trusted PR scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Download reviewer findings
        uses: actions/download-artifact@v8
        with:
          pattern: codex-review-*-findings
          path: artifacts
          merge-multiple: true

      - name: Download tech-lead decisions
        uses: actions/download-artifact@v8
        with:
          name: codex-review-tech-lead-decisions
          path: artifacts

      - name: Validate current PR state
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          BASE_REF: ${{ needs.resolve.outputs.base_ref }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          HEAD_REPO: ${{ needs.resolve.outputs.head_repo }}
          PR_AUTHOR: ${{ needs.resolve.outputs.pr_author }}
        run: python3 trusted/.github/scripts/post_review.py validate-current-pr-state

      - name: Generate App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Post PR review
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          BASE_REF: ${{ needs.resolve.outputs.base_ref }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          HEAD_REPO: ${{ needs.resolve.outputs.head_repo }}
          PR_AUTHOR: ${{ needs.resolve.outputs.pr_author }}
        run: >-
          python3 trusted/.github/scripts/post_review.py post-current
          --artifacts artifacts
          --decisions artifacts/decisions-tech-lead.json
