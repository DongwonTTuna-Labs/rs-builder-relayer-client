      - name: Validate and batch clusters
        id: batch
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["RUNNER_TEMP"]) / "clusters.json"
          data = json.loads(source.read_text(encoding="utf-8"))
          clusters = data.get("clusters")
          if not isinstance(clusters, list):
              raise SystemExit("clusters must be an array")
          artifacts = Path("artifacts")
          batch_dir = artifacts / "cluster-batches"
          batch_dir.mkdir(parents=True, exist_ok=True)
          (artifacts / "clusters.json").write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          if not clusters:
              batches = [{"clusters": []}]
          else:
              batches = [{"clusters": clusters[index:index + 3]} for index in range(0, len(clusters), 3)]
          batch_indexes = []
          for index, batch in enumerate(batches):
              (batch_dir / f"cluster-batch-{index}.json").write_text(
                  json.dumps(batch, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              batch_indexes.append(index)
          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a", encoding="utf-8") as output:
                  output.write("batch_indexes=" + json.dumps(batch_indexes) + "\n")
          PY

