      - name: Build normalizer prompt
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          agent_file="trusted/.codex/agents/design-finding-normalizer.md"
          skill_file="trusted/.codex/skills/review-design-finding-normalizer/SKILL.md"
          combined_file="artifacts/combined-findings.json"
