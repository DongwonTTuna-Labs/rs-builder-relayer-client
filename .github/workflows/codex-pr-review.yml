name: Codex PR Review

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request_target' && github.event.sender.login == 'DongwonTTuna') || (github.event_name == 'issue_comment' && github.actor == 'DongwonTTuna' && github.triggering_actor == 'DongwonTTuna' && contains(github.event.comment.body, '/codex-review')) }}

jobs:
  resolve:
    name: resolve
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      issues: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      head_ref: ${{ steps.resolve.outputs.head_ref }}
      head_repo: ${{ steps.resolve.outputs.head_repo }}
      pr_author: ${{ steps.resolve.outputs.pr_author }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      trigger: ${{ steps.resolve.outputs.trigger }}
      trigger_class: ${{ steps.resolve.outputs.trigger_class }}
    steps:
      - name: Checkout workflow helper
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: workflow
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve PR metadata
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: python3 workflow/.github/scripts/post_review.py resolve-current

  review:
    name: review-${{ matrix.axis }}
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        axis: [correctness, security, performance, test-coverage, domain]
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted PR scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Build reviewer prompt
        env:
          AXIS: ${{ matrix.axis }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          TRIGGER: ${{ needs.resolve.outputs.trigger }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          agent_file="trusted/.codex/agents/${AXIS}-reviewer.md"
          prompt_file="${RUNNER_TEMP}/prompt-${AXIS}.md"
          review_context="${RUNNER_TEMP}/review-context-${AXIS}.md"
          changed_files="${RUNNER_TEMP}/changed-files-${AXIS}.txt"

          test -f "$agent_file" || { echo "missing reviewer agent: $agent_file" >&2; exit 1; }
          python3 trusted/.github/scripts/post_review.py build-review-context --output "$review_context"
          git -C workspace diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"

          {
            cat "$agent_file"
            cat <<EOF

          ---

          Current GitHub workflow contract supersedes legacy Forgejo path references above.

          Return only JSON matching the inline output schema supplied to openai/codex-action.

          Rules:
          - Use agent "${AXIS}" exactly.
          - Return at most 13 findings.
          - Use the same root_cause_key for findings that should become one representative inline comment or one deferred issue.
          - Mark scope as current_pr, deferred, or needs_human.
          - Set public_api_risk=true when an exported Rust API, serde-visible DTO, feature flag, or public module boundary may change.
          - Use line numbers from the RIGHT side of the diff only. Use null file/line for cross-cutting findings.
          - Write every human-readable review string in Korean: title, reason, positive notes, and impact summary fields.
          - Keep schema field names, enum values, finding ids, file paths, code identifiers, and quoted code in their original language.
          - Do not include secrets, tokens, or private keys.
          - Do not modify files or post comments.
          - Inspect the checked-out PR head workspace directly.
          - Use current files as the source of truth.
          - When useful, compare against a review thread commit, original commit, or base/head range.
          - Use commands such as git show, git diff, git log, grep, sed, and find as needed.
          - BASE_SHA=${BASE_SHA} and HEAD_SHA=${HEAD_SHA} are available, but the full PR diff is not the only relevant evidence.

          Pull request:
          - repository: ${GITHUB_REPOSITORY}
          - pr_number: ${PR_NUMBER}
          - base_sha: ${BASE_SHA}
          - head_sha: ${HEAD_SHA}
          - trigger: ${TRIGGER}

          Review context:
          EOF
            cat "$review_context"
            cat <<'EOF'

          Changed files:
          EOF
            cat "$changed_files"
          } > "$prompt_file"

      - name: Setup Codex relay
        id: relay-token
        uses: DongwonTTuna-Labs/home-server-infra/.github/actions/setup-codex-relay@303c5cf108ee5c0cb56035023fc7342f76e1e8cb
        with:
          codex-home: ${{ runner.temp }}/codex-home-${{ matrix.axis }}
          trusted-actors: DongwonTTuna,codex-reviewer-for-dongwonttuna[bot]

      - name: Validate Codex relay args
        env:
          CODEX_ARGS: ${{ steps.relay-token.outputs.codex_args }}
        shell: bash
        run: |
          set -euo pipefail
          expected="85f8c7646018470593ddd2e6e2dddfe750ac8edbbe71a4122bd538fb60540898"
          actual="$(printf '%s' "$CODEX_ARGS" | sha256sum | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Run Codex reviewer
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
        with:
          prompt-file: ${{ runner.temp }}/prompt-${{ matrix.axis }}.md
          output-schema: |
            {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "type": "object",
              "additionalProperties": false,
              "required": ["agent", "findings", "positive", "impact_summary"],
              "properties": {
                "agent": {
                  "type": "string",
                  "enum": ["correctness", "security", "performance", "test-coverage", "domain"]
                },
                "findings": {
                  "type": "array",
                  "maxItems": 13,
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["id", "type", "file", "line", "title", "reason", "rule_ref", "cross_cutting", "root_cause_key", "scope", "public_api_risk", "autofix_eligible_hint"],
                    "properties": {
                      "id": {
                        "type": "string",
                        "pattern": "^(correctness|security|performance|test-coverage|domain)-[0-9]+$"
                      },
                      "type": {
                        "type": "string",
                        "enum": ["MUST", "SUGGEST", "IMO", "NITS", "ASK"]
                      },
                      "file": {
                        "type": ["string", "null"]
                      },
                      "line": {
                        "type": ["integer", "null"],
                        "minimum": 1
                      },
                      "title": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 200
                      },
                      "reason": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 1000
                      },
                      "rule_ref": {
                        "type": ["string", "null"],
                        "maxLength": 200
                      },
                      "cross_cutting": {
                        "type": "boolean"
                      },
                      "root_cause_key": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 120
                      },
                      "scope": {
                        "type": "string",
                        "enum": ["current_pr", "deferred", "needs_human"]
                      },
                      "public_api_risk": {
                        "type": "boolean"
                      },
                      "autofix_eligible_hint": {
                        "type": "boolean"
                      }
                    }
                  }
                },
                "positive": {
                  "type": "array",
                  "maxItems": 2,
                  "items": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 200
                  }
                },
                "impact_summary": {
                  "anyOf": [
                    {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["scope", "backward_compat", "external_integration", "env_settings", "other_notes"],
                      "properties": {
                        "scope": { "type": "string" },
                        "backward_compat": { "type": "string" },
                        "external_integration": { "type": "string" },
                        "env_settings": { "type": "string" },
                        "other_notes": { "type": "string" }
                      }
                    },
                    { "type": "null" }
                  ]
                }
              }
            }
          output-file: ${{ runner.temp }}/findings-${{ matrix.axis }}.json
          working-directory: ${{ github.workspace }}/workspace
          codex-home: ${{ runner.temp }}/codex-home-${{ matrix.axis }}
          sandbox: read-only
          safety-strategy: read-only
          codex-version: latest
          model: gpt-5.5
          effort: xhigh
          codex-args: ${{ steps.relay-token.outputs.codex_args }}

      - name: Validate reviewer findings
        env:
          AXIS: ${{ matrix.axis }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          axis = os.environ["AXIS"]
          source = Path(os.environ["RUNNER_TEMP"]) / f"findings-{axis}.json"
          data = json.loads(source.read_text(encoding="utf-8"))
          if data.get("agent") != axis:
              raise SystemExit(f"agent mismatch: {data.get('agent')} != {axis}")
          findings = data.get("findings")
          if not isinstance(findings, list):
              raise SystemExit("findings must be an array")
          if len(findings) > 13:
              raise SystemExit("too many findings")
          out = Path("artifacts") / f"findings-{axis}.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload reviewer findings
        uses: actions/upload-artifact@v7
        with:
          name: codex-review-${{ matrix.axis }}-findings
          path: artifacts/findings-${{ matrix.axis }}.json
          retention-days: 7

  tech-lead:
    name: tech-lead
    needs: [resolve, review]
    if: needs.resolve.outputs.should_run == 'true'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    timeout-minutes: 30
    outputs:
      needs_design: ${{ steps.design_need.outputs.needs_design }}
      blocking_count: ${{ steps.design_need.outputs.blocking_count }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted PR scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Download reviewer findings
        uses: actions/download-artifact@v8
        with:
          pattern: codex-review-*-findings
          path: artifacts
          merge-multiple: true

      - name: Combine reviewer findings
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          axes = ("correctness", "security", "performance", "test-coverage", "domain")
          artifacts = Path("artifacts")
          missing = [axis for axis in axes if not (artifacts / f"findings-{axis}.json").exists()]
          if missing:
              raise SystemExit("missing reviewer artifacts: " + ", ".join(missing))
          combined = []
          for axis in axes:
              payload = json.loads((artifacts / f"findings-{axis}.json").read_text(encoding="utf-8"))
              if payload.get("agent") != axis:
                  raise SystemExit(f"agent mismatch in findings-{axis}.json")
              for finding in payload.get("findings", []):
                  item = dict(finding)
                  item["agent"] = axis
                  combined.append(item)
          combined_path = artifacts / "combined-findings.json"
          combined_path.write_text(json.dumps(combined, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Build tech-lead prompt
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          agent_file="trusted/.codex/agents/tech-lead-reviewer.md"
          combined_file="artifacts/combined-findings.json"
          changed_files="${RUNNER_TEMP}/changed-files-tech-lead.txt"
          review_context="artifacts/review-context.md"
          prompt_file="${RUNNER_TEMP}/prompt-tech-lead.md"

          test -f "$agent_file" || { echo "missing tech-lead agent: $agent_file" >&2; exit 1; }
          test -f "$combined_file" || { echo "missing combined findings: $combined_file" >&2; exit 1; }
          python3 trusted/.github/scripts/post_review.py build-review-context --output "$review_context"
          git -C workspace diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"

          {
            cat "$agent_file"
            cat <<EOF

          ---

          Current GitHub workflow contract supersedes legacy Forgejo path references above.

          Language rules:
          - Write every human-readable decision string in Korean: decision reasons, judgment headline, and merge note reasons.
          - Keep schema field names, enum values, finding ids, file paths, code identifiers, and quoted code in their original language.
          - For each decision, choose action explicitly:
            publish_and_fix_now, summary_only_fix_now, defer_to_issue, deny_false_positive, or needs_human.
          - Use publish_and_fix_now only for one representative finding per root cause.
          - Use needs_human for public API risk, security ambiguity, wire format/signing/nonce ambiguity, or live-capable behavior.

          Repository inspection:
          - Inspect the checked-out PR head workspace directly.
          - Use current files as the source of truth.
          - When useful, compare against a review thread commit, original commit, or base/head range.
          - Use commands such as git show, git diff, git log, grep, sed, and find as needed.
          - BASE_SHA=${BASE_SHA} and HEAD_SHA=${HEAD_SHA} are available, but the full PR diff is not the only relevant evidence.

          Combined findings:
          EOF
            cat <<'EOF'
          ```json
          EOF
            cat "$combined_file"
            cat <<'EOF'
          ```

          Review context:
          EOF
            cat "$review_context"
            cat <<'EOF'

          Changed files:
          EOF
            cat "$changed_files"
          } > "$prompt_file"

      - name: Setup Codex relay
        id: relay-token
        uses: DongwonTTuna-Labs/home-server-infra/.github/actions/setup-codex-relay@303c5cf108ee5c0cb56035023fc7342f76e1e8cb
        with:
          codex-home: ${{ runner.temp }}/codex-home-tech-lead
          trusted-actors: DongwonTTuna,codex-reviewer-for-dongwonttuna[bot]

      - name: Validate Codex relay args
        env:
          CODEX_ARGS: ${{ steps.relay-token.outputs.codex_args }}
        shell: bash
        run: |
          set -euo pipefail
          expected="85f8c7646018470593ddd2e6e2dddfe750ac8edbbe71a4122bd538fb60540898"
          actual="$(printf '%s' "$CODEX_ARGS" | sha256sum | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Run tech-lead gate
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
        with:
          prompt-file: ${{ runner.temp }}/prompt-tech-lead.md
          output-schema: |
            {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "type": "object",
              "additionalProperties": false,
              "required": ["decisions", "judgment", "merge_notes"],
              "properties": {
                "decisions": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["id", "action", "primary_root_cause_key", "reason"],
                    "properties": {
                      "id": {
                        "type": "string",
                        "pattern": "^(correctness|security|performance|test-coverage|domain)-[0-9]+$"
                      },
                      "action": {
                        "type": "string",
                        "enum": ["publish_and_fix_now", "summary_only_fix_now", "defer_to_issue", "deny_false_positive", "needs_human"]
                      },
                      "primary_root_cause_key": {
                        "type": ["string", "null"],
                        "minLength": 1,
                        "maxLength": 120
                      },
                      "reason": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 300
                      }
                    }
                  }
                },
                "judgment": {
                  "anyOf": [
                    {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["status", "headline"],
                      "properties": {
                        "status": {
                          "type": "string",
                          "enum": ["LGTM", "NEEDS_CLARIFICATION", "NEEDS_WORK"]
                        },
                        "headline": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 200
                        }
                      }
                    },
                    { "type": "null" }
                  ]
                },
                "merge_notes": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["primary_id", "merged_ids", "reason"],
                    "properties": {
                      "primary_id": {
                        "type": "string",
                        "pattern": "^(correctness|security|performance|test-coverage|domain)-[0-9]+$"
                      },
                      "merged_ids": {
                        "type": "array",
                        "minItems": 1,
                        "items": {
                          "type": "string",
                          "pattern": "^(correctness|security|performance|test-coverage|domain)-[0-9]+$"
                        }
                      },
                      "reason": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 300
                      }
                    }
                  }
                }
              }
            }
          output-file: ${{ runner.temp }}/decisions-tech-lead.json
          working-directory: ${{ github.workspace }}/workspace
          codex-home: ${{ runner.temp }}/codex-home-tech-lead
          sandbox: read-only
          safety-strategy: read-only
          codex-version: latest
          model: gpt-5.5
          effort: xhigh
          codex-args: ${{ steps.relay-token.outputs.codex_args }}

      - name: Validate tech-lead decisions
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["RUNNER_TEMP"]) / "decisions-tech-lead.json"
          data = json.loads(source.read_text(encoding="utf-8"))
          if not isinstance(data.get("decisions"), list):
              raise SystemExit("decisions must be an array")
          combined = json.loads(Path("artifacts/combined-findings.json").read_text(encoding="utf-8"))
          expected = {str(item["id"]) for item in combined}
          actual = {str(item.get("id") or "") for item in data["decisions"]}
          if actual != expected:
              raise SystemExit(f"decision ids mismatch: missing={sorted(expected - actual)} extra={sorted(actual - expected)}")
          out = Path("artifacts") / "decisions-tech-lead.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Classify design need
        id: design_need
        run: >-
          python3 trusted/.github/scripts/post_review.py classify-design-need
          --artifacts artifacts
          --decisions artifacts/decisions-tech-lead.json

      - name: Upload tech-lead decisions
        uses: actions/upload-artifact@v7
        with:
          name: codex-review-tech-lead-decisions
          path: |
            artifacts/decisions-tech-lead.json
            artifacts/combined-findings.json
            artifacts/review-context.md
          retention-days: 7

  autofix-plan:
    name: autofix-plan
    needs: [resolve, review, tech-lead]
    if: needs.resolve.outputs.should_run == 'true' && needs.tech-lead.result == 'success'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.plan.outputs.should_run }}
      eligible_count: ${{ steps.plan.outputs.eligible_count }}
    steps:
      - name: Checkout trusted PR scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Download reviewer findings
        uses: actions/download-artifact@v8
        with:
          pattern: codex-review-*-findings
          path: artifacts
          merge-multiple: true

      - name: Download tech-lead decisions
        uses: actions/download-artifact@v8
        with:
          name: codex-review-tech-lead-decisions
          path: artifacts

      - name: Plan bounded autofix
        id: plan
        run: >-
          python3 trusted/.github/scripts/post_review.py plan-autofix
          --artifacts artifacts
          --decisions artifacts/decisions-tech-lead.json
          --output artifacts/autofix-manifest.json

      - name: Upload autofix manifest
        uses: actions/upload-artifact@v7
        with:
          name: codex-autofix-manifest
          path: artifacts/autofix-manifest.json
          retention-days: 7

  autofix-patch:
    name: autofix-patch
    needs: [resolve, tech-lead, autofix-plan]
    if: needs.resolve.outputs.should_run == 'true' && needs.autofix-plan.outputs.should_run == 'true'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted PR scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Download autofix manifest
        uses: actions/download-artifact@v8
        with:
          name: codex-autofix-manifest
          path: artifacts

      - name: Build autofix prompt
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          agent_file="trusted/.codex/agents/bounded-autofix-planner.md"
          manifest_file="artifacts/autofix-manifest.json"
          changed_files="${RUNNER_TEMP}/changed-files-autofix.txt"
          prompt_file="${RUNNER_TEMP}/prompt-autofix.md"

          test -f "$agent_file" || { echo "missing bounded autofix agent: $agent_file" >&2; exit 1; }
          test -f "$manifest_file" || { echo "missing autofix manifest: $manifest_file" >&2; exit 1; }
          git -C workspace diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"

          {
            cat "$agent_file"
            cat <<EOF

          ---

          Current GitHub workflow contract supersedes legacy Forgejo path references above.

          Modify files only in the current working directory. Do not commit, push, post comments, create issues, or merge PRs.
          If a safe bounded patch is not possible, leave the workspace unchanged.
          Use current files as the source of truth.
          BASE_SHA=${BASE_SHA} and HEAD_SHA=${HEAD_SHA} are available for comparison.

          Pull request:
          - repository: ${GITHUB_REPOSITORY}
          - pr_number: ${PR_NUMBER}
          - base_sha: ${BASE_SHA}
          - head_sha: ${HEAD_SHA}

          Autofix manifest:
          EOF
            cat <<'EOF'
          ```json
          EOF
            cat "$manifest_file"
            cat <<'EOF'
          ```

          Changed files:
          EOF
            cat "$changed_files"
          } > "$prompt_file"

      - name: Setup Codex relay
        id: relay-token
        uses: DongwonTTuna-Labs/home-server-infra/.github/actions/setup-codex-relay@303c5cf108ee5c0cb56035023fc7342f76e1e8cb
        with:
          codex-home: ${{ runner.temp }}/codex-home-autofix
          trusted-actors: DongwonTTuna,codex-reviewer-for-dongwonttuna[bot]

      - name: Validate Codex relay args
        env:
          CODEX_ARGS: ${{ steps.relay-token.outputs.codex_args }}
        shell: bash
        run: |
          set -euo pipefail
          expected="85f8c7646018470593ddd2e6e2dddfe750ac8edbbe71a4122bd538fb60540898"
          actual="$(printf '%s' "$CODEX_ARGS" | sha256sum | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Run bounded autofix
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
        with:
          prompt-file: ${{ runner.temp }}/prompt-autofix.md
          working-directory: ${{ github.workspace }}/workspace
          codex-home: ${{ runner.temp }}/codex-home-autofix
          sandbox: workspace-write
          safety-strategy: workspace-write
          codex-version: latest
          model: gpt-5.5
          effort: xhigh
          codex-args: ${{ steps.relay-token.outputs.codex_args }}

      - name: Build and validate autofix patch
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git -C workspace diff --binary > artifacts/autofix.patch
          git -C workspace diff --stat > artifacts/autofix.diffstat
          python3 trusted/.github/scripts/post_review.py validate-autofix-patch \
            --manifest artifacts/autofix-manifest.json \
            --patch artifacts/autofix.patch

      - name: Upload autofix patch
        uses: actions/upload-artifact@v7
        with:
          name: codex-autofix-patch
          path: |
            artifacts/autofix.patch
            artifacts/autofix.diffstat
          retention-days: 7

  autofix-apply:
    name: autofix-apply
    needs: [resolve, autofix-patch]
    if: needs.resolve.outputs.should_run == 'true' && needs.autofix-patch.result == 'success' && needs.resolve.outputs.head_ref != ''
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 30
    steps:
      - name: Checkout trusted PR scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Download autofix manifest
        uses: actions/download-artifact@v8
        with:
          name: codex-autofix-manifest
          path: artifacts

      - name: Download autofix patch
        uses: actions/download-artifact@v8
        with:
          name: codex-autofix-patch
          path: artifacts

      - name: Apply patch with stop rules
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          BASE_REF: ${{ needs.resolve.outputs.base_ref }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          HEAD_REPO: ${{ needs.resolve.outputs.head_repo }}
          PR_AUTHOR: ${{ needs.resolve.outputs.pr_author }}
          EXPECTED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          HEAD_REF: ${{ needs.resolve.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git -C workspace rev-parse HEAD)"
          if [ "$actual_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "PR branch moved before bounded autofix apply: expected $EXPECTED_HEAD_SHA got $actual_head"
            exit 1
          fi
          python3 trusted/.github/scripts/post_review.py validate-current-pr-state
          count="$(git -C workspace log --format=%s "${BASE_SHA}..HEAD" | grep -c '^fix(codex-review): apply bounded autofix$' || true)"
          if [ "$count" -ge 2 ]; then
            echo "bounded autofix commit cap reached: $count"
            exit 0
          fi
          python3 trusted/.github/scripts/post_review.py validate-autofix-patch \
            --manifest artifacts/autofix-manifest.json \
            --patch artifacts/autofix.patch
          git -C workspace apply --check ../artifacts/autofix.patch
          git -C workspace apply ../artifacts/autofix.patch
          git -C workspace diff --check
          (cd workspace && cargo fmt --all --check)
          (cd workspace && cargo test --workspace --all-features)
          if git -C workspace diff --quiet; then
            echo "bounded autofix produced no changes after validation"
            exit 0
          fi
          git -C workspace config user.name "codex-reviewer-for-dongwonttuna[bot]"
          git -C workspace config user.email "codex-reviewer-for-dongwonttuna[bot]@users.noreply.github.com"
          git -C workspace add -A
          git -C workspace commit -m "fix(codex-review): apply bounded autofix"

      - name: Generate App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push bounded autofix
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ needs.resolve.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git -C workspace remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C workspace push origin "HEAD:${HEAD_REF}"

  design-context:
    name: design-context
    needs: [resolve, tech-lead]
    if: needs.resolve.outputs.should_run == 'true' && needs.tech-lead.outputs.needs_design == 'true'
    runs-on:
