name: Codex PR Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-pr-review:
    name: Codex PR Review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'DongwonTTuna'
    runs-on: [self-hosted, linux, x64, codex]
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      final-message: ${{ steps.capture.outputs.final-message }}
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare trusted Codex prompt
        run: |
          set -euo pipefail
          if git show "origin/${{ github.event.pull_request.base.ref }}:.github/prompts/codex-pr-review.md" > "$RUNNER_TEMP/codex-pr-review.md" 2>/dev/null; then
            echo "Using Codex prompt from base branch."
          else
            echo "Base branch prompt is not available yet; using checked-out setup PR prompt."
            cp .github/prompts/codex-pr-review.md "$RUNNER_TEMP/codex-pr-review.md"
          fi

      - name: Run Codex review
        env:
          CODEX_HOME: /home/runner/.codex
        run: |
          set -euo pipefail
          codex login status

          # Codex reads auth at startup; model-issued shell commands must not read tokens.
          auth_guard_pid=""
          restore_codex_auth() {
            if [ -n "${auth_guard_pid:-}" ]; then
              kill "$auth_guard_pid" 2>/dev/null || true
              wait "$auth_guard_pid" 2>/dev/null || true
            fi
            chmod 0600 "$CODEX_HOME/auth.json" 2>/dev/null || true
          }
          trap restore_codex_auth EXIT

          (
            sleep 0.2
            chmod 000 "$CODEX_HOME/auth.json" || true
          ) &
          auth_guard_pid=$!

          codex --enable use_legacy_landlock --ask-for-approval never exec \
            --cd "$GITHUB_WORKSPACE" \
            --sandbox read-only \
            --output-last-message codex-output.md \
            --color never \
            - < "$RUNNER_TEMP/codex-pr-review.md"

      - name: Capture Codex output
        id: capture
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s codex-output.md ]; then
            exit 0
          fi
          delimiter="CODEX_OUTPUT_$(date +%s%N)"
          {
            echo "final-message<<$delimiter"
            cat codex-output.md
            printf '\n%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

  upsert-codex-comment:
    name: Upsert Codex Review Comment
    needs: codex-pr-review
    if: needs.codex-pr-review.result == 'success' && needs.codex-pr-review.outputs.final-message != ''
    runs-on: [self-hosted, linux, x64, codex]
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Upsert Codex review comment
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex-pr-review.outputs.final-message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- codex-pr-review -->';
            const finalMessage = process.env.CODEX_FINAL_MESSAGE.trim();
            if (!finalMessage) {
              core.info('Codex output was empty; skipping comment.');
              return;
            }
            const body = `${marker}\n## Codex PR Review\n\n${finalMessage}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
