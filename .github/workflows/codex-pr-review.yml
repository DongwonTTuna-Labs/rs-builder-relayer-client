  design-cluster:
    name: design-cluster
    needs: [resolve, tech-lead, design-normalize]
    if: needs.resolve.outputs.should_run == 'true' && needs.tech-lead.outputs.needs_design == 'true' && github.triggering_actor == 'DongwonTTuna'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    timeout-minutes: 25
    outputs:
      batch_indexes: ${{ steps.batch.outputs.batch_indexes }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Download design inputs
        uses: actions/download-artifact@v8
        with:
          name: codex-review-tech-lead-decisions
          path: artifacts

      - name: Download normalized inventory
        uses: actions/download-artifact@v8
        with:
          name: codex-design-normalized
          path: artifacts

      - name: Build cluster prompt
        shell: bash
        run: |
          set -euo pipefail
          agent_file="workspace/.codex/agents/design-invariant-clusterer.md"
          skill_file="workspace/.codex/skills/review-design-invariant-clusterer/SKILL.md"
          inventory_file="artifacts/normalized-inventory.json"
          context_file="artifacts/review-context.md"
          prompt_file="${RUNNER_TEMP}/prompt-design-cluster.md"

          test -f "$agent_file" || { echo "missing design agent: $agent_file" >&2; exit 1; }
          test -f "$skill_file" || { echo "missing required design skill: $skill_file" >&2; exit 1; }
          test -f "$inventory_file" || { echo "missing normalized inventory: $inventory_file" >&2; exit 1; }
          test -f "$context_file" || { echo "missing review context: $context_file" >&2; exit 1; }

          {
            cat "$skill_file"
            printf '\n---\n\n'
            cat "$agent_file"
            cat <<'EOF'

          ---

          Return only JSON matching the inline output schema supplied to openai/codex-action.
          Write human-readable fields in Korean.
          This stage clusters by invariant only. Do not design final edits.

          Normalized inventory:
          ```json
          EOF
            cat "$inventory_file"
            cat <<'EOF'
          ```

          Review context:
          EOF
            cat "$context_file"
            printf '\n'
          } > "$prompt_file"

      - name: Setup Codex relay
        id: relay-token
        uses: DongwonTTuna-Labs/home-server-infra/.github/actions/setup-codex-relay@main
        with:
          codex-home: ${{ runner.temp }}/codex-home-design-cluster

      - name: Validate Codex relay args
        env:
          CODEX_ARGS: ${{ steps.relay-token.outputs.codex_args }}
        shell: bash
        run: |
          set -euo pipefail
          expected="85f8c7646018470593ddd2e6e2dddfe750ac8edbbe71a4122bd538fb60540898"
          actual="$(printf '%s' "$CODEX_ARGS" | sha256sum | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Run design clusterer
        uses: openai/codex-action@v1
        env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
        with:
          prompt-file: ${{ runner.temp }}/prompt-design-cluster.md
          output-schema: |
            {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "type": "object",
              "additionalProperties": false,
              "required": ["clusters", "cross_cluster_conflicts"],
              "properties": {
                "clusters": {
                  "type": "array",
                  "maxItems": 30,
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["id", "title", "invariant", "summary", "source_ids", "conflict_keys"],
                    "properties": {
                      "id": { "type": "string", "pattern": "^cluster-[0-9]+$" },
                      "title": { "type": "string", "minLength": 1, "maxLength": 160 },
                      "invariant": { "type": "string", "minLength": 1, "maxLength": 240 },
                      "summary": { "type": "string", "minLength": 1, "maxLength": 700 },
                      "source_ids": {
                        "type": "array",
                        "minItems": 1,
                        "maxItems": 20,
                        "items": { "type": "string", "minLength": 1, "maxLength": 120 }
                      },
                      "conflict_keys": {
                        "type": "array",
                        "maxItems": 10,
                        "items": { "type": "string", "minLength": 1, "maxLength": 120 }
                      }
                    }
                  }
                },
                "cross_cluster_conflicts": {
                  "type": "array",
                  "maxItems": 15,
                  "items": { "type": "string", "minLength": 1, "maxLength": 400 }
                }
              }
            }
          output-file: ${{ runner.temp }}/clusters.json
          working-directory: ${{ github.workspace }}/workspace
          codex-home: ${{ runner.temp }}/codex-home-design-cluster
          sandbox: read-only
          safety-strategy: read-only
          codex-version: latest
          model: gpt-5.5
          effort: xhigh
          codex-args: ${{ steps.relay-token.outputs.codex_args }}

      - name: Validate and batch clusters
        id: batch
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["RUNNER_TEMP"]) / "clusters.json"
          data = json.loads(source.read_text(encoding="utf-8"))
          clusters = data.get("clusters")
          if not isinstance(clusters, list):
              raise SystemExit("clusters must be an array")
          artifacts = Path("artifacts")
          batch_dir = artifacts / "cluster-batches"
          batch_dir.mkdir(parents=True, exist_ok=True)
          (artifacts / "clusters.json").write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          if not clusters:
              batches = [{"clusters": []}]
          else:
              batches = [{"clusters": clusters[index:index + 3]} for index in range(0, len(clusters), 3)]
          batch_indexes = []
          for index, batch in enumerate(batches):
              (batch_dir / f"cluster-batch-{index}.json").write_text(
                  json.dumps(batch, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              batch_indexes.append(index)
          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a", encoding="utf-8") as output:
                  output.write("batch_indexes=" + json.dumps(batch_indexes) + "\n")
          PY

      - name: Upload design clusters
        uses: actions/upload-artifact@v7
        with:
          name: codex-design-clusters
          path: |
            artifacts/clusters.json
            artifacts/cluster-batches/*.json
          retention-days: 7

  design-analyze:
