          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: python3 trusted/.github/scripts/post_review.py post-design-plan --body artifacts/design-plan.md

  post:
    name: post
    needs: [resolve, review, tech-lead]
    if: needs.resolve.outputs.should_run == 'true' && needs.tech-lead.result == 'success' && github.triggering_actor == 'DongwonTTuna'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10
    steps:
      - name: Checkout trusted PR scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Download reviewer findings
        uses: actions/download-artifact@v8
        with:
          pattern: codex-review-*-findings
          path: artifacts
          merge-multiple: true

      - name: Download tech-lead decisions
        uses: actions/download-artifact@v8
        with:
          name: codex-review-tech-lead-decisions
          path: artifacts

      - name: Generate App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}

      - name: Post PR review
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: >-
          python3 trusted/.github/scripts/post_review.py post-current
          --artifacts artifacts
          --decisions artifacts/decisions-tech-lead.json
