        with:
          prompt-file: ${{ runner.temp }}/prompt-design-normalize.md
          output-schema: |
            {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "type": "object",
              "additionalProperties": false,
              "required": ["items", "global_notes"],
              "properties": {
                "items": {
                  "type": "array",
                  "maxItems": 80,
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["source_id", "source_type", "summary", "invariant", "surface", "stale_risk", "advisory", "conflict_keys"],
                    "properties": {
                      "source_id": { "type": "string", "minLength": 1, "maxLength": 120 },
                      "source_type": { "type": "string", "enum": ["finding", "thread", "review-history", "design-history"] },
                      "summary": { "type": "string", "minLength": 1, "maxLength": 600 },
                      "invariant": { "type": "string", "minLength": 1, "maxLength": 200 },
                      "surface": {
                        "type": "array",
                        "maxItems": 8,
                        "items": { "type": "string", "minLength": 1, "maxLength": 160 }
                      },
                      "stale_risk": { "type": "string", "enum": ["none", "low", "medium", "high"] },
                      "advisory": { "type": "boolean" },
                      "conflict_keys": {
                        "type": "array",
                        "maxItems": 8,
                        "items": { "type": "string", "minLength": 1, "maxLength": 120 }
                      }
                    }
                  }
                },
                "global_notes": {
                  "type": "array",
                  "maxItems": 10,
                  "items": { "type": "string", "minLength": 1, "maxLength": 400 }
                }
              }
            }
          output-file: ${{ runner.temp }}/normalized-inventory.json
          working-directory: ${{ github.workspace }}/workspace
          codex-home: ${{ runner.temp }}/codex-home-design-normalize
          sandbox: read-only
          safety-strategy: read-only
          codex-version: latest
          model: gpt-5.5
          effort: xhigh
          codex-args: ${{ steps.relay-token.outputs.codex_args }}

      - name: Validate normalized inventory
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["RUNNER_TEMP"]) / "normalized-inventory.json"
          data = json.loads(source.read_text(encoding="utf-8"))
          if not isinstance(data.get("items"), list):
              raise SystemExit("items must be an array")
          out = Path("artifacts") / "normalized-inventory.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload normalized inventory
        uses: actions/upload-artifact@v7
        with:
          name: codex-design-normalized
          path: artifacts/normalized-inventory.json
