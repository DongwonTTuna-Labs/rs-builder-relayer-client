name: Codex PR Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-pr-review:
    name: Codex PR Review
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, codex]
    timeout-minutes: 45
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Pre-fetch base and head refs
        run: |
          git fetch --no-tags origin \
            "${{ github.event.pull_request.base.ref }}" \
            "+refs/pull/${{ github.event.pull_request.number }}/head"

      - name: Run Codex review
        env:
          CODEX_HOME: /home/runner/.codex
        run: |
          set -euo pipefail
          codex login status
          codex --ask-for-approval never exec \
            --cd "$GITHUB_WORKSPACE" \
            --sandbox danger-full-access \
            --output-last-message codex-output.md \
            --color never \
            - < .github/prompts/codex-pr-review.md

      - name: Upsert Codex review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = '<!-- codex-pr-review -->';
            const outputPath = path.join(process.env.GITHUB_WORKSPACE, 'codex-output.md');
            if (!fs.existsSync(outputPath) || fs.statSync(outputPath).size === 0) {
              core.info('No Codex output file found; skipping comment.');
              return;
            }
            const finalMessage = fs.readFileSync(outputPath, 'utf8').trim();
            if (!finalMessage) {
              core.info('Codex output was empty; skipping comment.');
              return;
            }
            const body = `${marker}\n## Codex PR Review\n\n${finalMessage}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
