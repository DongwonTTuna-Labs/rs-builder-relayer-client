name: Codex PR Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

env:
  CODEX_REVIEW_ARGS: >-
    ["--enable","use_legacy_landlock","--disable","shell_tool","--ignore-user-config","--ignore-rules","--color","never","-c","model_provider=\"ai-relay\"","-c","model_providers.ai-relay.name=\"AI Relay\"","-c","model_providers.ai-relay.base_url=\"https://relay-ai.dongwontuna.net/v1\"","-c","model_providers.ai-relay.wire_api=\"responses\"","-c","model_providers.ai-relay.env_key=\"AI_RELAY_API_KEY\"","-c","model_providers.ai-relay.supports_websockets=true","-c","model_providers.ai-relay.requires_openai_auth=false","-c","shell_environment_policy.exclude=[\"AI_RELAY_API_KEY\"]","-c","sandbox_workspace_write.network_access=false"]

jobs:
  resolve:
    name: resolve
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      issues: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      trigger: ${{ steps.resolve.outputs.trigger }}
    steps:
      - name: Resolve PR metadata
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number || '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          TRUSTED_USER = "DongwonTTuna"

          def write_outputs(values):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  for key, value in values.items():
                      output.write(f"{key}={value}\n")

          def skipped():
              return {
                  "should_run": "false",
                  "pr_number": "",
                  "head_sha": "",
                  "base_ref": "",
                  "base_sha": "",
                  "trigger": "",
              }

          def github_api(path):
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "codex-review",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  raise SystemExit(f"GET {path} failed with {exc.code}: {body[:800]}") from exc

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          repo = os.environ["GITHUB_REPOSITORY"]
          actor = os.environ.get("GITHUB_ACTOR", "")

          if event_name == "pull_request":
              pr = event.get("pull_request") or {}
              sender = (event.get("sender") or {}).get("login")
              base_ref = ((pr.get("base") or {}).get("ref")) or ""
              head_repo = ((pr.get("head") or {}).get("repo") or {}).get("full_name")
              author = (pr.get("user") or {}).get("login")
              if (
                  not pr
                  or pr.get("draft")
                  or base_ref != "main"
                  or head_repo != repo
                  or author != TRUSTED_USER
                  or actor != TRUSTED_USER
                  or sender != TRUSTED_USER
              ):
                  write_outputs(skipped())
              else:
                  write_outputs(
                      {
                          "should_run": "true",
                          "pr_number": str(pr["number"]),
                          "head_sha": str(pr["head"]["sha"]),
                          "base_ref": "main",
                          "base_sha": str(pr["base"]["sha"]),
                          "trigger": f"pull_request:{event.get('action', '')}",
                      }
                  )
              raise SystemExit(0)

          if event_name == "issue_comment":
              issue = event.get("issue") or {}
              comment = event.get("comment") or {}
              body = str(comment.get("body") or "")
              comment_user = ((comment.get("user") or {}).get("login")) or ""
              if (
                  "pull_request" not in issue
                  or "/codex-review" not in body
                  or comment_user != TRUSTED_USER
                  or actor.endswith("[bot]")
              ):
                  write_outputs(skipped())
                  raise SystemExit(0)
              pr_number = str(issue["number"])
              pr = github_api(f"/repos/{repo}/pulls/{pr_number}")
              base_ref = ((pr.get("base") or {}).get("ref")) or ""
              head_repo = ((pr.get("head") or {}).get("repo") or {}).get("full_name")
              author = (pr.get("user") or {}).get("login")
              if base_ref != "main" or head_repo != repo or author != TRUSTED_USER:
                  write_outputs(skipped())
              else:
                  write_outputs(
                      {
                          "should_run": "true",
                          "pr_number": pr_number,
                          "head_sha": str(pr["head"]["sha"]),
                          "base_ref": "main",
                          "base_sha": str(pr["base"]["sha"]),
                          "trigger": "issue_comment:/codex-review",
                      }
                  )
              raise SystemExit(0)

          if event_name == "workflow_dispatch":
              pr_number = str(os.environ.get("DISPATCH_PR_NUMBER", "")).strip()
              if not pr_number.isdigit() or actor != TRUSTED_USER:
                  write_outputs(skipped())
                  raise SystemExit(0)
              pr = github_api(f"/repos/{repo}/pulls/{pr_number}")
              base_ref = ((pr.get("base") or {}).get("ref")) or ""
              head_repo = ((pr.get("head") or {}).get("repo") or {}).get("full_name")
              author = (pr.get("user") or {}).get("login")
              if pr.get("draft") or base_ref != "main" or head_repo != repo or author != TRUSTED_USER:
                  write_outputs(skipped())
              else:
                  write_outputs(
                      {
                          "should_run": "true",
                          "pr_number": pr_number,
                          "head_sha": str(pr["head"]["sha"]),
                          "base_ref": "main",
                          "base_sha": str(pr["base"]["sha"]),
                          "trigger": "workflow_dispatch",
                      }
                  )
              raise SystemExit(0)

          write_outputs(skipped())
          PY

  review:
    name: review-${{ matrix.axis }}
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        axis: [correctness, security, performance, test-coverage, domain]
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Build reviewer prompt
        env:
          AXIS: ${{ matrix.axis }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          TRIGGER: ${{ needs.resolve.outputs.trigger }}
        shell: bash
        run: |
          set -euo pipefail
          agent_file="workspace/.codex/agents/${AXIS}-reviewer.md"
          prompt_file="${RUNNER_TEMP}/prompt-${AXIS}.md"
          changed_files="${RUNNER_TEMP}/changed-files-${AXIS}.txt"
          diff_file="${RUNNER_TEMP}/diff-${AXIS}.patch"

          test -f "$agent_file" || { echo "missing reviewer agent: $agent_file" >&2; exit 1; }
          git -C workspace diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"
          git -C workspace diff --unified=80 --no-ext-diff "$BASE_SHA" "$HEAD_SHA" > "$diff_file"
          if [ "$(wc -c < "$diff_file")" -gt 180000 ]; then
            head -c 180000 "$diff_file" > "${diff_file}.tmp"
            printf '\n...[truncated]\n' >> "${diff_file}.tmp"
            mv "${diff_file}.tmp" "$diff_file"
          fi

          {
            cat "$agent_file"
            cat <<EOF

          ---

          Current GitHub workflow contract supersedes legacy Forgejo path references above.

          Return only JSON matching the inline output schema supplied to openai/codex-action.

          Rules:
          - Use agent "${AXIS}" exactly.
          - Return at most 13 findings.
          - Use line numbers from the RIGHT side of the diff only. Use null file/line for cross-cutting findings.
          - Do not include secrets, tokens, or private keys.
          - Do not modify files or post comments.

          Pull request:
          - repository: ${GITHUB_REPOSITORY}
          - pr_number: ${PR_NUMBER}
          - base_sha: ${BASE_SHA}
          - head_sha: ${HEAD_SHA}
          - trigger: ${TRIGGER}

          Changed files:
          EOF
            cat "$changed_files"
            cat <<'EOF'

          Diff:
          ```diff
          EOF
            cat "$diff_file"
            cat <<'EOF'
          ```
          EOF
          } > "$prompt_file"

      - name: Mint relay token
        id: relay-token
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          audience = "https://relay-ai.dongwontuna.net/github-actions"
          broker_url = "https://relay-ai.dongwontuna.net/oidc/exchange"

          def require_env(name):
              value = os.environ.get(name)
              if not value:
                  raise SystemExit(f"missing required environment variable: {name}")
              return value

          def request_json(request):
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")[:800]
                  raise SystemExit(f"{request.full_url} failed with HTTP {exc.code}: {body}") from exc

          parts = urllib.parse.urlsplit(require_env("ACTIONS_ID_TOKEN_REQUEST_URL"))
          query = urllib.parse.parse_qsl(parts.query, keep_blank_values=True)
          query.append(("audience", audience))
          request_url = urllib.parse.urlunsplit(parts._replace(query=urllib.parse.urlencode(query)))
          oidc_payload = request_json(
              urllib.request.Request(
                  request_url,
                  headers={
                      "Accept": "application/json",
                      "Authorization": f"Bearer {require_env('ACTIONS_ID_TOKEN_REQUEST_TOKEN')}",
                  },
              )
          )
          oidc_token = oidc_payload.get("value")
          if not isinstance(oidc_token, str) or not oidc_token:
              raise SystemExit("GitHub OIDC response did not include a token value")
          print(f"::add-mask::{oidc_token}")

          exchanged = request_json(
              urllib.request.Request(
                  broker_url,
                  data=json.dumps({"token": oidc_token}).encode("utf-8"),
                  method="POST",
                  headers={"Accept": "application/json", "Content-Type": "application/json"},
              )
          )
          relay_token = exchanged.get("relay_token")
          if exchanged.get("token_type") != "Bearer" or not isinstance(relay_token, str) or not relay_token.startswith("sk-clb-"):
              raise SystemExit("broker response did not include a valid relay token")
          print(f"::add-mask::{relay_token}")

          with open(require_env("GITHUB_OUTPUT"), "a", encoding="utf-8") as output:
              for key in ("relay_token", "expires_at", "api_key_id"):
                  value = exchanged.get(key)
                  if not isinstance(value, str) or not value:
                      raise SystemExit(f"broker response did not include {key}")
                  output.write(f"{key}={value}\n")
          PY

      - name: Check relay token
        env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
        run: test -n "$AI_RELAY_API_KEY"

      - name: Prepare Codex action home
        env:
          CODEX_ACTION_HOME: ${{ runner.temp }}/codex-home-${{ matrix.axis }}
        run: |
          mkdir -p "$CODEX_ACTION_HOME"
          printf '{"port":0}\n' > "$CODEX_ACTION_HOME/${GITHUB_RUN_ID}.json"

      - name: Run Codex reviewer
        uses: openai/codex-action@v1
        env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
        with:
          prompt-file: ${{ runner.temp }}/prompt-${{ matrix.axis }}.md
          output-schema: |
            {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "type": "object",
              "additionalProperties": false,
              "required": ["agent", "findings", "positive", "impact_summary"],
              "properties": {
                "agent": {
                  "type": "string",
                  "enum": ["correctness", "security", "performance", "test-coverage", "domain"]
                },
                "findings": {
                  "type": "array",
                  "maxItems": 13,
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["id", "type", "file", "line", "title", "reason", "rule_ref", "cross_cutting"],
                    "properties": {
                      "id": {
                        "type": "string",
                        "pattern": "^(correctness|security|performance|test-coverage|domain)-[0-9]+$"
                      },
                      "type": {
                        "type": "string",
                        "enum": ["MUST", "SUGGEST", "IMO", "NITS", "ASK"]
                      },
                      "file": {
                        "type": ["string", "null"]
                      },
                      "line": {
                        "type": ["integer", "null"],
                        "minimum": 1
                      },
                      "title": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 200
                      },
                      "reason": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 1000
                      },
                      "rule_ref": {
                        "type": ["string", "null"],
                        "maxLength": 200
                      },
                      "cross_cutting": {
                        "type": "boolean"
                      }
                    }
                  }
                },
                "positive": {
                  "type": "array",
                  "maxItems": 2,
                  "items": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 200
                  }
                },
                "impact_summary": {
                  "anyOf": [
                    {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["scope", "backward_compat", "external_integration", "env_settings", "other_notes"],
                      "properties": {
                        "scope": { "type": "string" },
                        "backward_compat": { "type": "string" },
                        "external_integration": { "type": "string" },
                        "env_settings": { "type": "string" },
                        "other_notes": { "type": "string" }
                      }
                    },
                    { "type": "null" }
                  ]
                }
              }
            }
          output-file: ${{ runner.temp }}/findings-${{ matrix.axis }}.json
          working-directory: ${{ github.workspace }}/workspace
          codex-home: ${{ runner.temp }}/codex-home-${{ matrix.axis }}
          sandbox: read-only
          safety-strategy: read-only
          codex-version: latest
          model: gpt-5.5
          effort: xhigh
          codex-args: ${{ env.CODEX_REVIEW_ARGS }}

      - name: Validate reviewer findings
        env:
          AXIS: ${{ matrix.axis }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          axis = os.environ["AXIS"]
          source = Path(os.environ["RUNNER_TEMP"]) / f"findings-{axis}.json"
          data = json.loads(source.read_text(encoding="utf-8"))
          if data.get("agent") != axis:
              raise SystemExit(f"agent mismatch: {data.get('agent')} != {axis}")
          findings = data.get("findings")
          if not isinstance(findings, list):
              raise SystemExit("findings must be an array")
          if len(findings) > 13:
              raise SystemExit("too many findings")
          out = Path("artifacts") / f"findings-{axis}.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload reviewer findings
        uses: actions/upload-artifact@v7
        with:
          name: codex-review-${{ matrix.axis }}-findings
          path: artifacts/findings-${{ matrix.axis }}.json
          retention-days: 7

  tech-lead:
    name: tech-lead
    needs: [resolve, review]
    if: needs.resolve.outputs.should_run == 'true'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Download reviewer findings
        uses: actions/download-artifact@v8
        with:
          pattern: codex-review-*-findings
          path: artifacts
          merge-multiple: true

      - name: Combine reviewer findings
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          axes = ("correctness", "security", "performance", "test-coverage", "domain")
          artifacts = Path("artifacts")
          missing = [axis for axis in axes if not (artifacts / f"findings-{axis}.json").exists()]
          if missing:
              raise SystemExit("missing reviewer artifacts: " + ", ".join(missing))
          combined = []
          for axis in axes:
              payload = json.loads((artifacts / f"findings-{axis}.json").read_text(encoding="utf-8"))
              if payload.get("agent") != axis:
                  raise SystemExit(f"agent mismatch in findings-{axis}.json")
              for finding in payload.get("findings", []):
                  item = dict(finding)
                  item["agent"] = axis
                  combined.append(item)
          combined_path = artifacts / "combined-findings.json"
          combined_path.write_text(json.dumps(combined, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Build tech-lead prompt
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          agent_file="workspace/.codex/agents/tech-lead-reviewer.md"
          combined_file="artifacts/combined-findings.json"
          diff_file="${RUNNER_TEMP}/diff-tech-lead.patch"
          prompt_file="${RUNNER_TEMP}/prompt-tech-lead.md"

          test -f "$agent_file" || { echo "missing tech-lead agent: $agent_file" >&2; exit 1; }
          test -f "$combined_file" || { echo "missing combined findings: $combined_file" >&2; exit 1; }
          git -C workspace diff --unified=60 --no-ext-diff "$BASE_SHA" "$HEAD_SHA" > "$diff_file"
          if [ "$(wc -c < "$diff_file")" -gt 120000 ]; then
            head -c 120000 "$diff_file" > "${diff_file}.tmp"
            printf '\n...[truncated]\n' >> "${diff_file}.tmp"
            mv "${diff_file}.tmp" "$diff_file"
          fi

          {
            cat "$agent_file"
            cat <<'EOF'

          ---

          Current GitHub workflow contract supersedes legacy Forgejo path references above.

          Combined findings:
          ```json
          EOF
            cat "$combined_file"
            cat <<'EOF'
          ```

          PR diff excerpt:
          ```diff
          EOF
            cat "$diff_file"
            cat <<'EOF'
          ```
          EOF
          } > "$prompt_file"

      - name: Mint relay token
        id: relay-token
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          audience = "https://relay-ai.dongwontuna.net/github-actions"
          broker_url = "https://relay-ai.dongwontuna.net/oidc/exchange"

          def require_env(name):
              value = os.environ.get(name)
              if not value:
                  raise SystemExit(f"missing required environment variable: {name}")
              return value

          def request_json(request):
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")[:800]
                  raise SystemExit(f"{request.full_url} failed with HTTP {exc.code}: {body}") from exc

          parts = urllib.parse.urlsplit(require_env("ACTIONS_ID_TOKEN_REQUEST_URL"))
          query = urllib.parse.parse_qsl(parts.query, keep_blank_values=True)
          query.append(("audience", audience))
          request_url = urllib.parse.urlunsplit(parts._replace(query=urllib.parse.urlencode(query)))
          oidc_payload = request_json(
              urllib.request.Request(
                  request_url,
                  headers={
                      "Accept": "application/json",
                      "Authorization": f"Bearer {require_env('ACTIONS_ID_TOKEN_REQUEST_TOKEN')}",
                  },
              )
          )
          oidc_token = oidc_payload.get("value")
          if not isinstance(oidc_token, str) or not oidc_token:
              raise SystemExit("GitHub OIDC response did not include a token value")
          print(f"::add-mask::{oidc_token}")

          exchanged = request_json(
              urllib.request.Request(
                  broker_url,
                  data=json.dumps({"token": oidc_token}).encode("utf-8"),
                  method="POST",
                  headers={"Accept": "application/json", "Content-Type": "application/json"},
              )
          )
          relay_token = exchanged.get("relay_token")
          if exchanged.get("token_type") != "Bearer" or not isinstance(relay_token, str) or not relay_token.startswith("sk-clb-"):
              raise SystemExit("broker response did not include a valid relay token")
          print(f"::add-mask::{relay_token}")

          with open(require_env("GITHUB_OUTPUT"), "a", encoding="utf-8") as output:
              for key in ("relay_token", "expires_at", "api_key_id"):
                  value = exchanged.get(key)
                  if not isinstance(value, str) or not value:
                      raise SystemExit(f"broker response did not include {key}")
                  output.write(f"{key}={value}\n")
          PY

      - name: Check relay token
        env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
        run: test -n "$AI_RELAY_API_KEY"

      - name: Prepare Codex action home
        env:
          CODEX_ACTION_HOME: ${{ runner.temp }}/codex-home-tech-lead
        run: |
          mkdir -p "$CODEX_ACTION_HOME"
          printf '{"port":0}\n' > "$CODEX_ACTION_HOME/${GITHUB_RUN_ID}.json"

      - name: Run tech-lead gate
        uses: openai/codex-action@v1
        env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
        with:
          prompt-file: ${{ runner.temp }}/prompt-tech-lead.md
          output-schema: |
            {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "type": "object",
              "additionalProperties": false,
              "required": ["decisions", "judgment", "merge_notes"],
              "properties": {
                "decisions": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["id", "allow", "reason"],
                    "properties": {
                      "id": {
                        "type": "string",
                        "pattern": "^(correctness|security|performance|test-coverage|domain)-[0-9]+$"
                      },
                      "allow": { "type": "boolean" },
                      "reason": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 300
                      }
                    }
                  }
                },
                "judgment": {
                  "anyOf": [
                    {
                      "type": "object",
                      "additionalProperties": false,
                      "required": ["status", "headline"],
                      "properties": {
                        "status": {
                          "type": "string",
                          "enum": ["LGTM", "NEEDS_CLARIFICATION", "NEEDS_WORK"]
                        },
                        "headline": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 200
                        }
                      }
                    },
                    { "type": "null" }
                  ]
                },
                "merge_notes": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["primary_id", "merged_ids", "reason"],
                    "properties": {
                      "primary_id": {
                        "type": "string",
                        "pattern": "^(correctness|security|performance|test-coverage|domain)-[0-9]+$"
                      },
                      "merged_ids": {
                        "type": "array",
                        "minItems": 1,
                        "items": {
                          "type": "string",
                          "pattern": "^(correctness|security|performance|test-coverage|domain)-[0-9]+$"
                        }
                      },
                      "reason": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 300
                      }
                    }
                  }
                }
              }
            }
          output-file: ${{ runner.temp }}/decisions-tech-lead.json
          working-directory: ${{ github.workspace }}/workspace
          codex-home: ${{ runner.temp }}/codex-home-tech-lead
          sandbox: read-only
          safety-strategy: read-only
          codex-version: latest
          model: gpt-5.5
          effort: xhigh
          codex-args: ${{ env.CODEX_REVIEW_ARGS }}

      - name: Validate tech-lead decisions
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["RUNNER_TEMP"]) / "decisions-tech-lead.json"
          data = json.loads(source.read_text(encoding="utf-8"))
          if not isinstance(data.get("decisions"), list):
              raise SystemExit("decisions must be an array")
          out = Path("artifacts") / "decisions-tech-lead.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload tech-lead decisions
        uses: actions/upload-artifact@v7
        with:
          name: codex-review-tech-lead-decisions
          path: artifacts/decisions-tech-lead.json
          retention-days: 7

  post:
    name: post
    needs: [resolve, review, tech-lead]
    if: needs.resolve.outputs.should_run == 'true' && needs.tech-lead.result == 'success'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10
    steps:
      - name: Checkout trusted PR scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.base_ref }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Download reviewer findings
        uses: actions/download-artifact@v8
        with:
          pattern: codex-review-*-findings
          path: artifacts
          merge-multiple: true

      - name: Download tech-lead decisions
        uses: actions/download-artifact@v8
        with:
          name: codex-review-tech-lead-decisions
          path: artifacts

      - name: Generate App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}

      - name: Post PR review
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: >-
          python3 trusted/.github/scripts/post_review.py post-current
          --artifacts artifacts
          --decisions artifacts/decisions-tech-lead.json
