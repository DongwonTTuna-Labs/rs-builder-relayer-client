name: Codex Design

# Label-driven stage of the split Codex pipeline.
# Trigger: codex-review attaches `리뷰완료` (or a maintainer does, to re-run design).
# guard pulls the prior codex-review run's artifacts, then stage 03-04
# run. finalize transitions the PR:
#   - approved for fix -> remove 설계중, add 설계완료 (triggers codex-fix)
#   - blocker          -> remove 설계중, add codex:needs-issue (triggers codex-issue)
on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: codex-design-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CODEX_REVIEW_ARTIFACT_ROOT: ${{ github.workspace }}/codex-review-artifacts
  CODEX_REVIEW_TRUSTED_CHECKOUT: ${{ github.workspace }}
  CODEX_REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  guard:
    name: Guard & fetch review inputs
    if: github.event.label.name == '리뷰완료'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: write
      actions: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
      head_sha: ${{ steps.paths.outputs.head_sha }}
      head_ref: ${{ steps.paths.outputs.head_ref }}
      head_repo_full_name: ${{ steps.paths.outputs.head_repo_full_name }}
      same_repo: ${{ steps.paths.outputs.same_repo }}
    steps:
      - name: Guard label state and actor permission
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTOR: ${{ github.event.sender.login }}
          HAS_FIXING: ${{ contains(github.event.pull_request.labels.*.name, '수정중') }}
        run: |
          set -euo pipefail
          proceed=true
          reason=""
          if [ "$HAS_FIXING" = "true" ]; then
            proceed=false
            reason="수정중인 PR 에 리뷰완료 라벨이 부착되었습니다."
          fi
          if [ "$proceed" = "true" ]; then
            if [ "$ACTOR" = "codex-reviewer-for-dongwonttuna[bot]" ]; then
              : # 루프 전이를 구동하는 신뢰된 파이프라인 봇 — 협력자 권한 검사 불필요
            else
              PERM=$(gh api "/repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
              case "$PERM" in
                admin|maintain|write) ;;
                *) proceed=false; reason="라벨 부착자($ACTOR)의 권한이 부족합니다 (write 이상 필요)." ;;
              esac
            fi
          fi
          # Locate the codex-review run that produced this commit's review artifacts.
          REVIEW_RUN_ID=""
          if [ "$proceed" = "true" ]; then
            REVIEW_RUN_ID=$(gh run list --repo "$REPO" --workflow=codex-review.yml --limit 50 \
              --json databaseId,headSha,conclusion \
              -q "[.[] | select(.headSha==\"$HEAD_SHA\" and .conclusion==\"success\")][0].databaseId" || echo "")
            if [ -z "$REVIEW_RUN_ID" ] || [ "$REVIEW_RUN_ID" = "null" ]; then
              proceed=false
              reason="이 커밋($HEAD_SHA)에 대한 성공한 codex-review 실행을 찾지 못했습니다."
            fi
          fi
          label_add() { gh api --silent -X POST "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=$1"; }
          label_del() { gh api --silent -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/$(python3 -c 'import sys,urllib.parse as u;print(u.quote(sys.argv[1],safe=""))' "$1")" >/dev/null 2>&1 || true; }
          if [ "$proceed" = "false" ]; then
            label_del '리뷰완료'; label_add 'codex:needs-issue' || true
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Codex 설계를 시작할 수 없습니다: $reason" || true
          else
            # Start transition is invisible to triggers (설계중 starts no workflow).
            label_del '리뷰완료'; label_add '설계중' || true
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "review_run_id=$REVIEW_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: DongwonTTuna-Labs/rs-builder-relayer-client/.github/actions/setup-codex-review@main
        if: steps.guard.outputs.proceed == 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.guard.outputs.proceed == 'true'
        with:
          name: codex-review-event
          path: design-inputs/event
          run-id: ${{ steps.guard.outputs.review_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.guard.outputs.proceed == 'true'
        with:
          name: codex-review-resolve_gate
          path: design-inputs/resolve_gate
          run-id: ${{ steps.guard.outputs.review_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.guard.outputs.proceed == 'true'
        continue-on-error: true
        with:
          # Absent when review routed design from existing threads (no techlead run).
          name: codex-review-techlead-model
          path: design-inputs/techlead
          run-id: ${{ steps.guard.outputs.review_run_id }}
          github-token: ${{ github.token }}
      - id: paths
        if: steps.guard.outputs.proceed == 'true'
        run: workflow-helper/setup/codex-review/bin/codex-review event write-outputs --in design-inputs/event/pr-context.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.guard.outputs.proceed == 'true'
        with:
          name: codex-design-inputs
          path: design-inputs

  design_context:
    name: Build design context
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [guard]
    if: needs.guard.outputs.proceed == 'true'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      design_context: ${{ steps.export.outputs.design_context }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: DongwonTTuna-Labs/rs-builder-relayer-client/.github/actions/setup-codex-review@main
      - name: Checkout PR head for model inspection
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ needs.guard.outputs.head_repo_full_name || github.repository }}
          ref: ${{ needs.guard.outputs.head_sha || github.sha }}
          path: pr-head
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-design-inputs
          path: codex-review-artifacts
      - run: |
          if [ -f codex-review-artifacts/techlead/techlead-decision.validated.json ]; then
            DESIGN_INPUT=codex-review-artifacts/techlead/techlead-decision.validated.json
          else
            DESIGN_INPUT=codex-review-artifacts/resolve_gate/lifecycle-result.validated.json
          fi
          workflow-helper/setup/codex-review/bin/codex-review design context --in "$DESIGN_INPUT" --pr-context codex-review-artifacts/event/pr-context.json --openspec-context codex-review-artifacts/event/openspec-context.json --docs-context codex-review-artifacts/event/docs-context.md --out codex-review-artifacts/design/design-context.json
      - name: Export design context to job output
        id: export
        run: workflow-helper/setup/codex-review/bin/codex-review io to-output --name design_context --in codex-review-artifacts/design/design-context.json

  prepare_clusters:
    name: Inventory & cluster design
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [guard, design_context]
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      analysis_matrix: ${{ steps.prepare.outputs.analysis_matrix }}
      has_analysis_batches: ${{ steps.prepare.outputs.has_analysis_batches }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: DongwonTTuna-Labs/rs-builder-relayer-client/.github/actions/setup-codex-review@main
      - name: Checkout PR head for model inspection
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ needs.guard.outputs.head_repo_full_name || github.repository }}
          ref: ${{ needs.guard.outputs.head_sha || github.sha }}
          path: pr-head
          persist-credentials: false
      - name: Materialize design context
        env:
          DESIGN_CONTEXT: ${{ needs.design_context.outputs.design_context }}
        run: |
          mkdir -p codex-review-artifacts/design
          printf '%s' "$DESIGN_CONTEXT" > codex-review-artifacts/design/design-context.json
      - name: Mint Codex relay token
        id: codex_oidc
        run: |
          workflow-helper/setup/codex-review/bin/codex-review oidc relay-token
          mkdir -p "${{ runner.temp }}/codex-home-inventory" "${{ runner.temp }}/codex-home-cluster"
      - name: Build inventory prompt
        run: workflow-helper/setup/codex-review/bin/codex-review design build-inventory-prompt --in codex-review-artifacts/design/design-context.json --out codex-review-artifacts/design/design-inventory.prompt.md
      - name: Prepare design schemas
        run: |
          mkdir -p codex-review-artifacts/schemas
          workflow-helper/setup/codex-review/bin/codex-review schema openai-strict --schema design-inventory.v1 --out codex-review-artifacts/schemas/design-inventory.v1.openai.schema.json
          workflow-helper/setup/codex-review/bin/codex-review schema openai-strict --schema design-clusters.v1 --out codex-review-artifacts/schemas/design-clusters.v1.openai.schema.json
          workflow-helper/setup/codex-review/bin/codex-review schema openai-strict --schema design-cluster-analysis.v1 --out codex-review-artifacts/schemas/design-cluster-analysis.v1.openai.schema.json
          workflow-helper/setup/codex-review/bin/codex-review schema openai-strict --schema design-plan.v1 --out codex-review-artifacts/schemas/design-plan.v1.openai.schema.json
      - name: Run Codex inventory model
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        with:
          openai-api-key: ${{ steps.codex_oidc.outputs.relay_token }}
          responses-api-endpoint: https://relay-ai.dongwontuna.net/v1/responses
          codex-home: ${{ runner.temp }}/codex-home-inventory
          prompt-file: ${{ github.workspace }}/codex-review-artifacts/design/design-inventory.prompt.md
          output-file: ${{ github.workspace }}/codex-review-artifacts/design/design-inventory.raw.json
          output-schema-file: ${{ github.workspace }}/codex-review-artifacts/schemas/design-inventory.v1.openai.schema.json
          working-directory: ${{ github.workspace }}/pr-head
          sandbox: danger-full-access
          safety-strategy: unsafe
          allow-users: DongwonTTuna
          allow-bots: true
          allow-bot-users: codex-reviewer-for-dongwonttuna[bot]
      - name: Validate design inventory
        run: workflow-helper/setup/codex-review/bin/codex-review design normalize --in codex-review-artifacts/design/design-inventory.raw.json --pr-context codex-review-artifacts/design/design-context.json --repo-path pr-head --out codex-review-artifacts/design/design-inventory.json
      - name: Build cluster prompt
        run: workflow-helper/setup/codex-review/bin/codex-review design build-clusters-prompt --inventory codex-review-artifacts/design/design-inventory.json --pr-context codex-review-artifacts/design/design-context.json --out codex-review-artifacts/design/design-clusters.prompt.md
      - name: Run Codex cluster model
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        with:
          openai-api-key: ${{ steps.codex_oidc.outputs.relay_token }}
          responses-api-endpoint: https://relay-ai.dongwontuna.net/v1/responses
          codex-home: ${{ runner.temp }}/codex-home-cluster
          prompt-file: ${{ github.workspace }}/codex-review-artifacts/design/design-clusters.prompt.md
          output-file: ${{ github.workspace }}/codex-review-artifacts/design/design-clusters.raw.json
          output-schema-file: ${{ github.workspace }}/codex-review-artifacts/schemas/design-clusters.v1.openai.schema.json
          working-directory: ${{ github.workspace }}/pr-head
          sandbox: danger-full-access
          safety-strategy: unsafe
          allow-users: DongwonTTuna
          allow-bots: true
          allow-bot-users: codex-reviewer-for-dongwonttuna[bot]
      - name: Validate design clusters
        run: workflow-helper/setup/codex-review/bin/codex-review design cluster --in codex-review-artifacts/design/design-clusters.raw.json --inventory codex-review-artifacts/design/design-inventory.json --repo-path pr-head --out codex-review-artifacts/design/design-clusters.json
      - id: prepare
        run: workflow-helper/setup/codex-review/bin/codex-review design prepare-analysis-matrix --in codex-review-artifacts/design/design-clusters.json --pr-context codex-review-artifacts/design/design-context.json --repo-path pr-head --work-dir codex-review-artifacts/design/batches --out codex-review-artifacts/design/analysis-matrix.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-design-prepare
          path: codex-review-artifacts/design

  analyze_clusters:
    name: Analyze design clusters
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [guard, prepare_clusters]
    if: needs.prepare_clusters.outputs.has_analysis_batches == 'true'
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare_clusters.outputs.analysis_matrix) }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: DongwonTTuna-Labs/rs-builder-relayer-client/.github/actions/setup-codex-review@main
      - name: Checkout PR head for model inspection
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ needs.guard.outputs.head_repo_full_name || github.repository }}
          ref: ${{ needs.guard.outputs.head_sha || github.sha }}
          path: pr-head
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-design-prepare
          path: codex-review-artifacts/design
      - name: Mint Codex relay token
        id: codex_oidc
        run: |
          workflow-helper/setup/codex-review/bin/codex-review oidc relay-token
          mkdir -p "${{ runner.temp }}/codex-home"
      - name: Prepare cluster analysis schema
        run: |
          mkdir -p codex-review-artifacts/schemas
          workflow-helper/setup/codex-review/bin/codex-review schema openai-strict --schema design-cluster-analysis.v1 --out codex-review-artifacts/schemas/design-cluster-analysis.v1.openai.schema.json
      - name: Run Codex analysis model
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        with:
          openai-api-key: ${{ steps.codex_oidc.outputs.relay_token }}
          responses-api-endpoint: https://relay-ai.dongwontuna.net/v1/responses
          codex-home: ${{ runner.temp }}/codex-home
          prompt-file: ${{ github.workspace }}/${{ matrix.prompt_file }}
          output-file: ${{ github.workspace }}/${{ matrix.output_file }}
          output-schema-file: ${{ github.workspace }}/codex-review-artifacts/schemas/design-cluster-analysis.v1.openai.schema.json
          working-directory: ${{ github.workspace }}/pr-head
          sandbox: danger-full-access
          safety-strategy: unsafe
          allow-users: DongwonTTuna
          allow-bots: true
          allow-bot-users: codex-reviewer-for-dongwonttuna[bot]
      - name: Validate cluster analysis
        run: workflow-helper/setup/codex-review/bin/codex-review design analyze --in "${{ github.workspace }}/${{ matrix.output_file }}" --inventory "${{ github.workspace }}/${{ matrix.batch_file }}" --repo-path pr-head --out "${{ github.workspace }}/${{ matrix.validated_file }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-design-analysis-${{ matrix.batch_path }}
          path: ${{ github.workspace }}/codex-review-artifacts/design/batches/${{ matrix.batch_path }}

  draft_plan:
    name: Draft design plan
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [guard, prepare_clusters, analyze_clusters]
    if: always() && needs.prepare_clusters.result == 'success' && (needs.analyze_clusters.result == 'success' || needs.analyze_clusters.result == 'skipped')
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: DongwonTTuna-Labs/rs-builder-relayer-client/.github/actions/setup-codex-review@main
      - name: Checkout PR head for model inspection
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ needs.guard.outputs.head_repo_full_name || github.repository }}
          ref: ${{ needs.guard.outputs.head_sha || github.sha }}
          path: pr-head
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-design-prepare
          path: codex-review-artifacts/design
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.prepare_clusters.outputs.has_analysis_batches == 'true'
        with:
          pattern: codex-review-design-analysis-*
          path: codex-review-artifacts/design-analysis-downloads
          merge-multiple: false
      - name: Mint Codex relay token
        id: codex_oidc
        run: |
          workflow-helper/setup/codex-review/bin/codex-review oidc relay-token
          mkdir -p "${{ runner.temp }}/codex-home"
      - name: Prepare design plan schema
        run: |
          mkdir -p codex-review-artifacts/schemas
          workflow-helper/setup/codex-review/bin/codex-review schema openai-strict --schema design-plan.v1 --out codex-review-artifacts/schemas/design-plan.v1.openai.schema.json
      - name: Collect cluster analyses and build design plan prompt
        run: |
          mkdir -p codex-review-artifacts/design-analysis-downloads
          workflow-helper/setup/codex-review/bin/codex-review design collect-analyses --artifacts codex-review-artifacts/design-analysis-downloads --out codex-review-artifacts/design/cluster-analysis.json
          workflow-helper/setup/codex-review/bin/codex-review design build-plan-prompt --pr-context codex-review-artifacts/design/design-context.json --inventory codex-review-artifacts/design/design-clusters.json --result codex-review-artifacts/design/cluster-analysis.json --out codex-review-artifacts/design/design-plan.prompt.md
      - name: Run Codex design plan model
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        with:
          openai-api-key: ${{ steps.codex_oidc.outputs.relay_token }}
          responses-api-endpoint: https://relay-ai.dongwontuna.net/v1/responses
          codex-home: ${{ runner.temp }}/codex-home
          prompt-file: ${{ github.workspace }}/codex-review-artifacts/design/design-plan.prompt.md
          output-file: ${{ github.workspace }}/codex-review-artifacts/design/design-plan.raw.json
          output-schema-file: ${{ github.workspace }}/codex-review-artifacts/schemas/design-plan.v1.openai.schema.json
          working-directory: ${{ github.workspace }}/pr-head
          sandbox: danger-full-access
          safety-strategy: unsafe
          allow-users: DongwonTTuna
          allow-bots: true
          allow-bot-users: codex-reviewer-for-dongwonttuna[bot]
      - name: Validate design plan
        run: workflow-helper/setup/codex-review/bin/codex-review design validate-plan --in codex-review-artifacts/design/design-plan.raw.json --pr-context codex-review-artifacts/design/design-context.json --repo-path pr-head --out codex-review-artifacts/design/design-plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-design
          path: codex-review-artifacts/design

  chief_decision:
    name: Design chief decision
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [guard, draft_plan]
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      chief_decision: ${{ steps.export.outputs.chief_decision }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: DongwonTTuna-Labs/rs-builder-relayer-client/.github/actions/setup-codex-review@main
      - name: Checkout PR head for model inspection
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ needs.guard.outputs.head_repo_full_name || github.repository }}
          ref: ${{ needs.guard.outputs.head_sha || github.sha }}
          path: pr-head
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-design
          path: codex-review-artifacts/design
      - name: Mint Codex relay token
        id: codex_oidc
        run: |
          workflow-helper/setup/codex-review/bin/codex-review oidc relay-token
          mkdir -p "${{ runner.temp }}/codex-home"
      - name: Build design chief prompt
        run: workflow-helper/setup/codex-review/bin/codex-review design_chief build-chief-prompt --in codex-review-artifacts/design/design-plan.json --inventory codex-review-artifacts/design/design-context.json --out codex-review-artifacts/design_chief/prompt.md
      - name: Prepare design chief schema
        run: |
          mkdir -p codex-review-artifacts/schemas
          workflow-helper/setup/codex-review/bin/codex-review schema openai-strict --schema design-chief-decision.v1 --out codex-review-artifacts/schemas/design-chief-decision.v1.openai.schema.json
      - name: Run Codex design chief model
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        with:
          openai-api-key: ${{ steps.codex_oidc.outputs.relay_token }}
          responses-api-endpoint: https://relay-ai.dongwontuna.net/v1/responses
          codex-home: ${{ runner.temp }}/codex-home
          prompt-file: ${{ github.workspace }}/codex-review-artifacts/design_chief/prompt.md
          output-file: ${{ github.workspace }}/codex-review-artifacts/design_chief/chief-decision.json
          output-schema-file: ${{ github.workspace }}/codex-review-artifacts/schemas/design-chief-decision.v1.openai.schema.json
          working-directory: ${{ github.workspace }}/pr-head
          sandbox: danger-full-access
          safety-strategy: unsafe
          allow-users: DongwonTTuna
          allow-bots: true
          allow-bot-users: codex-reviewer-for-dongwonttuna[bot]
      - name: Validate design chief decision
        run: workflow-helper/setup/codex-review/bin/codex-review design_chief validate --inventory codex-review-artifacts/design/design-plan.json --in codex-review-artifacts/design_chief/chief-decision.json --repo-path pr-head --out codex-review-artifacts/design_chief/chief-decision.validated.json
      - name: Export chief decision to job output
        id: export
        run: workflow-helper/setup/codex-review/bin/codex-review io to-output --name chief_decision --in codex-review-artifacts/design_chief/chief-decision.validated.json

  publish_design:
    name: Publish design & route
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [chief_decision]
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      route: ${{ steps.route.outputs.route }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: DongwonTTuna-Labs/rs-builder-relayer-client/.github/actions/setup-codex-review@main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-design-inputs
          path: codex-review-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-design
          path: codex-review-artifacts/design
      - name: Materialize chief decision
        env:
          CHIEF_DECISION: ${{ needs.chief_decision.outputs.chief_decision }}
        run: |
          mkdir -p codex-review-artifacts/design_chief
          printf '%s' "$CHIEF_DECISION" > codex-review-artifacts/design_chief/chief-decision.validated.json
      - id: app_token
        if: vars.CODEX_REVIEW_ENABLE_DESIGN_POSTING == 'true'
        env:
          CODEX_REVIEW_GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_GITHUB_APP_ID }}
          CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_APP_PRIVATE_KEY }}
          CODEX_APP_ID: ${{ secrets.CODEX_APP_ID }}
          CODEX_APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
        run: workflow-helper/setup/codex-review/bin/codex-review auth app-token --mode design_chief --pr-context codex-review-artifacts/event/pr-context.json --out codex-review-artifacts/design_chief/app-token.json
      - env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          CODEX_REVIEW_APP_TOKEN_PERMISSIONS_JSON: ${{ steps.app_token.outputs.permissions_json }}
        run: |
          if [ "${{ vars.CODEX_REVIEW_ENABLE_DESIGN_POSTING }}" = "true" ]; then
            workflow-helper/setup/codex-review/bin/codex-review design_chief publish --inventory codex-review-artifacts/design/design-plan.json --in codex-review-artifacts/design_chief/chief-decision.validated.json --pr-context codex-review-artifacts/event/pr-context.json --out codex-review-artifacts/design_chief/publish-report.json
          else
            workflow-helper/setup/codex-review/bin/codex-review design_chief publish --dry-run --inventory codex-review-artifacts/design/design-plan.json --in codex-review-artifacts/design_chief/chief-decision.validated.json --pr-context codex-review-artifacts/event/pr-context.json --out codex-review-artifacts/design_chief/publish-report.json
          fi
      - id: route
        run: workflow-helper/setup/codex-review/bin/codex-review design_chief route --in codex-review-artifacts/design_chief/chief-decision.validated.json --out codex-review-artifacts/design_chief/route.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-design_chief
          path: codex-review-artifacts/design_chief

  finalize:
    name: Finalize labels
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [guard, publish_design]
    if: always() && needs.guard.outputs.proceed == 'true'
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: DongwonTTuna-Labs/rs-builder-relayer-client/.github/actions/setup-codex-review@main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-design-inputs
          path: codex-review-artifacts
      - name: Mint label-ops token
        id: app_token
        env:
          CODEX_REVIEW_GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_GITHUB_APP_ID }}
          CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_APP_PRIVATE_KEY }}
          CODEX_APP_ID: ${{ secrets.CODEX_APP_ID }}
          CODEX_APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
        run: workflow-helper/setup/codex-review/bin/codex-review auth app-token --mode label-ops --pr-context codex-review-artifacts/event/pr-context.json --out codex-review-artifacts/label-token.json || echo "token mint failed; will fall back to GITHUB_TOKEN"
      - name: Transition labels
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DESIGN_RESULT: ${{ needs.publish_design.result }}
          DESIGN_ROUTE: ${{ needs.publish_design.outputs.route }}
        run: |
          set -euo pipefail
          if [ "$DESIGN_RESULT" = "success" ] && [ "$DESIGN_ROUTE" = "run_fix_dispatch" ]; then
            add='설계완료'
          else
            # stop_needs_human, stop_noop, or any failure -> hand to a human via issue.
            add='codex:needs-issue'
          fi
          label_add() { gh api --silent -X POST "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=$1"; }
          label_del() { gh api --silent -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/$(python3 -c 'import sys,urllib.parse as u;print(u.quote(sys.argv[1],safe=""))' "$1")" >/dev/null 2>&1 || true; }
          label_del '설계중'; label_add "$add"
          echo "Transitioned PR #$PR_NUMBER: 설계중 -> $add"
