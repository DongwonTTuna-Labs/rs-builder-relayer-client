name: codex scripts unit tests

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/codex-pr-review*.yml"
      - ".github/workflows/codex-scripts-tests.yml"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/workflows/codex-pr-review*.yml"
      - ".github/workflows/codex-scripts-tests.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Print Python version
        run: python3 --version

      - name: Run unittest
        run: python3 -m unittest discover -s .github/scripts/tests -t .github/scripts -v
