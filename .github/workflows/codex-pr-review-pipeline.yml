name: Codex PR Review Pipeline (reusable)

# Codex PR Review v2 의 본체. 3 stage 로 구성된 재사용 가능 워크플로우.
# - Stage 0 (resolve-check) : 기존 codex-managed inline 코멘트가 해결되었는지 LLM 판정 (3건씩 배치)
# - Stage 1 (review)        : 5 axis 를 matrix 로 병렬 실행하여 findings-<axis>.json 생성
# - Stage 2 (tech-lead)     : combined.json 을 Codex 에 보내 decisions.json 생성
# - Stage 3 (post)          : LLM 호출 없이 hard rule 적용 + inline / sticky 코멘트 게시
#
# Stage 0 과 Stage 1 사이에는 needs 관계가 없어 두 job 이 병렬로 시작된다.
# Stage 3 (post) 은 Stage 0 의 resolutions.json 과 Stage 2 의 decisions.json 둘 다를 입력으로 사용한다.
#
# 모든 GitHub API 호출은 등록된 GitHub App (`dongwontuna-s-review-bot`) 의 installation
# token 으로 수행한다. `GITHUB_TOKEN` 으로는 `resolveReviewThread` / `minimizeComment` 등
# 일부 GraphQL mutation 이 거부되기 때문이다.

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      trigger:
        required: false
        type: string
        default: pull_request

jobs:
  # ============================================================
  # Stage 0: 기존 codex-managed inline 코멘트의 해결 여부를 LLM 으로 판정 (3 건씩 배치)
  # Stage 1 과 병렬 실행.
  # ============================================================
  resolve-check:
    name: resolve-check
    runs-on: [self-hosted, linux, x64, codex]
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ inputs.head_sha }}
      PYTHONPATH: ${{ github.workspace }}/.github/scripts
      ART_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Generate App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}

      - name: Resolve-check existing codex inline comments
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash .github/scripts/check_inline_resolutions.sh

      - name: Upload resolutions artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-resolutions
          path: artifacts/resolutions.json
          retention-days: 7

  # ============================================================
  # Stage 1: 5 axis 를 matrix 로 병렬 실행
  # ============================================================
  review:
    name: review (${{ matrix.axis }})
    runs-on: [self-hosted, linux, x64, codex]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        axis:
          - correctness
          - security
          - performance
          - test-coverage
          - domain
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ inputs.head_sha }}
      GITHUB_BASE_REF: ${{ inputs.base_ref }}
      PYTHONPATH: ${{ github.workspace }}/.github/scripts
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Generate App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}

      - name: Prepare PR review context
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 .github/scripts/prepare_pr_context.py

      - name: Stage prompt artifact for matrix entry
        run: cp "$RUNNER_TEMP/codex-review-context.json" "$RUNNER_TEMP/pr-context.json"

      - name: Build axis prompt
        run: python3 .github/scripts/build_prompt.py --axis ${{ matrix.axis }}

      - name: Run Codex review (${{ matrix.axis }})
        env:
          PROMPT_FILE: ${{ runner.temp }}/prompt-${{ matrix.axis }}.md
          SCHEMA_FILE: ${{ github.workspace }}/.github/scripts/schemas/findings.schema.json
          OUT_FILE: ${{ runner.temp }}/codex-output-${{ matrix.axis }}.json
        run: bash .github/scripts/codex_exec.sh

      - name: Normalize findings
        run: python3 .github/scripts/normalize_codex_output.py --schema findings --axis ${{ matrix.axis }}

      - name: Stage findings into artifacts/
        run: |
          mkdir -p artifacts
          cp "$RUNNER_TEMP/findings-${{ matrix.axis }}.json" artifacts/

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-review-${{ matrix.axis }}-findings
          path: artifacts/findings-${{ matrix.axis }}.json
          retention-days: 7

  # ============================================================
  # Stage 2: tech-lead gate
  # ============================================================
  tech-lead:
    name: tech-lead
    needs: review
    if: always() && !cancelled()
    runs-on: [self-hosted, linux, x64, codex]
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ inputs.head_sha }}
      GITHUB_BASE_REF: ${{ inputs.base_ref }}
      PYTHONPATH: ${{ github.workspace }}/.github/scripts
      ART_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Generate App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}

      - name: Download all findings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-review-*-findings
          path: artifacts/
          merge-multiple: true

      - name: Combine findings
        id: combine
        run: |
          python3 .github/scripts/merge_and_gate.py --phase combine
          count=$(python3 -c "import json,sys;print(len(json.load(open('artifacts/combined.json'))))")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          cp artifacts/combined.json "$RUNNER_TEMP/combined.json"

      - name: Build tech-lead prompt
        if: steps.combine.outputs.count != '0'
        run: python3 .github/scripts/build_prompt.py --axis tech-lead

      - name: Run Codex tech-lead gate
        if: steps.combine.outputs.count != '0'
        env:
          PROMPT_FILE: ${{ runner.temp }}/prompt-tech-lead.md
          SCHEMA_FILE: ${{ github.workspace }}/.github/scripts/schemas/decisions.schema.json
          OUT_FILE: ${{ runner.temp }}/codex-output-tech-lead.json
        run: bash .github/scripts/codex_exec.sh

      - name: Normalize decisions
        if: steps.combine.outputs.count != '0'
        run: |
          python3 .github/scripts/normalize_codex_output.py --schema decisions
          cp "$RUNNER_TEMP/decisions.json" artifacts/

      - name: Emit empty decisions when no findings
        if: steps.combine.outputs.count == '0'
        run: |
          mkdir -p artifacts
          printf '%s\n' '{"decisions": [], "merge_notes": []}' > artifacts/decisions.json

      - name: Upload decisions artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-tech-lead-decisions
          path: artifacts/decisions.json
          retention-days: 7

      - name: Upload combined findings artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-combined-findings
          path: artifacts/combined.json
          retention-days: 7

  # ============================================================
  # Stage 3: deterministic post (LLM 미사용)
  # hard rule 적용 + inline / sticky 코멘트 게시 + Stage 0 의 해결 판정 반영
  # ============================================================
  post:
    name: post
    needs: [resolve-check, tech-lead]
    if: always() && !cancelled()
    runs-on: [self-hosted, linux, x64, codex]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ inputs.head_sha }}
      TRIGGER: ${{ inputs.trigger }}
      ART_DIR: ${{ github.workspace }}/artifacts
      PYTHONPATH: ${{ github.workspace }}/.github/scripts
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 1
          persist-credentials: false

      - name: Generate App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}

      - name: Download findings artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-review-*-findings
          path: artifacts/
          merge-multiple: true

      - name: Download combined findings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-combined-findings
          path: artifacts/

      - name: Download decisions artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-tech-lead-decisions
          path: artifacts/

      - name: Download resolutions artifact
        if: needs.resolve-check.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-resolutions
          path: artifacts/

      - name: Apply hard rules
        run: python3 .github/scripts/merge_and_gate.py --phase gate

      - name: Post review comments
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash .github/scripts/post_review_comments.sh
