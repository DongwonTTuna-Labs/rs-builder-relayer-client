name: Grimoire

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened, unlabeled]

permissions: {}

jobs:
  grimoire:
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.labels.*.name, 'grimoire:disabled') &&
        (github.event.action != 'unlabeled' || github.event.label.name == '📋 Spec Needed')
      }}
    permissions:
      contents: read
    # Pinned to a commit, not to a moving branch: this job hands four secrets
    # to the callee, and pinning this file's own digest says nothing about what
    # a branch points at when the job runs.
    #
    # This fixes the callee's own steps and not everything they run. At this
    # commit the callee checks out `home-server-infra` at `ref: main` and
    # executes actions from that checkout, so the code holding these secrets is
    # still whatever `main` points at. Closing that is DON-84, in the callee's
    # repository. What was audited here: top-level `permissions: {}`, job-level
    # `contents: read`, `persist-credentials: false` on both checkouts, the
    # consumer repository checked out as data at `head_sha`, and
    # `create-github-app-token` pinned to a full SHA. `actions/checkout@v6` in
    # the callee is a movable tag.
    uses: DongwonTTuna-Labs/home-server-infra/.github/workflows/grimoire-control-plane.yml@dad7767101e12cb4d987a467145c4c00642a4132
    with:
      consumer_repository: ${{ github.repository }}
      consumer_ref: ${{ github.event.pull_request.head.ref }}
      pull_request_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.event.pull_request.base.ref }}
      grimoire_app_client_id: Iv23liFL1dDHmU06FLSF
    secrets:
      GRIMOIRE_APP_PRIVATE_KEY: ${{ secrets.GRIMOIRE_APP_PRIVATE_KEY }}
      AI_RELAY_API_KEY: ${{ secrets.AI_RELAY_API_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
