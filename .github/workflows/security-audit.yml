name: Security audit

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - run: test ! -L scripts && test ! -L scripts/preflight_build_integrity.py && python3 -I scripts/preflight_build_integrity.py

      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - run: rm -f Cargo.lock && cargo audit --deny warnings
