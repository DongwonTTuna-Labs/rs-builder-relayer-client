name: Codex Fix

# Legacy label-driven stage of the split Codex pipeline.
# Disabled during Codex loop migration to prevent overlap with the new adapters.
# Removal is reserved for Task 30 after dry-run/live parity evidence is accepted.
# Former trigger: codex-design attaches `설계완료` (or a maintainer does).
# Former guard blocked fork PRs and pulled the design run's artifacts.
# Former finalize closed the loop:
#   - pushed a fix      -> remove 수정중, add 수정완료 + 리뷰중 (formerly re-reviewed)
#   - oscillation/cap   -> remove 수정중, add codex:needs-issue
#   - nothing to push   -> remove 수정중, add codex:needs-issue
on:
  workflow_dispatch:
    inputs:
      disabled_reason:
        description: "Disabled legacy workflow retained for Task 30 removal. Do not run."
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: codex-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CODEX_REVIEW_ARTIFACT_ROOT: ${{ github.workspace }}/trusted/codex-review-artifacts
  CODEX_REVIEW_TRUSTED_CHECKOUT: ${{ github.workspace }}/trusted
  CODEX_REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  guard:
    name: Guard, block forks & fetch design inputs
    if: github.event.label.name == '설계완료'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: write
      actions: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
      head_sha: ${{ steps.paths.outputs.head_sha }}
      head_ref: ${{ steps.paths.outputs.head_ref }}
      head_repo_full_name: ${{ steps.paths.outputs.head_repo_full_name }}
      same_repo: ${{ steps.paths.outputs.same_repo }}
    steps:
      - name: Guard label state, fork, and actor permission
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ACTOR: ${{ github.event.sender.login }}
          HAS_REVIEWING: ${{ contains(github.event.pull_request.labels.*.name, '리뷰중') }}
        run: |
          set -euo pipefail
          proceed=true
          reason=""
          if [ "$HAS_REVIEWING" = "true" ]; then
            proceed=false
            reason="리뷰중인 PR 에 설계완료 라벨이 부착되었습니다."
          fi
          # Fork PRs cannot be pushed to from the base-repo trusted context.
          if [ "$proceed" = "true" ] && [ "$HEAD_REPO" != "$REPO" ]; then
            proceed=false
            reason="포크 PR 은 자동 수정/푸시를 지원하지 않습니다 ($HEAD_REPO)."
          fi
          if [ "$proceed" = "true" ]; then
            if [ "$ACTOR" = "codex-reviewer-for-dongwonttuna[bot]" ]; then
              : # 루프 전이를 구동하는 신뢰된 파이프라인 봇 — 협력자 권한 검사 불필요
            else
              PERM=$(gh api "/repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
              case "$PERM" in
                admin|maintain|write) ;;
                *) proceed=false; reason="라벨 부착자($ACTOR)의 권한이 부족합니다 (write 이상 필요)." ;;
              esac
            fi
          fi
          DESIGN_RUN_ID=""
          if [ "$proceed" = "true" ]; then
            DESIGN_RUN_ID=$(gh run list --repo "$REPO" --workflow=codex-design.yml --limit 50 \
              --json databaseId,headSha,conclusion \
              -q "[.[] | select(.headSha==\"$HEAD_SHA\" and .conclusion==\"success\")][0].databaseId" || echo "")
            if [ -z "$DESIGN_RUN_ID" ] || [ "$DESIGN_RUN_ID" = "null" ]; then
              proceed=false
              reason="이 커밋($HEAD_SHA)에 대한 성공한 codex-design 실행을 찾지 못했습니다."
            fi
          fi
          label_add() { gh api --silent -X POST "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=$1"; }
          label_del() { gh api --silent -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/$(python3 -c 'import sys,urllib.parse as u;print(u.quote(sys.argv[1],safe=""))' "$1")" >/dev/null 2>&1 || true; }
          if [ "$proceed" = "false" ]; then
            label_del '설계완료'; label_add 'codex:needs-issue' || true
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Codex 수정을 시작할 수 없습니다: $reason" || true
          else
            label_del '설계완료'; label_add '수정중' || true
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "design_run_id=$DESIGN_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: DongwonTTuna-Labs/rs-builder-relayer-client/.github/actions/setup-codex-review@main
        if: steps.guard.outputs.proceed == 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.guard.outputs.proceed == 'true'
        with:
          # codex-design-inputs carries the review event context (pr-context, loop-state, docs).
          name: codex-design-inputs
          path: fix-inputs
          run-id: ${{ steps.guard.outputs.design_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.guard.outputs.proceed == 'true'
        with:
          name: codex-review-design
          path: fix-inputs/design
          run-id: ${{ steps.guard.outputs.design_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.guard.outputs.proceed == 'true'
        with:
          name: codex-review-design_chief
          path: fix-inputs/design_chief
          run-id: ${{ steps.guard.outputs.design_run_id }}
          github-token: ${{ github.token }}
      - id: paths
        if: steps.guard.outputs.proceed == 'true'
        run: workflow-helper/setup/codex-review/bin/codex-review event write-outputs --in fix-inputs/event/pr-context.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.guard.outputs.proceed == 'true'
        with:
          name: codex-fix-inputs
          path: fix-inputs
          retention-days: 7

  plan_tasks:
    name: Plan fix tasks
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [guard]
    if: needs.guard.outputs.proceed == 'true'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      agent_matrix: ${{ steps.prepare.outputs.agent_matrix }}
      has_agent_tasks: ${{ steps.prepare.outputs.has_agent_tasks }}
      no_fix_needed: ${{ steps.prepare.outputs.no_fix_needed }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: DongwonTTuna-Labs/rs-builder-relayer-client/.github/actions/setup-codex-review@main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-fix-inputs
          path: trusted/codex-review-artifacts
      - id: prepare
        env:
          CODEX_REVIEW_ARTIFACT_ROOT: ${{ github.workspace }}/trusted/codex-review-artifacts
          CODEX_REVIEW_TRUSTED_CHECKOUT: ${{ github.workspace }}/trusted
        run: |
          workflow-helper/setup/codex-review/bin/codex-review fix_dispatch plan --in trusted/codex-review-artifacts/design/design-plan.json --inventory trusted/codex-review-artifacts/design_chief/chief-decision.validated.json --out trusted/codex-review-artifacts/fix_dispatch/manifest.json
          python3 -c "import json,os; m=json.load(open('trusted/codex-review-artifacts/fix_dispatch/manifest.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('no_fix_needed=%s\n' % ('true' if m.get('no_fix_needed') else 'false'))"
          workflow-helper/setup/codex-review/bin/codex-review fix_dispatch prepare-agents --inventory trusted/codex-review-artifacts/fix_dispatch/manifest.json --design-plan trusted/codex-review-artifacts/design/design-plan.json --chief-decision trusted/codex-review-artifacts/design_chief/chief-decision.validated.json --docs-context trusted/codex-review-artifacts/event/docs-context.md --repo-path pr-head --work-dir trusted/codex-review-artifacts/fix_dispatch/agents --out trusted/codex-review-artifacts/fix_dispatch/agent-matrix.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-fix_dispatch-prepare
          path: trusted/codex-review-artifacts/fix_dispatch
          retention-days: 7

  run_agents:
    name: Run fix agents
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [guard, plan_tasks]
    if: needs.plan_tasks.outputs.has_agent_tasks == 'true'
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan_tasks.outputs.agent_matrix) }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ needs.guard.outputs.head_repo_full_name || github.repository }}
          ref: ${{ needs.guard.outputs.head_sha || github.sha }}
          path: pr-head
          persist-credentials: false
      - uses: DongwonTTuna-Labs/rs-builder-relayer-client/.github/actions/setup-codex-review@main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-fix_dispatch-prepare
          path: trusted/codex-review-artifacts/fix_dispatch
      - name: Mint Codex relay token
        id: codex_oidc
        run: |
          workflow-helper/setup/codex-review/bin/codex-review oidc relay-token
          mkdir -p "${{ runner.temp }}/codex-home"
      - name: Prepare fix agent schema
        run: |
          mkdir -p trusted/codex-review-artifacts/schemas
          workflow-helper/setup/codex-review/bin/codex-review schema openai-strict --schema fix-dispatch-agent-result.v1 --out trusted/codex-review-artifacts/schemas/fix-dispatch-agent-result.v1.openai.schema.json
      - name: Run Codex fix agent model
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        with:
          openai-api-key: ${{ steps.codex_oidc.outputs.relay_token }}
          responses-api-endpoint: https://relay-ai.dongwontuna.net/v1/responses
          codex-home: ${{ runner.temp }}/codex-home
          prompt-file: ${{ github.workspace }}/${{ matrix.prompt_file }}
          output-file: ${{ github.workspace }}/${{ matrix.output_file }}
          output-schema-file: ${{ github.workspace }}/trusted/codex-review-artifacts/schemas/fix-dispatch-agent-result.v1.openai.schema.json
          working-directory: ${{ github.workspace }}/pr-head
          sandbox: danger-full-access
          safety-strategy: unsafe
          allow-users: DongwonTTuna
          allow-bots: true
          allow-bot-users: codex-reviewer-for-dongwonttuna[bot]
      - name: Validate fix agent result
        run: workflow-helper/setup/codex-review/bin/codex-review fix_dispatch validate-agent-result --inventory "${{ github.workspace }}/${{ matrix.task_file }}" --in "${{ github.workspace }}/${{ matrix.output_file }}" --out "${{ github.workspace }}/${{ matrix.validated_file }}" --repo-path "${{ github.workspace }}/pr-head"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-fix_dispatch-agent-${{ matrix.task_path }}
          path: ${{ github.workspace }}/trusted/codex-review-artifacts/fix_dispatch/agents/${{ matrix.task_path }}
          retention-days: 7

  merge_validate:
    name: Merge, safety-check & validate fix
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [guard, plan_tasks, run_agents]
    if: always() && needs.plan_tasks.result == 'success' && needs.plan_tasks.outputs.no_fix_needed != 'true' && (needs.run_agents.result == 'success' || needs.run_agents.result == 'skipped')
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    outputs:
      validation_status: ${{ steps.validation_result.outputs.validation_status }}
      requires_push_token: ${{ steps.validation_result.outputs.requires_push_token }}
      loop_terminal_reason: ${{ steps.validation_result.outputs.loop_terminal_reason }}
      should_continue: ${{ steps.validation_result.outputs.should_continue }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ needs.guard.outputs.head_repo_full_name || github.repository }}
          ref: ${{ needs.guard.outputs.head_sha || github.sha }}
          path: pr-head
          persist-credentials: false
      - uses: DongwonTTuna-Labs/rs-builder-relayer-client/.github/actions/setup-codex-review@main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-fix-inputs
          path: trusted/codex-review-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-fix_dispatch-prepare
          path: trusted/codex-review-artifacts/fix_dispatch
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.plan_tasks.outputs.has_agent_tasks == 'true'
        with:
          pattern: codex-review-fix_dispatch-agent-*
          path: trusted/codex-review-artifacts/fix_dispatch-agent-downloads
          merge-multiple: false
      - name: Mint Codex relay token
        id: codex_oidc
        run: |
          workflow-helper/setup/codex-review/bin/codex-review oidc relay-token
          mkdir -p "${{ runner.temp }}/codex-home"
      - id: merge_route
        env:
          CODEX_REVIEW_ARTIFACT_ROOT: ${{ github.workspace }}/trusted/codex-review-artifacts
          CODEX_REVIEW_TRUSTED_CHECKOUT: ${{ github.workspace }}/trusted
        run: |
          mkdir -p trusted/codex-review-artifacts/fix_dispatch-agent-downloads trusted/codex-review-artifacts/fix_merge trusted/codex-review-artifacts/schemas
          workflow-helper/setup/codex-review/bin/codex-review fix_dispatch collect --inventory trusted/codex-review-artifacts/fix_dispatch/manifest.json --artifacts trusted/codex-review-artifacts/fix_dispatch-agent-downloads --out trusted/codex-review-artifacts/fix_dispatch/collection.json
          workflow-helper/setup/codex-review/bin/codex-review fix_merge premerge --in trusted/codex-review-artifacts/fix_dispatch/collection.json --repo-path pr-head --out trusted/codex-review-artifacts/fix_merge/premerge-report.json
          workflow-helper/setup/codex-review/bin/codex-review fix_merge prepare-merge-model --inventory trusted/codex-review-artifacts/fix_merge/premerge-report.json --in trusted/codex-review-artifacts/fix_dispatch/collection.json --pr-context trusted/codex-review-artifacts/event/pr-context.json --docs-context trusted/codex-review-artifacts/event/docs-context.md --repo-path pr-head --prompt-out trusted/codex-review-artifacts/fix_merge/merge-prompt.md --raw-out trusted/codex-review-artifacts/fix_merge/merged-fix.raw.json --out trusted/codex-review-artifacts/fix_merge/merge-route.json
      - name: Prepare merged fix schema
        if: steps.merge_route.outputs.needs_model == 'true'
        run: workflow-helper/setup/codex-review/bin/codex-review schema openai-strict --schema fix-merge-merged-fix.v1 --out trusted/codex-review-artifacts/schemas/fix-merge-merged-fix.v1.openai.schema.json
      - name: Run Codex merged fix model
        if: steps.merge_route.outputs.needs_model == 'true'
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        with:
          openai-api-key: ${{ steps.codex_oidc.outputs.relay_token }}
          responses-api-endpoint: https://relay-ai.dongwontuna.net/v1/responses
          codex-home: ${{ runner.temp }}/codex-home
          prompt-file: ${{ github.workspace }}/trusted/codex-review-artifacts/fix_merge/merge-prompt.md
          output-file: ${{ github.workspace }}/trusted/codex-review-artifacts/fix_merge/merged-fix.raw.json
          output-schema-file: ${{ github.workspace }}/trusted/codex-review-artifacts/schemas/fix-merge-merged-fix.v1.openai.schema.json
          working-directory: ${{ github.workspace }}/pr-head
          sandbox: danger-full-access
          safety-strategy: unsafe
          allow-users: DongwonTTuna
          allow-bots: true
          allow-bot-users: codex-reviewer-for-dongwonttuna[bot]
      - name: Validate merged fix
        run: workflow-helper/setup/codex-review/bin/codex-review fix_merge validate --inventory trusted/codex-review-artifacts/fix_merge/premerge-report.json --chief-decision trusted/codex-review-artifacts/design_chief/chief-decision.validated.json --in trusted/codex-review-artifacts/fix_merge/merged-fix.raw.json --repo-path pr-head --out trusted/codex-review-artifacts/fix_merge/merged-fix.json
      - name: Build semantic patch safety prompt
        run: workflow-helper/setup/codex-review/bin/codex-review fix_merge build-semantic-safety-prompt --in trusted/codex-review-artifacts/fix_merge/merged-fix.json --pr-context trusted/codex-review-artifacts/event/pr-context.json --docs-context trusted/codex-review-artifacts/event/docs-context.md --repo-path pr-head --out trusted/codex-review-artifacts/fix_merge/semantic-safety-prompt.md
      - name: Prepare semantic patch safety schema
        run: workflow-helper/setup/codex-review/bin/codex-review schema openai-strict --schema fix-merge-semantic-patch-safety.v1 --out trusted/codex-review-artifacts/schemas/fix-merge-semantic-patch-safety.v1.openai.schema.json
      - name: Run Codex semantic patch safety model
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        with:
          openai-api-key: ${{ steps.codex_oidc.outputs.relay_token }}
          responses-api-endpoint: https://relay-ai.dongwontuna.net/v1/responses
          codex-home: ${{ runner.temp }}/codex-home
          prompt-file: ${{ github.workspace }}/trusted/codex-review-artifacts/fix_merge/semantic-safety-prompt.md
          output-file: ${{ github.workspace }}/trusted/codex-review-artifacts/fix_merge/semantic-safety.raw.json
          output-schema-file: ${{ github.workspace }}/trusted/codex-review-artifacts/schemas/fix-merge-semantic-patch-safety.v1.openai.schema.json
          working-directory: ${{ github.workspace }}/pr-head
          sandbox: danger-full-access
          safety-strategy: unsafe
          allow-users: DongwonTTuna
          allow-bots: true
          allow-bot-users: codex-reviewer-for-dongwonttuna[bot]
      - name: Validate semantic patch safety result
        run: workflow-helper/setup/codex-review/bin/codex-review fix_merge validate-semantic-safety --in trusted/codex-review-artifacts/fix_merge/semantic-safety.raw.json --inventory trusted/codex-review-artifacts/fix_merge/merged-fix.json --out trusted/codex-review-artifacts/fix_merge/semantic-safety.json
      - name: Validate fix & check loop budget
        env:
          CODEX_REVIEW_ARTIFACT_ROOT: ${{ github.workspace }}/trusted/codex-review-artifacts
        run: |
          workflow-helper/setup/codex-review/bin/codex-review push validate-fix --in trusted/codex-review-artifacts/fix_merge/merged-fix.json --semantic-safety trusted/codex-review-artifacts/fix_merge/semantic-safety.json --pr-context trusted/codex-review-artifacts/event/pr-context.json --repo-path pr-head --out trusted/codex-review-artifacts/push/validated-fix.json
          workflow-helper/setup/codex-review/bin/codex-review push check-loop-budget --in trusted/codex-review-artifacts/push/validated-fix.json --result trusted/codex-review-artifacts/fix_merge/merged-fix.json --design-plan trusted/codex-review-artifacts/design/design-plan.json --loop-state trusted/codex-review-artifacts/event/loop-state.json --out trusted/codex-review-artifacts/push/validated-fix.json
      - id: validation_result
        run: workflow-helper/setup/codex-review/bin/codex-review push write-validation-outputs --in trusted/codex-review-artifacts/push/validated-fix.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-fix_merge
          path: trusted/codex-review-artifacts
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-push-validation
          path: trusted/codex-review-artifacts/push
          retention-days: 7


  commit_push:
    name: Commit & push fix
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [guard, merge_validate]
    if: always() && needs.merge_validate.outputs.requires_push_token == 'true'
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      push_status: ${{ steps.push_result.outputs.push_status }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ needs.guard.outputs.head_repo_full_name || github.repository }}
          ref: ${{ needs.guard.outputs.head_sha || github.sha }}
          path: pr-head
          persist-credentials: false
      - uses: DongwonTTuna-Labs/rs-builder-relayer-client/.github/actions/setup-codex-review@main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-fix_merge
          path: trusted/codex-review-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-push-validation
          path: trusted/codex-review-artifacts/push
      - id: app_token
        env:
          CODEX_REVIEW_GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_GITHUB_APP_ID }}
          CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_APP_PRIVATE_KEY }}
          CODEX_APP_ID: ${{ secrets.CODEX_APP_ID }}
          CODEX_APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
        run: workflow-helper/setup/codex-review/bin/codex-review auth app-token --mode push --pr-context trusted/codex-review-artifacts/event/pr-context.json --out trusted/codex-review-artifacts/push/app-token.json
      - env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          CODEX_REVIEW_APP_TOKEN_PERMISSIONS_JSON: ${{ steps.app_token.outputs.permissions_json }}
          CODEX_REVIEW_ARTIFACT_ROOT: ${{ github.workspace }}/trusted/codex-review-artifacts
        run: workflow-helper/setup/codex-review/bin/codex-review push commit-push --in trusted/codex-review-artifacts/fix_merge/merged-fix.json --validation trusted/codex-review-artifacts/push/validated-fix.json --pr-context trusted/codex-review-artifacts/event/pr-context.json --repo-path pr-head --out trusted/codex-review-artifacts/push/push-result.json
      - id: push_result
        run: workflow-helper/setup/codex-review/bin/codex-review push write-outputs --in trusted/codex-review-artifacts/push/push-result.json
      - id: app_token_loop_state
        if: steps.push_result.outputs.push_status == 'pushed'
        env:
          CODEX_REVIEW_GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_GITHUB_APP_ID }}
          CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_APP_PRIVATE_KEY }}
          CODEX_APP_ID: ${{ secrets.CODEX_APP_ID }}
          CODEX_APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
        run: workflow-helper/setup/codex-review/bin/codex-review auth app-token --mode loop-state --pr-context trusted/codex-review-artifacts/event/pr-context.json --out trusted/codex-review-artifacts/push/loop-state-token.json
      - name: Record push into loop state history
        if: steps.push_result.outputs.push_status == 'pushed'
        env:
          GITHUB_TOKEN: ${{ steps.app_token_loop_state.outputs.token }}
          CODEX_REVIEW_APP_TOKEN_PERMISSIONS_JSON: ${{ steps.app_token_loop_state.outputs.permissions_json }}
        run: workflow-helper/setup/codex-review/bin/codex-review push record-push --in trusted/codex-review-artifacts/push/push-result.json --result trusted/codex-review-artifacts/fix_merge/merged-fix.json --design-plan trusted/codex-review-artifacts/design/design-plan.json --loop-state trusted/codex-review-artifacts/event/loop-state.json --pr-context trusted/codex-review-artifacts/event/pr-context.json --out trusted/codex-review-artifacts/push/loop-state-record.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-push
          path: trusted/codex-review-artifacts/push
          retention-days: 7

  finalize:
    name: Finalize labels (loop or issue)
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [guard, plan_tasks, merge_validate, commit_push]
    if: always() && needs.guard.outputs.proceed == 'true'
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: DongwonTTuna-Labs/rs-builder-relayer-client/.github/actions/setup-codex-review@main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-fix-inputs
          path: trusted/codex-review-artifacts
      - name: Mint label-ops token
        id: app_token
        env:
          CODEX_REVIEW_GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_GITHUB_APP_ID }}
          CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_APP_PRIVATE_KEY }}
          CODEX_APP_ID: ${{ secrets.CODEX_APP_ID }}
          CODEX_APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
        run: workflow-helper/setup/codex-review/bin/codex-review auth app-token --mode label-ops --pr-context trusted/codex-review-artifacts/event/pr-context.json --out trusted/codex-review-artifacts/label-token.json || echo "token mint failed; will fall back to GITHUB_TOKEN"
      - name: Transition labels
        env:
          # 리뷰중 must re-trigger codex-review, so the app token (not GITHUB_TOKEN) is required.
          GH_TOKEN: ${{ steps.app_token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_STATUS: ${{ needs.commit_push.outputs.push_status }}
          SHOULD_CONTINUE: ${{ needs.merge_validate.outputs.should_continue }}
          LOOP_TERMINAL: ${{ needs.merge_validate.outputs.loop_terminal_reason }}
          NO_FIX_NEEDED: ${{ needs.plan_tasks.outputs.no_fix_needed }}
        run: |
          set -euo pipefail
          label_add() { gh api --silent -X POST "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=$1"; }
          label_del() { gh api --silent -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/$(python3 -c 'import sys,urllib.parse as u;print(u.quote(sys.argv[1],safe=""))' "$1")" >/dev/null 2>&1 || true; }
          if [ "$NO_FIX_NEEDED" = "true" ]; then
            # Design approved but nothing concrete to change: this is LGTM, not a blocker.
            label_del '수정중'; label_add 'codex:lgtm'
            echo "No fix needed: 수정중 -> codex:lgtm"
          elif [ -n "$LOOP_TERMINAL" ]; then
            # Oscillation / round cap: stop the loop and hand to a human via issue.
            label_del '수정중'; label_add 'codex:needs-issue'
            echo "Loop terminal ($LOOP_TERMINAL): 수정중 -> codex:needs-issue"
          elif [ "$PUSH_STATUS" = "pushed" ] && [ "$SHOULD_CONTINUE" = "true" ]; then
            # Pushed a fix: mark done and re-open review for the next round.
            label_del '수정중'; label_add '수정완료'
            label_add '리뷰중'
            echo "Pushed: 수정중 -> 수정완료 + 리뷰중 (next round)"
          else
            # Nothing pushed / validation failed: hand to a human via issue.
            label_del '수정중'; label_add 'codex:needs-issue'
            echo "No push (status=$PUSH_STATUS): 수정중 -> codex:needs-issue"
          fi
