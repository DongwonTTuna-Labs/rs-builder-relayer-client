name: Codex Loop Review Adapter

# Thin SHA-pinned consumer adapter for the org-reusable Codex loop core.
# Entry point: a non-draft pull request opened/updated/reopened/marked-ready.
# This adapter holds NO loop logic; it only forwards typed inputs to the
# reusable workflow in home-server-infra, pinned to a 40-char commit SHA, and
# always enters dry-run. Live capability is intentionally deferred.
#
# Loop state lives in the reusable core's typed payload + state-pointer
# artifacts, never in labels/comments/issues. This adapter therefore requests
# no issues/labels permissions.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# Distinct from the reusable core's `codex-loop-${correlation_id}` group so the
# caller and callee never cancel each other. A new head SHA (synchronize) opens
# a fresh group; redundant kickoffs of the same PR+head are cancelled.
concurrency:
  group: codex-loop-review-adapter-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  codex-loop-review:
    name: Codex loop review (dry-run)
    # Skip drafts; `ready_for_review` re-enters here once draft is cleared.
    if: ${{ github.event.pull_request.draft == false }}
    # Permission ceiling for the called reusable workflow only. No issues/labels.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    uses: DongwonTTuna-Labs/home-server-infra/.github/workflows/codex-loop-reusable.yml@3540af40d3ef8614ec978a4de90caa69b47f3b99
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      base_ref: ${{ github.event.pull_request.base.ref }}
      stage: review
      iteration: 0
      # Deterministic per (PR, head SHA); a new head (synchronize) yields a new
      # correlation id, preserving uniqueness across synchronize events.
      correlation_id: codex-loop-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      requested_by: ${{ github.event.sender.login }}
      dry_run: true
    secrets:
      CODEX_GITHUB_APP_ID: ${{ secrets.CODEX_APP_ID }}
      CODEX_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
