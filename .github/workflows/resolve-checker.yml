name: Codex Resolve Checker

on:
  workflow_run:
    workflows:
      - Codex PR Review
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to run lifecycle cleanup against
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: codex-resolve-checker-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-upstream:
    name: validate-upstream
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    outputs:
      should_collect: ${{ steps.resolve.outputs.should_collect }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      head_repo: ${{ steps.resolve.outputs.head_repo }}
      pr_author: ${{ steps.resolve.outputs.pr_author }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      upstream_run_id: ${{ steps.resolve.outputs.upstream_run_id }}
      upstream_run_attempt: ${{ steps.resolve.outputs.upstream_run_attempt }}
    steps:
      - name: Checkout workflow helper
        uses: actions/checkout@v6
        with:
          ref: main
          path: workflow
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve PR metadata
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: python3 workflow/.github/scripts/post_review.py resolve-previous

  collect:
    name: collect
    needs: validate-upstream
    if: needs.validate-upstream.outputs.should_collect == 'true'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    outputs:
      has_comments: ${{ steps.collect.outputs.has_comments }}
      batch_indexes: ${{ steps.collect.outputs.batch_indexes || '[]' }}
      pr_number: ${{ needs.validate-upstream.outputs.pr_number }}
      head_sha: ${{ needs.validate-upstream.outputs.head_sha }}
      head_repo: ${{ needs.validate-upstream.outputs.head_repo }}
      pr_author: ${{ needs.validate-upstream.outputs.pr_author }}
      base_ref: ${{ needs.validate-upstream.outputs.base_ref }}
      base_sha: ${{ needs.validate-upstream.outputs.base_sha }}
      upstream_run_id: ${{ needs.validate-upstream.outputs.upstream_run_id }}
      upstream_run_attempt: ${{ needs.validate-upstream.outputs.upstream_run_attempt }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-upstream.outputs.head_sha }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted PR scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-upstream.outputs.base_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare resolve batch directory
        run: |
          rm -rf artifacts/resolve-batches
          mkdir -p artifacts/resolve-batches

      - name: Collect previous Codex comments
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.validate-upstream.outputs.pr_number }}
          BASE_REF: ${{ needs.validate-upstream.outputs.base_ref }}
          BASE_SHA: ${{ needs.validate-upstream.outputs.base_sha }}
          HEAD_SHA: ${{ needs.validate-upstream.outputs.head_sha }}
          HEAD_REPO: ${{ needs.validate-upstream.outputs.head_repo }}
          PR_AUTHOR: ${{ needs.validate-upstream.outputs.pr_author }}
          UPSTREAM_RUN_ID: ${{ needs.validate-upstream.outputs.upstream_run_id }}
          UPSTREAM_RUN_ATTEMPT: ${{ needs.validate-upstream.outputs.upstream_run_attempt }}
        run: >-
          python3 trusted/.github/scripts/post_review.py collect-resolutions
          --batch-dir artifacts/resolve-batches

      - name: Upload resolve batches
        if: steps.collect.outputs.has_comments == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-resolve-batches
          path: artifacts/resolve-batches/*.json
          retention-days: 7

  resolve-check:
    name: resolve-check-${{ matrix.batch }}
    needs: collect
    if: needs.collect.outputs.has_comments == 'true'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.collect.outputs.batch_indexes) }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.collect.outputs.head_sha }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted PR scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.collect.outputs.base_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare resolve-check artifacts
        run: |
          rm -rf artifacts/resolve-batches artifacts/result-*.json
          mkdir -p artifacts/resolve-batches artifacts

      - name: Download resolve batches
        uses: actions/download-artifact@v8
        with:
          name: codex-resolve-batches
          path: artifacts/resolve-batches

      - name: Build resolve-check prompt
        env:
          BATCH: ${{ matrix.batch }}
          BASE_SHA: ${{ needs.collect.outputs.base_sha }}
          HEAD_SHA: ${{ needs.collect.outputs.head_sha }}
          PR_NUMBER: ${{ needs.collect.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          agent_file="trusted/.codex/agents/thread-lifecycle-triager.md"
          batch_padded="$(printf '%03d' "$BATCH")"
          batch_file="artifacts/resolve-batches/batch-${batch_padded}.json"
          prompt_file="${RUNNER_TEMP}/prompt-resolve-${BATCH}.md"

          test -f "$agent_file" || { echo "missing thread lifecycle triager agent: $agent_file" >&2; exit 1; }
          test -f "$batch_file" || { echo "missing resolve batch: $batch_file" >&2; exit 1; }
          mkdir -p artifacts
          {
            cat "$agent_file"
            cat <<EOF

          ---

          Current GitHub workflow contract supersedes legacy Forgejo path references above.

          Return only JSON matching the inline output schema supplied to openai/codex-action.

          Language rules:
          - Write every human-readable resolution reason in Korean.
          - Keep schema field names, enum values, issue keys, thread ids, file paths, code identifiers, and quoted code in their original language.

          Repository inspection:
          - The current working directory is the PR head checkout.
          - Use the files in this workspace as the source of truth for the current implementation.
          - When useful, compare against a review thread commit, original commit, or base/head range.
          - Use commands such as git show, git diff, git log, grep, sed, and find as needed.
          - BASE_SHA=${BASE_SHA} and HEAD_SHA=${HEAD_SHA} are available, but the full PR diff is not the only relevant evidence.
          - Treat the thread lifecycle batch JSON only as a list of review threads to verify, not as complete evidence.

          Pull request:
          EOF
            cat <<EOF
          - repository: ${GITHUB_REPOSITORY}
          - pr_number: ${PR_NUMBER}
          - base_sha: ${BASE_SHA}
          - head_sha: ${HEAD_SHA}
          EOF
            cat <<'EOF'

          Thread lifecycle batch input:
          ```json
          EOF
            cat "$batch_file"
            cat <<'EOF'
          ```
          EOF
          } > "$prompt_file"

      - name: Setup Codex relay
        id: relay-token
        uses: DongwonTTuna-Labs/home-server-infra/.github/actions/setup-codex-relay@303c5cf108ee5c0cb56035023fc7342f76e1e8cb
        with:
          codex-home: ${{ runner.temp }}/codex-home-resolve-${{ matrix.batch }}
          trusted-actors: DongwonTTuna,codex-reviewer-for-dongwonttuna[bot]

      - name: Validate Codex relay args
        env:
          CODEX_ARGS: ${{ steps.relay-token.outputs.codex_args }}
        shell: bash
        run: |
          set -euo pipefail
          expected="85f8c7646018470593ddd2e6e2dddfe750ac8edbbe71a4122bd538fb60540898"
          actual="$(printf '%s' "$CODEX_ARGS" | sha256sum | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Run resolve checker
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
        with:
          prompt-file: ${{ runner.temp }}/prompt-resolve-${{ matrix.batch }}.md
          output-schema: |
            {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "type": "object",
              "additionalProperties": false,
              "required": ["schema_version", "source_manifest_schema_version", "batch_index", "threads"],
              "properties": {
                "schema_version": {
                  "type": "string",
                  "enum": ["codex.thread_lifecycle_result.v3"]
                },
                "source_manifest_schema_version": {
                  "type": "string",
                  "enum": ["codex-resolve-manifest.v3"]
                },
                "batch_index": {
                  "type": "integer"
                },
                "threads": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["thread_id", "state", "reason", "evidence", "issue", "issue_url"],
                    "properties": {
                      "thread_id": {
                        "type": "string",
                        "minLength": 1
                      },
                      "state": {
                        "type": "string",
                        "enum": ["resolved_by_code", "fix_now", "defer_to_issue", "duplicate_of_issue", "false_positive", "stale_obsolete", "needs_human"]
                      },
                      "reason": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 300
                      },
                      "evidence": {
                        "type": "string",
                        "maxLength": 500
                      },
                      "issue_url": {
                        "type": "string",
                        "maxLength": 500
                      },
                      "issue": {
                        "anyOf": [
                          {
                            "type": "object",
                            "additionalProperties": false,
                            "required": ["key", "title", "body", "labels"],
                            "properties": {
                              "key": { "type": "string", "minLength": 1, "maxLength": 80 },
                              "title": { "type": "string", "minLength": 1, "maxLength": 200 },
                              "body": { "type": "string", "minLength": 1, "maxLength": 6000 },
                              "labels": {
                                "type": "array",
                                "items": { "type": "string", "minLength": 1, "maxLength": 80 }
                              }
                            }
                          },
                          { "type": "null" }
                        ]
                      }
                    }
                  }
                }
              }
            }
          output-file: ${{ runner.temp }}/lifecycle-${{ matrix.batch }}.json
          working-directory: ${{ github.workspace }}/workspace
          codex-home: ${{ runner.temp }}/codex-home-resolve-${{ matrix.batch }}
          sandbox: read-only
          safety-strategy: read-only
          codex-version: latest
          model: gpt-5.5
          effort: xhigh
          codex-args: ${{ steps.relay-token.outputs.codex_args }}

      - name: Validate resolve-check output
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          batch = int(os.environ["BATCH"])
          batch_padded = f"{batch:03d}"
          batch_file = Path("artifacts") / "resolve-batches" / f"batch-{batch_padded}.json"
          expected = {
              str(thread["thread_id"])
              for thread in json.loads(batch_file.read_text(encoding="utf-8"))["threads"]
          }
          source = Path(os.environ["RUNNER_TEMP"]) / f"lifecycle-{batch}.json"
          payload = json.loads(source.read_text(encoding="utf-8"))
          actual = {str(item["thread_id"]) for item in payload.get("threads", [])}
          if actual != expected:
              raise SystemExit(f"thread ids mismatch: expected {sorted(expected)}, got {sorted(actual)}")
          if payload.get("schema_version") != "codex.thread_lifecycle_result.v3":
              raise SystemExit(f"invalid lifecycle schema: {payload.get('schema_version')}")
          if payload.get("source_manifest_schema_version") != "codex-resolve-manifest.v3":
              raise SystemExit(f"invalid manifest schema: {payload.get('source_manifest_schema_version')}")
          if int(payload.get("batch_index")) != batch:
              raise SystemExit(f"batch index mismatch: expected {batch}, got {payload.get('batch_index')}")
          out = Path("artifacts") / f"result-{batch_padded}.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload resolve-check result
        uses: actions/upload-artifact@v7
        with:
          name: codex-resolve-${{ matrix.batch }}-result
          path: artifacts/result-*.json
          retention-days: 7

  apply:
    name: apply
    needs: [collect, resolve-check]
    if: needs.collect.result == 'success' && needs.resolve-check.result == 'success' && needs.collect.outputs.has_comments == 'true'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - name: Checkout trusted PR scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.collect.outputs.base_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare apply artifacts
        run: |
          rm -rf artifacts/resolve-batches artifacts/resolutions
          mkdir -p artifacts/resolve-batches artifacts/resolutions

      - name: Download resolve batches
        uses: actions/download-artifact@v8
        with:
          name: codex-resolve-batches
          path: artifacts/resolve-batches

      - name: Download resolve-check results
        uses: actions/download-artifact@v8
        with:
          pattern: codex-resolve-*-result
          path: artifacts/resolutions
          merge-multiple: true

      - name: Validate resolution artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.collect.outputs.pr_number }}
        run: >-
          python3 trusted/.github/scripts/post_review.py validate-resolution-artifacts
          --batches artifacts/resolve-batches
          --results artifacts/resolutions

      - name: Generate App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      - name: Apply resolution decisions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.collect.outputs.pr_number }}
        run: >-
          python3 trusted/.github/scripts/post_review.py apply-resolutions
          --batches artifacts/resolve-batches
          --results artifacts/resolutions

  report-failure:
    name: report-failure
    needs: [validate-upstream, collect, resolve-check, apply]
    if: always() && !cancelled() && (needs.validate-upstream.outputs.should_collect != 'true' || needs.collect.result == 'failure' || needs.resolve-check.result == 'failure' || needs.apply.result == 'failure')
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout workflow helper
        uses: actions/checkout@v6
        with:
          ref: main
          path: workflow
          fetch-depth: 1
          persist-credentials: false

      - name: Summarize resolve-check failure
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.validate-upstream.outputs.pr_number }}
          VALIDATE_UPSTREAM_RESULT: ${{ needs.validate-upstream.result }}
          VALIDATE_UPSTREAM_SHOULD_COLLECT: ${{ needs.validate-upstream.outputs.should_collect }}
          COLLECT_RESULT: ${{ needs.collect.result }}
          RESOLVE_CHECK_RESULT: ${{ needs.resolve-check.result }}
          APPLY_RESULT: ${{ needs.apply.result }}
        run: >-
          python3 workflow/.github/scripts/post_review.py summarize-resolve-failure
