name: Codex Resolve Checker

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to check
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: codex-resolve-checker-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CODEX_REVIEW_ARGS: >-
    ["--enable","use_legacy_landlock","--disable","shell_tool","--ignore-user-config","--ignore-rules","--color","never","-c","model_provider=\"ai-relay\"","-c","model_providers.ai-relay.name=\"AI Relay\"","-c","model_providers.ai-relay.base_url=\"https://relay-ai.dongwontuna.net/v1\"","-c","model_providers.ai-relay.wire_api=\"responses\"","-c","model_providers.ai-relay.env_key=\"AI_RELAY_API_KEY\"","-c","model_providers.ai-relay.supports_websockets=true","-c","model_providers.ai-relay.requires_openai_auth=false","-c","shell_environment_policy.exclude=[\"AI_RELAY_API_KEY\"]","-c","sandbox_workspace_write.network_access=false"]

jobs:
  collect:
    name: collect
    if: github.actor == 'DongwonTTuna'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    outputs:
      has_comments: ${{ steps.collect.outputs.has_comments }}
      batch_indexes: ${{ steps.collect.outputs.batch_indexes || '[]' }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
    steps:
      - name: Resolve PR metadata
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number || '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          TRUSTED_USER = "DongwonTTuna"

          def write_outputs(values):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  for key, value in values.items():
                      output.write(f"{key}={value}\n")

          def skipped():
              return {"should_collect": "false", "pr_number": "", "head_sha": "", "base_ref": ""}

          def github_api(path):
              request = urllib.request.Request(
                  f"https://api.github.com{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "codex-review",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  raise SystemExit(f"GET {path} failed with {exc.code}: {body[:800]}") from exc

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          repo = os.environ["GITHUB_REPOSITORY"]
          actor = os.environ.get("GITHUB_ACTOR", "")

          if actor != TRUSTED_USER:
              write_outputs(skipped())
              raise SystemExit(0)

          if event_name == "pull_request":
              pr = event.get("pull_request") or {}
              base_ref = ((pr.get("base") or {}).get("ref")) or ""
              head_repo = ((pr.get("head") or {}).get("repo") or {}).get("full_name")
              author = (pr.get("user") or {}).get("login")
              if not pr or pr.get("draft") or base_ref != "main" or head_repo != repo or author != TRUSTED_USER:
                  write_outputs(skipped())
              else:
                  write_outputs(
                      {
                          "should_collect": "true",
                          "pr_number": str(pr["number"]),
                          "head_sha": str(pr["head"]["sha"]),
                          "base_ref": "main",
                      }
                  )
              raise SystemExit(0)

          if event_name == "workflow_dispatch":
              pr_number = str(os.environ.get("DISPATCH_PR_NUMBER", "")).strip()
              if not pr_number.isdigit():
                  write_outputs(skipped())
                  raise SystemExit(0)
              pr = github_api(f"/repos/{repo}/pulls/{pr_number}")
              base_ref = ((pr.get("base") or {}).get("ref")) or ""
              head_repo = ((pr.get("head") or {}).get("repo") or {}).get("full_name")
              author = (pr.get("user") or {}).get("login")
              if pr.get("draft") or base_ref != "main" or head_repo != repo or author != TRUSTED_USER:
                  write_outputs(skipped())
              else:
                  write_outputs(
                      {
                          "should_collect": "true",
                          "pr_number": pr_number,
                          "head_sha": str(pr["head"]["sha"]),
                          "base_ref": "main",
                      }
                  )
              raise SystemExit(0)

          write_outputs(skipped())
          PY

      - name: Checkout PR head
        if: steps.resolve.outputs.should_collect == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.head_sha }}
          path: workspace
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout trusted PR scripts
        if: steps.resolve.outputs.should_collect == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.base_ref }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Collect previous Codex comments
        if: steps.resolve.outputs.should_collect == 'true'
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: >-
          python3 trusted/.github/scripts/post_review.py collect-resolutions
          --workspace workspace
          --batch-dir artifacts/resolve-batches

      - name: Upload resolve batches
        if: steps.collect.outputs.has_comments == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-resolve-batches
          path: artifacts/resolve-batches/*.json
          retention-days: 7

  resolve-check:
    name: resolve-check-${{ matrix.batch }}
    needs: collect
    if: needs.collect.outputs.has_comments == 'true'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.collect.outputs.batch_indexes) }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.collect.outputs.head_sha }}
          path: workspace
          fetch-depth: 1
          persist-credentials: false

      - name: Download resolve batches
        uses: actions/download-artifact@v8
        with:
          name: codex-resolve-batches
          path: artifacts/resolve-batches

      - name: Build resolve-check prompt
        env:
          BATCH: ${{ matrix.batch }}
        shell: bash
        run: |
          set -euo pipefail
          agent_file="workspace/.codex/agents/resolve-checker-reviewer.md"
          batch_file="artifacts/resolve-batches/resolve-batch-${BATCH}.json"
          prompt_file="${RUNNER_TEMP}/prompt-resolve-${BATCH}.md"

          test -f "$agent_file" || { echo "missing resolve-checker agent: $agent_file" >&2; exit 1; }
          test -f "$batch_file" || { echo "missing resolve batch: $batch_file" >&2; exit 1; }
          mkdir -p artifacts
          {
            cat "$agent_file"
            cat <<'EOF'

          ---

          Current GitHub workflow contract supersedes legacy Forgejo path references above.

          Return only JSON matching the inline output schema supplied to openai/codex-action.

          Resolve-check input:
          ```json
          EOF
            cat "$batch_file"
            cat <<'EOF'
          ```
          EOF
          } > "$prompt_file"

      - name: Mint relay token
        id: relay-token
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          audience = "https://relay-ai.dongwontuna.net/github-actions"
          broker_url = "https://relay-ai.dongwontuna.net/oidc/exchange"

          def require_env(name):
              value = os.environ.get(name)
              if not value:
                  raise SystemExit(f"missing required environment variable: {name}")
              return value

          def request_json(request):
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")[:800]
                  raise SystemExit(f"{request.full_url} failed with HTTP {exc.code}: {body}") from exc

          parts = urllib.parse.urlsplit(require_env("ACTIONS_ID_TOKEN_REQUEST_URL"))
          query = urllib.parse.parse_qsl(parts.query, keep_blank_values=True)
          query.append(("audience", audience))
          request_url = urllib.parse.urlunsplit(parts._replace(query=urllib.parse.urlencode(query)))
          oidc_payload = request_json(
              urllib.request.Request(
                  request_url,
                  headers={
                      "Accept": "application/json",
                      "Authorization": f"Bearer {require_env('ACTIONS_ID_TOKEN_REQUEST_TOKEN')}",
                  },
              )
          )
          oidc_token = oidc_payload.get("value")
          if not isinstance(oidc_token, str) or not oidc_token:
              raise SystemExit("GitHub OIDC response did not include a token value")
          print(f"::add-mask::{oidc_token}")

          exchanged = request_json(
              urllib.request.Request(
                  broker_url,
                  data=json.dumps({"token": oidc_token}).encode("utf-8"),
                  method="POST",
                  headers={"Accept": "application/json", "Content-Type": "application/json"},
              )
          )
          relay_token = exchanged.get("relay_token")
          if exchanged.get("token_type") != "Bearer" or not isinstance(relay_token, str) or not relay_token.startswith("sk-clb-"):
              raise SystemExit("broker response did not include a valid relay token")
          print(f"::add-mask::{relay_token}")

          with open(require_env("GITHUB_OUTPUT"), "a", encoding="utf-8") as output:
              for key in ("relay_token", "expires_at", "api_key_id"):
                  value = exchanged.get(key)
                  if not isinstance(value, str) or not value:
                      raise SystemExit(f"broker response did not include {key}")
                  output.write(f"{key}={value}\n")
          PY

      - name: Check relay token
        env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
        run: test -n "$AI_RELAY_API_KEY"

      - name: Prepare Codex action home
        env:
          CODEX_ACTION_HOME: ${{ runner.temp }}/codex-home-resolve-${{ matrix.batch }}
        run: |
          mkdir -p "$CODEX_ACTION_HOME"
          printf '{"port":0}\n' > "$CODEX_ACTION_HOME/${GITHUB_RUN_ID}.json"

      - name: Run resolve checker
        uses: openai/codex-action@v1
        env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
        with:
          prompt-file: ${{ runner.temp }}/prompt-resolve-${{ matrix.batch }}.md
          output-schema: |
            {
              "$schema": "http://json-schema.org/draft-07/schema#",
              "type": "object",
              "additionalProperties": false,
              "required": ["resolutions"],
              "properties": {
                "resolutions": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["comment_id", "resolved", "reason"],
                    "properties": {
                      "comment_id": {
                        "type": "integer",
                        "minimum": 1
                      },
                      "resolved": {
                        "type": "boolean"
                      },
                      "reason": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 300
                      }
                    }
                  }
                }
              }
            }
          output-file: ${{ runner.temp }}/resolutions-${{ matrix.batch }}.json
          working-directory: ${{ github.workspace }}/workspace
          codex-home: ${{ runner.temp }}/codex-home-resolve-${{ matrix.batch }}
          sandbox: read-only
          safety-strategy: read-only
          codex-version: latest
          model: gpt-5.5
          effort: xhigh
          codex-args: ${{ env.CODEX_REVIEW_ARGS }}

      - name: Validate resolve-check output
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          batch = str(os.environ["BATCH"])
          batch_file = Path("artifacts") / "resolve-batches" / f"resolve-batch-{batch}.json"
          expected = {
              int(comment["comment_id"])
              for comment in json.loads(batch_file.read_text(encoding="utf-8"))["comments"]
          }
          source = Path(os.environ["RUNNER_TEMP"]) / f"resolutions-{batch}.json"
          payload = json.loads(source.read_text(encoding="utf-8"))
          actual = {int(item["comment_id"]) for item in payload.get("resolutions", [])}
          if actual != expected:
              raise SystemExit(f"resolution ids mismatch: expected {sorted(expected)}, got {sorted(actual)}")
          out = Path("artifacts") / f"resolutions-{batch}.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload resolve-check result
        uses: actions/upload-artifact@v7
        with:
          name: codex-resolve-${{ matrix.batch }}-result
          path: artifacts/resolutions-${{ matrix.batch }}.json
          retention-days: 7

  apply:
    name: apply
    needs: [collect, resolve-check]
    if: always() && !cancelled() && needs.collect.outputs.has_comments == 'true'
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10
    steps:
      - name: Checkout trusted PR scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.collect.outputs.base_ref }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Download resolve batches
        uses: actions/download-artifact@v8
        with:
          name: codex-resolve-batches
          path: artifacts/resolve-batches

      - name: Download resolve-check results
        uses: actions/download-artifact@v8
        with:
          pattern: codex-resolve-*-result
          path: artifacts/resolutions
          merge-multiple: true

      - name: Generate App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CODEX_APP_ID }}
          private-key: ${{ secrets.CODEX_APP_PRIVATE_KEY }}

      - name: Apply resolution decisions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.collect.outputs.pr_number }}
          HEAD_SHA: ${{ needs.collect.outputs.head_sha }}
        run: >-
          python3 trusted/.github/scripts/post_review.py apply-resolutions
          --batches artifacts/resolve-batches
          --results artifacts/resolutions
