name: Codex Loop Manual Adapter

# Thin SHA-pinned manual/debug entry point for the org-reusable Codex loop core.
# Entry point: an operator running `workflow_dispatch` from the Actions UI/API to
# replay or debug a single loop stage. This adapter holds NO loop logic; it only
# forwards typed inputs to the reusable workflow in home-server-infra, pinned to a
# 40-char commit SHA. The loop runs live: an eligible (trusted/non-fork/non-stale)
# PR with the core's relay/App secrets present will make real model calls, post
# review comments, push autofix commits, and dispatch continuation.
#
# Loop state lives in the reusable core's typed payload + state-pointer artifacts,
# never in labels/comments/issues. This adapter therefore requests no
# issues/labels permissions.
#
# Input contract is intentionally limited to this adapter's current manual fields.
# Initial manual review bootstrap does not fabricate state pointer inputs; later
# continuation runs use state pointers emitted by the reusable core.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to process.
        type: number
        required: true
      head_sha:
        description: Expected pull request head SHA.
        type: string
        required: true
      base_ref:
        description: Expected pull request base ref.
        type: string
        required: true
      stage:
        description: Loop stage to run.
        type: choice
        required: true
        default: review
        options:
          - review
          - design
          - fix
          - push
      iteration:
        description: Zero-based loop iteration.
        type: number
        required: true
        default: 0
      correlation_id:
        description: Stable loop correlation id.
        type: string
        required: true
      requested_by:
        description: GitHub actor or app slug requesting this manual run.
        type: string
        required: true
      state_run_id:
        description: >-
          Continuation only. Workflow run id that owns the prior loop-state
          artifact, taken from a previous run's terminal summary. Leave empty
          for an initial run; the reusable core then bootstraps empty state.
        type: string
        required: false
        default: ""
      state_artifact_name:
        description: >-
          Continuation only. Prior loop-state artifact name from a previous
          run's terminal summary. Must be set together with state_run_id; the
          reusable core rejects exactly one of the pair.
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  codex-loop-manual:
    name: Codex loop manual
    # Permission ceiling for the called reusable workflow only. No issues/labels.
    permissions:
      actions: read
      contents: write
      pull-requests: write
      id-token: write
    uses: DongwonTTuna-Labs/home-server-infra/.github/workflows/codex-loop-reusable.yml@main
    with:
      pr_number: ${{ fromJSON(format('{0}', inputs.pr_number)) }}
      head_sha: ${{ inputs.head_sha }}
      base_ref: ${{ inputs.base_ref }}
      stage: ${{ inputs.stage }}
      iteration: ${{ fromJSON(format('{0}', inputs.iteration)) }}
      correlation_id: ${{ inputs.correlation_id }}
      requested_by: ${{ inputs.requested_by }}
      # Forwarded as-is; both empty on an initial run. The core enforces the
      # both-or-neither rule, so the adapter stays a pure passthrough.
      state_run_id: ${{ inputs.state_run_id }}
      state_artifact_name: ${{ inputs.state_artifact_name }}
    # No secrets: the core reads credentials from the runner environment.
