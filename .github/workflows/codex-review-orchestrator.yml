name: Codex Review Orchestrator v3

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number for manual dry run
        required: false

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: codex-review-v3-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: false

env:
  CODEX_REVIEW_ARTIFACT_ROOT: ${{ github.workspace }}/codex-review-artifacts
  CODEX_REVIEW_TRUSTED_CHECKOUT: ${{ github.workspace }}
  CODEX_REVIEW_MODEL_COMMAND: ${{ vars.CODEX_REVIEW_MODEL_COMMAND || format('{0}/workflow-helper/setup/codex-review/bin/codex-review-model-runner', github.workspace) }}
  CODEX_REVIEW_MODEL_TIMEOUT: ${{ vars.CODEX_REVIEW_MODEL_TIMEOUT || '1800' }}
  CODEX_REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}

jobs:
  bootstrap_event:
    name: 00 bootstrap event
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    permissions:
      contents: read
      pull-requests: read
    outputs:
      event_context: ${{ steps.paths.outputs.event_context }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - id: paths
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p codex-review-artifacts/event
          workflow-helper/setup/codex-review/bin/codex-review event resolve-current --out codex-review-artifacts/event/event-context.json
          workflow-helper/setup/codex-review/bin/codex-review context pr --event "$GITHUB_EVENT_PATH" --pr-context codex-review-artifacts/event/event-context.json --out codex-review-artifacts/event/pr-context.json
          workflow-helper/setup/codex-review/bin/codex-review context changed-lines --in codex-review-artifacts/event/pr-context.json --out codex-review-artifacts/event/changed-lines.json
          workflow-helper/setup/codex-review/bin/codex-review context docs --repo-path . --out codex-review-artifacts/event/docs-context.md
          echo "event_context=codex-review-artifacts/event/event-context.json" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-event
          path: codex-review-artifacts/event

  resolve_collect:
    name: 00 resolve collect
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [bootstrap_event]
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-event
          path: codex-review-artifacts/event
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: workflow-helper/setup/codex-review/bin/codex-review stage00 collect --pr-context codex-review-artifacts/event/pr-context.json --out codex-review-artifacts/stage00/thread-inventory.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-stage00-collect
          path: codex-review-artifacts/stage00

  resolve_triage_model:
    name: 00 resolve triage model
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [resolve_collect]
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-event
          path: codex-review-artifacts/event
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-stage00-collect
          path: codex-review-artifacts/stage00
      - name: Setup Codex relay
        id: relay-token
        uses: DongwonTTuna-Labs/home-server-infra/.github/actions/setup-codex-relay@main
        with:
          codex-home: ${{ runner.temp }}/codex-home-${{ github.job }}
          trusted-actors: DongwonTTuna,codex-reviewer-for-dongwonttuna[bot]
      - env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
          CODEX_REVIEW_CODEX_ARGS_JSON: ${{ steps.relay-token.outputs.codex_args }}
        run: |
          workflow-helper/setup/codex-review/bin/codex-review stage00 build-prompt --inventory codex-review-artifacts/stage00/thread-inventory.json --docs-context codex-review-artifacts/event/docs-context.md --out codex-review-artifacts/stage00/lifecycle-prompt.md
          workflow-helper/setup/codex-review/bin/codex-review stage00 model-result --prompt codex-review-artifacts/stage00/lifecycle-prompt.md --inventory codex-review-artifacts/stage00/thread-inventory.json --out codex-review-artifacts/stage00/lifecycle-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-stage00-model
          path: codex-review-artifacts/stage00

  resolve_apply_trusted:
    name: 00 resolve apply trusted
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [resolve_triage_model]
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      route: ${{ steps.route.outputs.route }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-event
          path: codex-review-artifacts/event
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-stage00-model
          path: codex-review-artifacts/stage00
      - id: app_token
        if: vars.CODEX_REVIEW_ENABLE_STAGE00_APPLY == 'true'
        env:
          CODEX_REVIEW_GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_GITHUB_APP_ID }}
          CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_APP_PRIVATE_KEY }}
        run: workflow-helper/setup/codex-review/bin/codex-review auth app-token --mode stage00 --pr-context codex-review-artifacts/event/pr-context.json --out codex-review-artifacts/stage00/app-token.json
      - env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          CODEX_REVIEW_APP_TOKEN_PERMISSIONS_JSON: ${{ steps.app_token.outputs.permissions_json }}
        run: |
          workflow-helper/setup/codex-review/bin/codex-review stage00 validate --inventory codex-review-artifacts/stage00/thread-inventory.json --in codex-review-artifacts/stage00/lifecycle-result.json --out codex-review-artifacts/stage00/lifecycle-result.validated.json
          if [ "${{ vars.CODEX_REVIEW_ENABLE_STAGE00_APPLY }}" = "true" ]; then
            workflow-helper/setup/codex-review/bin/codex-review stage00 apply --result codex-review-artifacts/stage00/lifecycle-result.validated.json --pr-context codex-review-artifacts/event/pr-context.json --out codex-review-artifacts/stage00/apply-report.json
          else
            workflow-helper/setup/codex-review/bin/codex-review stage00 apply --dry-run --result codex-review-artifacts/stage00/lifecycle-result.validated.json --pr-context codex-review-artifacts/event/pr-context.json --out codex-review-artifacts/stage00/apply-report.json
          fi
      - id: route
        run: workflow-helper/setup/codex-review/bin/codex-review stage00 route --inventory codex-review-artifacts/stage00/thread-inventory.json --result codex-review-artifacts/stage00/lifecycle-result.validated.json --artifacts codex-review-artifacts/stage00/apply-report.json --out codex-review-artifacts/stage00/gate-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-stage00
          path: codex-review-artifacts/stage00

  review_axes_model:
    name: 01 review axes model
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [resolve_apply_trusted]
    if: needs.resolve_apply_trusted.outputs.route == 'run_review'
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        axis: [correctness, security, performance, test-coverage, domain]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-event
          path: codex-review-artifacts/event
      - name: Setup Codex relay
        id: relay-token
        uses: DongwonTTuna-Labs/home-server-infra/.github/actions/setup-codex-relay@main
        with:
          codex-home: ${{ runner.temp }}/codex-home-${{ github.job }}
          trusted-actors: DongwonTTuna,codex-reviewer-for-dongwonttuna[bot]
      - env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
          CODEX_REVIEW_CODEX_ARGS_JSON: ${{ steps.relay-token.outputs.codex_args }}
        run: |
          mkdir -p codex-review-artifacts/stage01/${{ matrix.axis }}
          workflow-helper/setup/codex-review/bin/codex-review stage01 build-review-prompt --axis ${{ matrix.axis }} --pr-context codex-review-artifacts/event/pr-context.json --docs-context codex-review-artifacts/event/docs-context.md --out codex-review-artifacts/stage01/${{ matrix.axis }}/prompt.md
          workflow-helper/setup/codex-review/bin/codex-review stage01 model-result --axis ${{ matrix.axis }} --prompt codex-review-artifacts/stage01/${{ matrix.axis }}/prompt.md --out codex-review-artifacts/stage01/${{ matrix.axis }}/findings.json
          workflow-helper/setup/codex-review/bin/codex-review stage01 validate --axis ${{ matrix.axis }} --in codex-review-artifacts/stage01/${{ matrix.axis }}/findings.json --pr-context codex-review-artifacts/event/pr-context.json --changed-lines codex-review-artifacts/event/changed-lines.json --out codex-review-artifacts/stage01/${{ matrix.axis }}/findings.validated.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-stage01-${{ matrix.axis }}
          path: codex-review-artifacts/stage01/${{ matrix.axis }}

  review_combine:
    name: 01 review combine
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [review_axes_model]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: codex-review-stage01-*
          path: codex-review-artifacts/stage01-downloads
          merge-multiple: false
      - run: workflow-helper/setup/codex-review/bin/codex-review stage01 combine --artifacts codex-review-artifacts/stage01-downloads --out codex-review-artifacts/stage01/combined-findings.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-stage01-combined
          path: codex-review-artifacts/stage01

  techlead_model:
    name: 02 techlead model
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [review_combine]
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-event
          path: codex-review-artifacts/event
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-stage01-combined
          path: codex-review-artifacts/stage01
      - name: Setup Codex relay
        id: relay-token
        uses: DongwonTTuna-Labs/home-server-infra/.github/actions/setup-codex-relay@main
        with:
          codex-home: ${{ runner.temp }}/codex-home-${{ github.job }}
          trusted-actors: DongwonTTuna,codex-reviewer-for-dongwonttuna[bot]
      - env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
          CODEX_REVIEW_CODEX_ARGS_JSON: ${{ steps.relay-token.outputs.codex_args }}
        run: |
          mkdir -p codex-review-artifacts/stage02
          workflow-helper/setup/codex-review/bin/codex-review stage02 build-techlead-prompt --in codex-review-artifacts/stage01/combined-findings.json --pr-context codex-review-artifacts/event/pr-context.json --docs-context codex-review-artifacts/event/docs-context.md --out codex-review-artifacts/stage02/prompt.md
          workflow-helper/setup/codex-review/bin/codex-review stage02 model-result --prompt codex-review-artifacts/stage02/prompt.md --inventory codex-review-artifacts/stage01/combined-findings.json --out codex-review-artifacts/stage02/techlead-decision.json
          workflow-helper/setup/codex-review/bin/codex-review stage02 validate --inventory codex-review-artifacts/stage01/combined-findings.json --in codex-review-artifacts/stage02/techlead-decision.json --out codex-review-artifacts/stage02/techlead-decision.validated.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-stage02-model
          path: codex-review-artifacts/stage02

  review_publish_trusted:
    name: 02 review publish trusted
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [techlead_model]
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      route: ${{ steps.route.outputs.route }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-event
          path: codex-review-artifacts/event
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-stage01-combined
          path: codex-review-artifacts/stage01
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-stage02-model
          path: codex-review-artifacts/stage02
      - id: app_token
        if: vars.CODEX_REVIEW_ENABLE_REVIEW_POSTING == 'true'
        env:
          CODEX_REVIEW_GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_GITHUB_APP_ID }}
          CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_APP_PRIVATE_KEY }}
        run: workflow-helper/setup/codex-review/bin/codex-review auth app-token --mode stage02 --pr-context codex-review-artifacts/event/pr-context.json --out codex-review-artifacts/stage02/app-token.json
      - env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          CODEX_REVIEW_APP_TOKEN_PERMISSIONS_JSON: ${{ steps.app_token.outputs.permissions_json }}
        run: |
          workflow-helper/setup/codex-review/bin/codex-review stage02 classify --in codex-review-artifacts/stage02/techlead-decision.validated.json --artifacts codex-review-artifacts/stage01/combined-findings.json --out codex-review-artifacts/stage02/review-publication.json
          if [ "${{ vars.CODEX_REVIEW_ENABLE_REVIEW_POSTING }}" = "true" ]; then
            workflow-helper/setup/codex-review/bin/codex-review stage02 publish --in codex-review-artifacts/stage02/review-publication.json --pr-context codex-review-artifacts/event/pr-context.json --changed-lines codex-review-artifacts/event/changed-lines.json --out codex-review-artifacts/stage02/publish-report.json
          else
