          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-event
          path: codex-review-artifacts/event
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-stage03
          path: codex-review-artifacts/stage03
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-stage04-model
          path: codex-review-artifacts/stage04
      - id: app_token
        if: vars.CODEX_REVIEW_ENABLE_DESIGN_POSTING == 'true'
        env:
          CODEX_REVIEW_GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_GITHUB_APP_ID }}
          CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_APP_PRIVATE_KEY }}
          CODEX_APP_ID: ${{ secrets.CODEX_APP_ID }}
          CODEX_APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
        run: workflow-helper/setup/codex-review/bin/codex-review auth app-token --mode stage04 --pr-context codex-review-artifacts/event/pr-context.json --out codex-review-artifacts/stage04/app-token.json
      - env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          CODEX_REVIEW_APP_TOKEN_PERMISSIONS_JSON: ${{ steps.app_token.outputs.permissions_json }}
        run: |
          if [ "${{ vars.CODEX_REVIEW_ENABLE_DESIGN_POSTING }}" = "true" ]; then
            workflow-helper/setup/codex-review/bin/codex-review stage04 publish --inventory codex-review-artifacts/stage03/design-plan.json --in codex-review-artifacts/stage04/chief-decision.validated.json --pr-context codex-review-artifacts/event/pr-context.json --out codex-review-artifacts/stage04/publish-report.json
          else
            workflow-helper/setup/codex-review/bin/codex-review stage04 publish --dry-run --inventory codex-review-artifacts/stage03/design-plan.json --in codex-review-artifacts/stage04/chief-decision.validated.json --pr-context codex-review-artifacts/event/pr-context.json --out codex-review-artifacts/stage04/publish-report.json
          fi
      - id: route
        run: workflow-helper/setup/codex-review/bin/codex-review stage04 route --in codex-review-artifacts/stage04/chief-decision.validated.json --out codex-review-artifacts/stage04/route.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-stage04
          path: codex-review-artifacts/stage04

  fix_prepare:
    name: 05 fix prepare
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [bootstrap_event, design_publish_trusted]
    if: needs.design_publish_trusted.outputs.route == 'run_stage05' && needs.bootstrap_event.outputs.same_repo == 'true'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      agent_matrix: ${{ steps.prepare.outputs.agent_matrix }}
      has_agent_tasks: ${{ steps.prepare.outputs.has_agent_tasks }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install trusted codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
