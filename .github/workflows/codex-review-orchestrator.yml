          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - name: Checkout PR head for model inspection
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ needs.bootstrap_event.outputs.head_repo_full_name || github.repository }}
          ref: ${{ needs.bootstrap_event.outputs.head_sha || github.sha }}
          path: pr-head
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-stage03-prepare
          path: codex-review-artifacts/stage03
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.design_prepare.outputs.has_analysis_batches == 'true'
        with:
          pattern: codex-review-stage03-analysis-*
          path: codex-review-artifacts/stage03-analysis-downloads
          merge-multiple: false
      - name: Setup Codex relay
        id: relay-token
        uses: DongwonTTuna-Labs/home-server-infra/.github/actions/setup-codex-relay@main
        with:
          codex-home: ${{ runner.temp }}/codex-relay-home-${{ github.job }}
          trusted-actors: DongwonTTuna,codex-reviewer-for-dongwonttuna[bot]
      - name: Prepare design plan schema
        run: |
