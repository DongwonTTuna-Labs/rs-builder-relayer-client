      - name: Run Codex design plan model
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
        with:
          prompt-file: ${{ github.workspace }}/codex-review-artifacts/stage03/design-plan.prompt.md
          output-file: ${{ github.workspace }}/codex-review-artifacts/stage03/design-plan.raw.json
          output-schema-file: ${{ github.workspace }}/codex-review-artifacts/schemas/stage03-design-plan.v1.openai.schema.json
          working-directory: ${{ github.workspace }}/pr-head
