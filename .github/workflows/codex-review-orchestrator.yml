        needs.push_validate_no_token.outputs.validation_status == 'semantic_safety_rejected' ||
        needs.push_validate_no_token.outputs.validation_status == 'semantic_safety_hash_mismatch' ||
        needs.push_trusted.outputs.push_status == 'no_fix' ||
        needs.push_trusted.outputs.push_status == 'blocked' ||
        needs.push_trusted.outputs.push_status == 'no_diff_repeat' ||
        needs.push_trusted.outputs.push_status == 'empty_patch' ||
        needs.push_trusted.outputs.push_status == 'tests_failed' ||
        needs.push_trusted.outputs.push_status == 'validation_failed' ||
        needs.push_trusted.outputs.push_status == 'semantic_safety_missing' ||
        needs.push_trusted.outputs.push_status == 'semantic_safety_rejected' ||
        needs.push_trusted.outputs.push_status == 'semantic_safety_hash_mismatch' ||
        needs.push_trusted.outputs.push_status == 'committed_no_head_ref' ||
        needs.push_trusted.outputs.push_status == 'push_failed' ||
        needs.push_trusted.outputs.push_status == 'failed' ||
        needs.push_trusted.result == 'failure' ||
        (needs.push_trusted.result == 'skipped' && needs.design_publish_trusted.outputs.route == 'run_stage05' && needs.bootstrap_event.outputs.same_repo == 'true')
      )
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install codex-review helper
