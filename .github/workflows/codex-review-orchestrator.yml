  record_reentry:
    name: 08 record reentry
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [push_trusted]
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-event
          path: codex-review-artifacts/event
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-stage07
          path: codex-review-artifacts/stage07
      - id: app_token
        if: vars.CODEX_REVIEW_ENABLE_PUSH == 'true'
        env:
          CODEX_REVIEW_GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_GITHUB_APP_ID }}
          CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_APP_PRIVATE_KEY }}
        run: workflow-helper/setup/codex-review/bin/codex-review auth app-token --mode stage08 --pr-context codex-review-artifacts/event/pr-context.json --out codex-review-artifacts/stage08/app-token.json
      - env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          CODEX_REVIEW_APP_TOKEN_PERMISSIONS_JSON: ${{ steps.app_token.outputs.permissions_json }}
        run: |
          if [ "${{ vars.CODEX_REVIEW_ENABLE_PUSH }}" = "true" ]; then
            workflow-helper/setup/codex-review/bin/codex-review stage08 record --in codex-review-artifacts/stage07/push-result.json --pr-context codex-review-artifacts/event/pr-context.json --out codex-review-artifacts/stage08/reentry.json
          else
            workflow-helper/setup/codex-review/bin/codex-review stage08 record --in codex-review-artifacts/stage07/push-result.json --out codex-review-artifacts/stage08/reentry.json
          fi
          workflow-helper/setup/codex-review/bin/codex-review stage08 validate --in codex-review-artifacts/stage08/reentry.json --out codex-review-artifacts/stage08/reentry.validated.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-stage08
          path: codex-review-artifacts/stage08
