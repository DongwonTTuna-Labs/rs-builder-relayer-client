name: Codex Review Orchestrator v3

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number for manual OpenSpec-driven run
        required: false

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: codex-review-v3-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: ${{ github.actor != 'codex-reviewer-for-dongwonttuna[bot]' }}

env:
  CODEX_REVIEW_ARTIFACT_ROOT: ${{ github.workspace }}/codex-review-artifacts
  CODEX_REVIEW_TRUSTED_CHECKOUT: ${{ github.workspace }}
  CODEX_REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}

jobs:
  fix_prepare:
    name: 05 fix prepare
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [bootstrap_event, design_publish_trusted]
    if: needs.design_publish_trusted.outputs.route == 'run_stage05' && needs.bootstrap_event.outputs.same_repo == 'true'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      agent_matrix: ${{ steps.prepare.outputs.agent_matrix }}
      has_agent_tasks: ${{ steps.prepare.outputs.has_agent_tasks }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install trusted codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-event
          path: trusted/codex-review-artifacts/event
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-stage03
          path: trusted/codex-review-artifacts/stage03
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-stage04
          path: trusted/codex-review-artifacts/stage04
      - id: prepare
        env:
          CODEX_REVIEW_ARTIFACT_ROOT: ${{ github.workspace }}/trusted/codex-review-artifacts
          CODEX_REVIEW_TRUSTED_CHECKOUT: ${{ github.workspace }}/trusted
        run: |
          workflow-helper/setup/codex-review/bin/codex-review stage05 plan --in trusted/codex-review-artifacts/stage03/design-plan.json --inventory trusted/codex-review-artifacts/stage04/chief-decision.validated.json --out trusted/codex-review-artifacts/stage05/manifest.json
          workflow-helper/setup/codex-review/bin/codex-review stage05 prepare-agents --inventory trusted/codex-review-artifacts/stage05/manifest.json --design-plan trusted/codex-review-artifacts/stage03/design-plan.json --chief-decision trusted/codex-review-artifacts/stage04/chief-decision.validated.json --docs-context trusted/codex-review-artifacts/event/docs-context.md --repo-path pr-head --work-dir trusted/codex-review-artifacts/stage05/agents --out trusted/codex-review-artifacts/stage05/agent-matrix.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-stage05-prepare
          path: trusted/codex-review-artifacts/stage05

  fix_agent_model:
    name: 05 fix agent model
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [bootstrap_event, fix_prepare]
    if: needs.fix_prepare.outputs.has_agent_tasks == 'true'
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.fix_prepare.outputs.agent_matrix) }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ needs.bootstrap_event.outputs.head_repo_full_name || github.repository }}
          ref: ${{ needs.bootstrap_event.outputs.head_sha || github.sha }}
          path: pr-head
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install trusted codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-stage05-prepare
          path: trusted/codex-review-artifacts/stage05
      - name: Setup Codex relay
        id: relay-token
        uses: DongwonTTuna-Labs/home-server-infra/.github/actions/setup-codex-relay@main
        with:
          codex-home: ${{ runner.temp }}/codex-relay-home-${{ github.job }}-${{ matrix.task_path }}
          trusted-actors: DongwonTTuna,codex-reviewer-for-dongwonttuna[bot]
      - name: Prepare fix agent schema
        run: |
          mkdir -p trusted/codex-review-artifacts/schemas
          workflow-helper/setup/codex-review/bin/codex-review schema openai-strict --schema stage05-fix-agent-result.v1 --out trusted/codex-review-artifacts/schemas/stage05-fix-agent-result.v1.openai.schema.json
      - name: Run Codex fix agent model
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
        with:
          prompt-file: ${{ github.workspace }}/${{ matrix.prompt_file }}
          output-file: ${{ github.workspace }}/${{ matrix.output_file }}
          output-schema-file: ${{ github.workspace }}/trusted/codex-review-artifacts/schemas/stage05-fix-agent-result.v1.openai.schema.json
          working-directory: ${{ github.workspace }}/pr-head
          sandbox: read-only
          safety-strategy: read-only
          codex-args: ${{ steps.relay-token.outputs.codex_args }}
          codex-home: ${{ runner.temp }}/codex-relay-home-${{ github.job }}-${{ matrix.task_path }}
          allow-users: DongwonTTuna
          allow-bots: true
          allow-bot-users: codex-reviewer-for-dongwonttuna[bot]
      - name: Validate fix agent result
        run: workflow-helper/setup/codex-review/bin/codex-review stage05 validate-agent-result --inventory "${{ github.workspace }}/${{ matrix.task_file }}" --in "${{ github.workspace }}/${{ matrix.output_file }}" --out "${{ github.workspace }}/${{ matrix.validated_file }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-stage05-agent-${{ matrix.task_path }}
          path: ${{ github.workspace }}/trusted/codex-review-artifacts/stage05/agents/${{ matrix.task_path }}

  fix_collect_and_merge:
    name: 05-06 fix collect and merge
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [bootstrap_event, fix_prepare, fix_agent_model]
    if: always() && needs.fix_prepare.result == 'success' && (needs.fix_agent_model.result == 'success' || needs.fix_agent_model.result == 'skipped')
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ needs.bootstrap_event.outputs.head_repo_full_name || github.repository }}
          ref: ${{ needs.bootstrap_event.outputs.head_sha || github.sha }}
          path: pr-head
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install trusted codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-event
          path: trusted/codex-review-artifacts/event
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-stage04
          path: trusted/codex-review-artifacts/stage04
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-stage05-prepare
          path: trusted/codex-review-artifacts/stage05
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.fix_prepare.outputs.has_agent_tasks == 'true'
        with:
          pattern: codex-review-stage05-agent-*
          path: trusted/codex-review-artifacts/stage05-agent-downloads
          merge-multiple: false
      - id: merge_route
        env:
          CODEX_REVIEW_ARTIFACT_ROOT: ${{ github.workspace }}/trusted/codex-review-artifacts
          CODEX_REVIEW_TRUSTED_CHECKOUT: ${{ github.workspace }}/trusted
        run: |
          mkdir -p trusted/codex-review-artifacts/stage05-agent-downloads trusted/codex-review-artifacts/stage06
          workflow-helper/setup/codex-review/bin/codex-review stage05 collect --inventory trusted/codex-review-artifacts/stage05/manifest.json --artifacts trusted/codex-review-artifacts/stage05-agent-downloads --out trusted/codex-review-artifacts/stage05/collection.json
          workflow-helper/setup/codex-review/bin/codex-review stage06 premerge --in trusted/codex-review-artifacts/stage05/collection.json --repo-path pr-head --out trusted/codex-review-artifacts/stage06/premerge-report.json
          workflow-helper/setup/codex-review/bin/codex-review stage06 prepare-merge-model --inventory trusted/codex-review-artifacts/stage06/premerge-report.json --in trusted/codex-review-artifacts/stage05/collection.json --pr-context trusted/codex-review-artifacts/event/pr-context.json --docs-context trusted/codex-review-artifacts/event/docs-context.md --repo-path pr-head --prompt-out trusted/codex-review-artifacts/stage06/merge-prompt.md --raw-out trusted/codex-review-artifacts/stage06/merged-fix.raw.json --out trusted/codex-review-artifacts/stage06/merge-route.json
      - name: Setup Codex relay
        id: relay-token
        if: steps.merge_route.outputs.needs_model == 'true'
        uses: DongwonTTuna-Labs/home-server-infra/.github/actions/setup-codex-relay@main
        with:
          codex-home: ${{ runner.temp }}/codex-relay-home-${{ github.job }}
          trusted-actors: DongwonTTuna,codex-reviewer-for-dongwonttuna[bot]
      - name: Prepare merged fix schema
        if: steps.merge_route.outputs.needs_model == 'true'
        run: |
          mkdir -p trusted/codex-review-artifacts/schemas
          workflow-helper/setup/codex-review/bin/codex-review schema openai-strict --schema stage06-merged-fix.v1 --out trusted/codex-review-artifacts/schemas/stage06-merged-fix.v1.openai.schema.json
      - name: Run Codex merged fix model
        if: steps.merge_route.outputs.needs_model == 'true'
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
        with:
          prompt-file: ${{ github.workspace }}/trusted/codex-review-artifacts/stage06/merge-prompt.md
          output-file: ${{ github.workspace }}/trusted/codex-review-artifacts/stage06/merged-fix.raw.json
          output-schema-file: ${{ github.workspace }}/trusted/codex-review-artifacts/schemas/stage06-merged-fix.v1.openai.schema.json
          working-directory: ${{ github.workspace }}/pr-head
          sandbox: read-only
          safety-strategy: read-only
          codex-args: ${{ steps.relay-token.outputs.codex_args }}
          codex-home: ${{ runner.temp }}/codex-relay-home-${{ github.job }}
          allow-users: DongwonTTuna
          allow-bots: true
          allow-bot-users: codex-reviewer-for-dongwonttuna[bot]
      - name: Validate merged fix
        run: workflow-helper/setup/codex-review/bin/codex-review stage06 validate --inventory trusted/codex-review-artifacts/stage06/premerge-report.json --chief-decision trusted/codex-review-artifacts/stage04/chief-decision.validated.json --in trusted/codex-review-artifacts/stage06/merged-fix.raw.json --repo-path pr-head --out trusted/codex-review-artifacts/stage06/merged-fix.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-stage05-06
          path: trusted/codex-review-artifacts

  semantic_patch_safety_model:
    name: 06 semantic patch safety model
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [bootstrap_event, fix_collect_and_merge]
    if: always() && needs.fix_collect_and_merge.result == 'success'
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      semantic_safety_status: ${{ steps.semantic_safety_outputs.outputs.semantic_safety_status }}
      semantic_safety_approved: ${{ steps.semantic_safety_outputs.outputs.semantic_safety_approved }}
      semantic_safety_patch_hash: ${{ steps.semantic_safety_outputs.outputs.semantic_safety_patch_hash }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ needs.bootstrap_event.outputs.head_repo_full_name || github.repository }}
          ref: ${{ needs.bootstrap_event.outputs.head_sha || github.sha }}
          path: pr-head
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install trusted codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-event
          path: trusted/codex-review-artifacts/event
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-stage05-06
          path: trusted/codex-review-artifacts
      - name: Build semantic patch safety prompt
        run: workflow-helper/setup/codex-review/bin/codex-review stage06 build-semantic-safety-prompt --in trusted/codex-review-artifacts/stage06/merged-fix.json --pr-context trusted/codex-review-artifacts/event/pr-context.json --docs-context trusted/codex-review-artifacts/event/docs-context.md --repo-path pr-head --out trusted/codex-review-artifacts/stage06/semantic-safety-prompt.md
      - name: Setup Codex relay
        id: relay-token
        uses: DongwonTTuna-Labs/home-server-infra/.github/actions/setup-codex-relay@main
        with:
          codex-home: ${{ runner.temp }}/codex-relay-home-${{ github.job }}
          trusted-actors: DongwonTTuna,codex-reviewer-for-dongwonttuna[bot]
      - name: Prepare semantic patch safety schema
        run: |
          mkdir -p trusted/codex-review-artifacts/schemas
          workflow-helper/setup/codex-review/bin/codex-review schema openai-strict --schema stage06-semantic-patch-safety.v1 --out trusted/codex-review-artifacts/schemas/stage06-semantic-patch-safety.v1.openai.schema.json
      - name: Run Codex semantic patch safety model
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        env:
          AI_RELAY_API_KEY: ${{ steps.relay-token.outputs.relay_token }}
        with:
          prompt-file: ${{ github.workspace }}/trusted/codex-review-artifacts/stage06/semantic-safety-prompt.md
          output-file: ${{ github.workspace }}/trusted/codex-review-artifacts/stage06/semantic-safety.raw.json
          output-schema-file: ${{ github.workspace }}/trusted/codex-review-artifacts/schemas/stage06-semantic-patch-safety.v1.openai.schema.json
          working-directory: ${{ github.workspace }}/pr-head
          sandbox: read-only
          safety-strategy: read-only
          codex-args: ${{ steps.relay-token.outputs.codex_args }}
          codex-home: ${{ runner.temp }}/codex-relay-home-${{ github.job }}
          allow-users: DongwonTTuna
          allow-bots: true
          allow-bot-users: codex-reviewer-for-dongwonttuna[bot]
      - name: Validate semantic patch safety result
        run: workflow-helper/setup/codex-review/bin/codex-review stage06 validate-semantic-safety --in trusted/codex-review-artifacts/stage06/semantic-safety.raw.json --inventory trusted/codex-review-artifacts/stage06/merged-fix.json --out trusted/codex-review-artifacts/stage06/semantic-safety.json
      - id: semantic_safety_outputs
        run: workflow-helper/setup/codex-review/bin/codex-review stage06 write-semantic-safety-outputs --in trusted/codex-review-artifacts/stage06/semantic-safety.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-stage06-semantic-safety
          path: trusted/codex-review-artifacts/stage06

  push_validate_no_token:
    name: 07 validate patch without token
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [bootstrap_event, fix_collect_and_merge, semantic_patch_safety_model]
    if: always() && needs.fix_collect_and_merge.result == 'success'
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      validation_status: ${{ steps.validation_result.outputs.validation_status }}
      requires_push_token: ${{ steps.validation_result.outputs.requires_push_token }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ needs.bootstrap_event.outputs.head_repo_full_name || github.repository }}
          ref: ${{ needs.bootstrap_event.outputs.head_sha || github.sha }}
          path: pr-head
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install trusted codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-event
          path: trusted/codex-review-artifacts/event
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-stage05-06
          path: trusted/codex-review-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: codex-review-stage06-semantic-safety
          path: trusted/codex-review-artifacts/stage06
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: codex-review-stage03
          path: trusted/codex-review-artifacts/stage03
      - env:
          CODEX_REVIEW_ARTIFACT_ROOT: ${{ github.workspace }}/trusted/codex-review-artifacts
        run: workflow-helper/setup/codex-review/bin/codex-review stage07 validate-fix --in trusted/codex-review-artifacts/stage06/merged-fix.json --semantic-safety trusted/codex-review-artifacts/stage06/semantic-safety.json --pr-context trusted/codex-review-artifacts/event/pr-context.json --repo-path pr-head --out trusted/codex-review-artifacts/stage07/validated-fix.json
      - name: Check autofix loop budget (oscillation / round cap)
        run: workflow-helper/setup/codex-review/bin/codex-review stage07 check-loop-budget --in trusted/codex-review-artifacts/stage07/validated-fix.json --result trusted/codex-review-artifacts/stage06/merged-fix.json --design-plan trusted/codex-review-artifacts/stage03/design-plan.json --loop-state trusted/codex-review-artifacts/event/loop-state.json --out trusted/codex-review-artifacts/stage07/validated-fix.json
      - id: validation_result
        run: workflow-helper/setup/codex-review/bin/codex-review stage07 write-validation-outputs --in trusted/codex-review-artifacts/stage07/validated-fix.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-stage07-validation
          path: trusted/codex-review-artifacts/stage07

  issue_fallback_trusted:
    name: 09 issue fallback trusted
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [bootstrap_event, review_publish_trusted, design_publish_trusted, semantic_patch_safety_model, push_validate_no_token]
    if: |
      always() &&
      needs.bootstrap_event.result == 'success' &&
      (
        needs.bootstrap_event.outputs.openspec_decision == 'missing_openspec_spec' ||
        needs.review_publish_trusted.outputs.has_deferred_issue_items == 'true' ||
        (needs.design_publish_trusted.outputs.route == 'run_stage05' && needs.bootstrap_event.outputs.same_repo != 'true') ||
        needs.design_publish_trusted.outputs.route == 'stop_needs_human' ||
        needs.semantic_patch_safety_model.result == 'failure' ||
        needs.push_validate_no_token.result == 'failure' ||
        needs.push_validate_no_token.outputs.validation_status == 'no_fix' ||
        needs.push_validate_no_token.outputs.validation_status == 'blocked' ||
        needs.push_validate_no_token.outputs.validation_status == 'no_diff_repeat' ||
        needs.push_validate_no_token.outputs.validation_status == 'empty_patch' ||
        needs.push_validate_no_token.outputs.validation_status == 'tests_failed' ||
        needs.push_validate_no_token.outputs.validation_status == 'validation_failed' ||
        needs.push_validate_no_token.outputs.validation_status == 'semantic_safety_missing' ||
        needs.push_validate_no_token.outputs.validation_status == 'semantic_safety_rejected' ||
        needs.push_validate_no_token.outputs.validation_status == 'semantic_safety_hash_mismatch' ||
        needs.push_validate_no_token.outputs.validation_status == 'oscillation_detected' ||
        needs.push_validate_no_token.outputs.validation_status == 'max_rounds_reached'
      )
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-event
          path: codex-review-artifacts/event
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: codex-review-stage02
          path: codex-review-artifacts/stage02
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: codex-review-stage04
          path: codex-review-artifacts/stage04
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: codex-review-stage07-validation
          path: codex-review-artifacts/stage07
      - run: |
          mkdir -p codex-review-artifacts/stage09
          REASON="${{ needs.review_publish_trusted.outputs.has_deferred_issue_items == 'true' && 'stage02_defer_to_issue' || needs.bootstrap_event.outputs.openspec_decision == 'missing_openspec_spec' && 'missing_openspec_spec' || (needs.design_publish_trusted.outputs.route == 'run_stage05' && needs.bootstrap_event.outputs.same_repo != 'true' && 'fork_pr_push_blocked') || (needs.semantic_patch_safety_model.result == 'failure' && 'semantic_safety_model_failed') || (needs.push_validate_no_token.result == 'failure' && 'stage07_validation_job_failed') || (needs.push_validate_no_token.outputs.validation_status != '' && needs.push_validate_no_token.outputs.validation_status != 'validated' && needs.push_validate_no_token.outputs.validation_status) || needs.design_publish_trusted.outputs.route || 'issue_fallback' }}"
          INPUT_ARG=()
          if [ "$REASON" = "stage02_defer_to_issue" ] && [ -f codex-review-artifacts/stage02/review-publication.json ]; then
            INPUT_ARG=(--in codex-review-artifacts/stage02/review-publication.json)
          fi
          workflow-helper/setup/codex-review/bin/codex-review stage09 plan "${INPUT_ARG[@]}" --mode "$REASON" --pr-context codex-review-artifacts/event/pr-context.json --openspec-context codex-review-artifacts/event/openspec-context.json --out codex-review-artifacts/stage09/issue-fallback-plan.json
      - id: app_token
        env:
          CODEX_REVIEW_GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_GITHUB_APP_ID }}
          CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_APP_PRIVATE_KEY }}
          CODEX_APP_ID: ${{ secrets.CODEX_APP_ID }}
          CODEX_APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
        run: workflow-helper/setup/codex-review/bin/codex-review auth app-token --mode stage09 --pr-context codex-review-artifacts/event/pr-context.json --out codex-review-artifacts/stage09/app-token.json
      - env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          CODEX_REVIEW_APP_TOKEN_PERMISSIONS_JSON: ${{ steps.app_token.outputs.permissions_json }}
        run: workflow-helper/setup/codex-review/bin/codex-review stage09 apply --in codex-review-artifacts/stage09/issue-fallback-plan.json --pr-context codex-review-artifacts/event/pr-context.json --out codex-review-artifacts/stage09/issue-fallback-result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-stage09
          path: codex-review-artifacts/stage09

  push_trusted:
    name: 07 commit and push trusted
    runs-on:
      group: "Home Server Runners"
      labels: dongwontuna-labs-runner
    needs: [bootstrap_event, push_validate_no_token, issue_fallback_trusted]
    if: always() && needs.push_validate_no_token.outputs.requires_push_token == 'true' && needs.issue_fallback_trusted.result == 'skipped'
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      push_status: ${{ steps.push_result.outputs.push_status }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ needs.bootstrap_event.outputs.head_repo_full_name || github.repository }}
          ref: ${{ needs.bootstrap_event.outputs.head_sha || github.sha }}
          path: pr-head
          persist-credentials: false
      - name: Checkout workflow helper
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: workflow-helper
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
      - name: Install trusted codex-review helper
        run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-event
          path: trusted/codex-review-artifacts/event
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-stage05-06
          path: trusted/codex-review-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: codex-review-stage07-validation
          path: trusted/codex-review-artifacts/stage07
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: codex-review-stage03
          path: trusted/codex-review-artifacts/stage03
      - id: app_token
        env:
          CODEX_REVIEW_GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_GITHUB_APP_ID }}
          CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_APP_PRIVATE_KEY }}
          CODEX_APP_ID: ${{ secrets.CODEX_APP_ID }}
          CODEX_APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
        run: workflow-helper/setup/codex-review/bin/codex-review auth app-token --mode push --pr-context trusted/codex-review-artifacts/event/pr-context.json --out trusted/codex-review-artifacts/stage07/app-token.json
      - env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          CODEX_REVIEW_APP_TOKEN_PERMISSIONS_JSON: ${{ steps.app_token.outputs.permissions_json }}
          CODEX_REVIEW_ARTIFACT_ROOT: ${{ github.workspace }}/trusted/codex-review-artifacts
        run: workflow-helper/setup/codex-review/bin/codex-review stage07 commit-push --in trusted/codex-review-artifacts/stage06/merged-fix.json --validation trusted/codex-review-artifacts/stage07/validated-fix.json --pr-context trusted/codex-review-artifacts/event/pr-context.json --repo-path pr-head --out trusted/codex-review-artifacts/stage07/push-result.json
      - id: push_result
        run: workflow-helper/setup/codex-review/bin/codex-review stage07 write-outputs --in trusted/codex-review-artifacts/stage07/push-result.json
      - id: app_token_loop_state
        if: steps.push_result.outputs.push_status == 'pushed'
        env:
          CODEX_REVIEW_GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_GITHUB_APP_ID }}
          CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_ID: ${{ secrets.CODEX_REVIEW_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.CODEX_REVIEW_APP_PRIVATE_KEY }}
          CODEX_APP_ID: ${{ secrets.CODEX_APP_ID }}
          CODEX_APP_PRIVATE_KEY: ${{ secrets.CODEX_APP_PRIVATE_KEY }}
        run: workflow-helper/setup/codex-review/bin/codex-review auth app-token --mode loop-state --pr-context trusted/codex-review-artifacts/event/pr-context.json --out trusted/codex-review-artifacts/stage07/loop-state-token.json
      - name: Record push into loop state history
        if: steps.push_result.outputs.push_status == 'pushed'
        env:
          GITHUB_TOKEN: ${{ steps.app_token_loop_state.outputs.token }}
          CODEX_REVIEW_APP_TOKEN_PERMISSIONS_JSON: ${{ steps.app_token_loop_state.outputs.permissions_json }}
        run: workflow-helper/setup/codex-review/bin/codex-review stage07 record-push --in trusted/codex-review-artifacts/stage07/push-result.json --result trusted/codex-review-artifacts/stage06/merged-fix.json --design-plan trusted/codex-review-artifacts/stage03/design-plan.json --loop-state trusted/codex-review-artifacts/event/loop-state.json --pr-context trusted/codex-review-artifacts/event/pr-context.json --out trusted/codex-review-artifacts/stage07/loop-state-record.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-stage07
          path: trusted/codex-review-artifacts/stage07
