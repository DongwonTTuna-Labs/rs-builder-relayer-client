        with:
          name: codex-review-stage04
          path: codex-review-artifacts/stage04
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: codex-review-stage07
          path: codex-review-artifacts/stage07
      - run: |
          mkdir -p codex-review-artifacts/stage09
          REASON="${{ needs.review_publish_trusted.outputs.has_deferred_issue_items == 'true' && 'stage02_defer_to_issue' || needs.bootstrap_event.outputs.openspec_decision == 'missing_openspec_spec' && 'missing_openspec_spec' || (needs.design_publish_trusted.outputs.route == 'run_stage05' && needs.bootstrap_event.outputs.same_repo != 'true' && 'fork_pr_push_blocked') || (needs.semantic_patch_safety_model.result == 'failure' && 'semantic_safety_model_failed') || (needs.push_validate_no_token.result == 'failure' && 'stage07_validation_job_failed') || (needs.push_validate_no_token.outputs.validation_status != '' && needs.push_validate_no_token.outputs.validation_status != 'validated' && needs.push_validate_no_token.outputs.validation_status) || needs.push_trusted.outputs.push_status || (needs.push_trusted.result == 'failure' && 'stage07_push_job_failed') || (needs.push_trusted.result == 'skipped' && needs.design_publish_trusted.outputs.route == 'run_stage05' && needs.bootstrap_event.outputs.same_repo == 'true' && 'stage07_push_job_skipped') || needs.design_publish_trusted.outputs.route || 'issue_fallback' }}"
          INPUT_ARG=()
          if [ "$REASON" = "stage02_defer_to_issue" ] && [ -f codex-review-artifacts/stage02/review-publication.json ]; then
            INPUT_ARG=(--in codex-review-artifacts/stage02/review-publication.json)
          fi
          workflow-helper/setup/codex-review/bin/codex-review stage09 plan "${INPUT_ARG[@]}" --mode "$REASON" --pr-context codex-review-artifacts/event/pr-context.json --openspec-context codex-review-artifacts/event/openspec-context.json --out codex-review-artifacts/stage09/issue-fallback-plan.json
      - id: app_token
