          workflow-helper/setup/codex-review/bin/codex-review schema openai-strict --schema stage03-design-plan.v1 --out codex-review-artifacts/schemas/stage03-design-plan.v1.openai.schema.json
      - name: Collect cluster analyses and build design plan prompt
        run: |
          mkdir -p codex-review-artifacts/stage03-analysis-downloads
          workflow-helper/setup/codex-review/bin/codex-review stage03 collect-analyses --artifacts codex-review-artifacts/stage03-analysis-downloads --out codex-review-artifacts/stage03/cluster-analysis.json
