name: Setup codex-review helper
description: Checkout the trusted workflow-helper at the workflow SHA and install the codex-review CLI.

runs:
  using: composite
  steps:
    - name: Checkout workflow helper
      uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.workflow_sha }}
        path: workflow-helper
        persist-credentials: false
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: workflow-helper/setup/codex-review/pyproject.toml
    - name: Install codex-review helper
      shell: bash
      run: python3 -m pip install --disable-pip-version-check -e workflow-helper/setup/codex-review
